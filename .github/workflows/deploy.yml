name: Deploy live (GitHub Pages)

# main 에 push 되면 라이브 사이트로 배포한다.
# draft/dev 파일도 Git에는 같이 보관한다.
# Pages에는 confirmed/live 인덱스(index.html)와 작업자용 dev 인덱스(index.dev.html)을 함께 올린다.
# 다만 내부 제품문서·로컬 환경 파일은 제외한다.
# → index.html은 confirmed만, index.dev.html은 draft+confirmed를 렌더한다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Pages site (worker dev entry included)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='/*.md' \
            --exclude='*.gsheet' \
            --exclude='.DS_Store' \
            --exclude='._*' \
            ./ _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
