<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>올댓아라빅 교재 모바일 (1.4.4 m-draft)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/spoqa/spoqa-han-sans@latest/css/SpoqaHanSansNeo.css" rel="stylesheet">
<style>
/* ───────── 디자인 토큰 (교재와 공유) ───────── */
:root {
  --bg:        #F3F5F1;            /* 페이지 배경 — 차가운 네이비 베이스가 아닌 중립/약간 따뜻한 light gray */
  --surface:   #ffffff;
  --accent:    #1D49FF;            /* 액센트만 파랑 (브랜드 컬러 유지) */
  --accent-bg: rgba(29,73,255,0.08);
  --warm:      #F4C45B;
  --mint:      #DDEFE8;
  --hl-text:   #3554C6;            /* `*…*` 색 강조 — 액센트 계열이라 파랑 유지 */
  --text:      #1a1f29;            /* 본문 — soft black charcoal (네이비 #12205A 아님) */
  --sub:       #6E7591;            /* 보조 — 중립 gray (blue tint 최소화) */
  --border:    #DDE2EE;            /* 구분선 — 매우 옅은 중립 light gray */
  --border-soft:#E9ECF3;
  --soft:      #f9fafc;
  --shadow:    0 1px 3px rgba(29,73,255,0.06), 0 0 0 1px rgba(29,73,255,0.03);
  --r-sm: 8px; --r-md: 12px; --r-lg: 18px;
  --max-w: 440px;  /* 모바일 폰 폭에 가깝게 — 데스크톱에서도 폰 시뮬레이션 룩 */
  --font-kr: 'Spoqa Han Sans Neo','Apple SD Gothic Neo',sans-serif;
  --font-ar: 'Noto Sans Arabic', serif;
  --ar-card-size: clamp(0.98rem, 4vw, 1.12rem);
  --ar-nass-size: 16px;   /* 드릴 아랍어(.drill-cell .dc-ar 16px)와 동일 크기로 맞춤 */
  --ar-pattern-size: clamp(1.2rem, 5.2vw, 1.55rem);
  --trans-size: 10px;
  --ko-size: 11px;
  --script-size: 11px;
}
*,*::before,*::after { box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:var(--font-kr); -webkit-text-size-adjust:100%; }
button { font-family:var(--font-kr); cursor:pointer; border:none; background:none; color:inherit; }

/* ───────── 앱 셸 ───────── */
.m-app {
  display:flex; flex-direction:column;
  height:100dvh; max-width:var(--max-w);
  margin:0 auto; background:var(--bg);
  position:relative;
}
/* viewport가 모바일 max-width(440px)보다 크면 데스크톱 카드형 — 폰 시뮬레이션 룩 */
@media (min-width:461px) {
  .m-app {
    margin-top:28px; margin-bottom:28px;
    height:calc(100dvh - 56px);
    border-radius:var(--r-lg);
    border:1px solid var(--border);
    box-shadow:0 2px 24px rgba(29,73,255,0.08);
    overflow:hidden;
  }
}

/* 한국어 토글 — 공간은 유지(visibility). 음가(.m-trans)도 함께 가림 (전 앱 공통 규칙) */
.m-app.hide-korean .m-ko,
.m-app.hide-korean .m-trans { visibility:hidden; }

/* ───────── 상단바 (48px) ───────── */
.m-head {
  flex-shrink:0; height:56px;
  display:flex; align-items:center; gap:8px;
  padding:0 12px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
}
.m-burger {
  width:36px; height:36px;
  display:flex; align-items:center; justify-content:center;
  font-size:20px; color:var(--sub); border-radius:var(--r-sm);
}
.m-burger:active { background:var(--accent-bg); color:var(--accent); }
.m-title {
  flex:1; min-width:0;
  display:flex;
  align-items:baseline;
  gap:8px;
}
.m-unit {
  flex:0 0 auto;
  font-size:11px; font-weight:700; letter-spacing:1.5px;
  color:var(--accent);
}
.m-unit-ar {
  flex:0 1 auto;
  font-family:var(--font-ar); direction:rtl; unicode-bidi:isolate;
  font-size:14px; font-weight:700; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:36%;
}
.m-unit-ko {
  flex:1 1 auto;
  min-width:0;
  font-size:10px;
  color:var(--sub);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.m-counter {
  flex-shrink:0;
  font-size:11px; color:var(--sub);
  font-variant-numeric:tabular-nums;
  letter-spacing:.3px;
}

/* ───────── 섹션 탭 (44px) ───────── */
.m-tabs {
  flex-shrink:0; height:44px;
  display:flex; align-items:stretch;
  border-bottom:1px solid var(--border);
  background:var(--surface);
}
/* 7과부터 패턴 우선 배열: 패턴 → 드릴 → 표현 → 지문 → 단어 */
.m-tabs[data-order="ptn-first"] .m-tab[data-sec="ptn"]     { order: 1; }
.m-tabs[data-order="ptn-first"] .m-tab[data-sec="drill"]   { order: 2; }
.m-tabs[data-order="ptn-first"] .m-tab[data-sec="exp"]     { order: 3; }
.m-tabs[data-order="ptn-first"] .m-tab[data-sec="nass"]    { order: 4; }
.m-tabs[data-order="ptn-first"] .m-tab[data-sec="kalimat"] { order: 5; }
.m-tab {
  flex:1; display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:600; color:var(--sub);
  position:relative;
  transition:color .12s;
}
.m-tab[data-disabled="1"] { opacity:.32; pointer-events:none; }
.m-tab.active { color:var(--accent); }
.m-tab.active::after {
  content:''; position:absolute; left:14%; right:14%; bottom:-1px;
  height:2px; background:var(--accent); border-radius:2px 2px 0 0;
}

/* ───────── 콘텐츠 (스크롤) ───────── */
.m-body {
  flex:1; overflow:hidden;
  background:var(--bg);
  position:relative;
  touch-action:pan-y;          /* 가로 동작은 앱이 처리 (드래그 페이지 이동) */
  overscroll-behavior-x:none;  /* iOS Safari swipe-back 차단 */
}
.m-body::-webkit-scrollbar { width:0; }

/* 3-pane 캐러셀 — [prev | current | next], 가운데 보이도록 -33.333% */
.m-strip {
  display:flex;
  width:300%;
  height:100%;
  transition:transform .26s cubic-bezier(.2,.8,.2,1);
  will-change:transform;
}
.m-strip.dragging { transition:none; }
.m-pane {
  flex:0 0 33.3333%;
  height:100%;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
.m-pane::-webkit-scrollbar { width:0; }
.m-page {
  padding:12px 14px 18px;
  display:flex; flex-direction:column; gap:10px;
}
.m-empty {
  margin:80px 20px; text-align:center;
  font-size:13px; color:var(--sub); line-height:1.7;
}

/* ───────── 카드 공통 ───────── */
.m-card {
  background:var(--surface);
  border-radius:var(--r-md);
  box-shadow:var(--shadow);
  padding:13px 14px;
  display:flex; flex-direction:column; gap:6px;
  position:relative;
}
/* kalimat+ — 일반 단어와 아주 살짝 구분 (옅은 회색 음영) */
.m-card.kalimat-plus { background:#f5f6f9; }
.hl-text { color:var(--hl-text); font-weight:inherit; }
/* 명사문 구분자 (`css = 'nom'`) — 시작어 ‖ 서술어 */
.nom-divider {
  display:inline-block;
  color:var(--sub);
  opacity:.4;
  font-size:.55em;     /* 부모 폰트의 55% — 세로 길이 작게 */
  font-weight:200;     /* 얇게 */
  margin:0 .5em;
  vertical-align:.2em; /* 살짝 위로 — 글자 중앙 부근에 위치 */
  user-select:none;
}
.m-trans .hl-text,
.m-ko .hl-text,
.m-summary .hl-text { font-weight:700; }
/* Arabic 글리프가 포함된 강조는 weight 변경 금지 — Safari/CoreText의
   weight 경계에서 텍스트 런이 쪼개져 셰이핑(글자 연결)이 끊긴다.
   색만 적용하고 굵기는 부모로 상속 (예: الْقَ*مَر*) */
.hl-text.hl-ar { font-weight: inherit !important; }
.hl-box-inline {
  border:1.5px solid var(--accent);
  border-radius:6px;
  padding:.05em .35em;
  color:var(--accent);
}
.m-hero {
  width:100%;
  height:auto;
  display:block;
  border-radius:0;
}
.m-hero-wrap {
  position:relative;
  width:100%;
  overflow:hidden;
}
.m-hero-fallback {
  position:absolute;
  inset:0;
  display:none;
  place-items:center;
  padding:18px;
  text-align:center;
  font-size:12px;
  line-height:1.55;
  color:var(--sub);
  border:1px dashed rgba(18,32,90,.18);
}
.m-hero-wrap.failed .m-hero { visibility:hidden; }
.m-hero-wrap.failed .m-hero-fallback { display:grid; }
.m-script {
  margin-top:10px;
  padding-top:12px;
  border-top:1px solid var(--border-soft);
  font-size:var(--script-size);
  line-height:1.6;
  color:var(--sub);
  text-align:left;
  white-space:pre-line;
}
.m-instruction {
  padding:0 4px;
  font-size:13px;
  line-height:1.65;
  color:var(--text);
  text-align:center;
}
.m-subsection {
  display:flex;
  flex-direction:column;
  gap:12px;
}
.m-subsection + .m-subsection { margin-top:14px; }
.m-subtitle {
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 4px;
  font-size:11px;
  font-weight:700;
  color:var(--sub);
  letter-spacing:1.3px;
  text-transform:uppercase;
}
.m-subtitle::before {
  content:'';
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--warm);
}
.m-card .m-ar {
  font-family:var(--font-ar); direction:rtl;
  font-size:var(--ar-card-size); font-weight:500; line-height:1.45;
  color:var(--text); text-align:center;
  padding:2px 2px 1px;
}
.m-card .m-trans {
  font-size:var(--trans-size); color:var(--sub);
  text-align:center; line-height:1.4;
  font-style:italic; font-weight:400;
  letter-spacing:.2px;
}
.m-card .m-ko {
  font-size:var(--ko-size); color:var(--text);
  font-weight:500;
  text-align:center; line-height:1.4;
}
.m-pair {
  display:grid;
  grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr);
  gap:10px;
  align-items:start;
}
.m-pair-left {
  text-align:left;
  min-width:0;
}
.m-pair-right {
  min-width:0;
  text-align:right;
  display:flex; flex-direction:column; gap:5px;  /* 아랍어 ↔ 음가 간격 */
}
.m-pair-right .m-ar,
.m-pair-right .m-trans {
  text-align:right;
}
.m-pair-left .m-ko {
  text-align:left;
}
/* max-width가 440px이라 데스크톱에서도 모바일과 같은 폰트/그리드 유지 — 별도 오버라이드 없음 */
.m-flag {
  display:inline-block;
  width:12px; height:12px;
  border-radius:50%;
  vertical-align:middle;
  opacity:1;
  flex-shrink:0;
}
.m-flags {
  display:inline-flex;
  align-items:center;
  gap:4px;
  vertical-align:middle;
}
/* 아랍어 라인 안 인라인 깃발 (표현/래퍼토리 페어/드릴 non-five) */
.m-ar-line {
  display:flex;
  align-items:center;
  justify-content:flex-start;  /* RTL에서 start = 오른쪽 */
  gap:6px;
  direction:rtl;
}
.m-ar-line .m-ar { padding:0; }
/* 나스 카드 — 좌측 한국어 칸 하단 깃발 */
.m-pair-left .m-flags {
  margin-top:8px;
  justify-content:flex-start;
}
/* 5열 모드만 깃발 미표시 (좁은 칸). 2열 모드는 깃발 표시 */
.m-rep-grid:not(.cols-two) .m-flags,
.m-drill-grid:not(.cols-two) .m-flags { display:none; }

/* 탭 가능한 아랍어 (오디오) */
.tap-audio { cursor:pointer; transition:color .18s; }
.tap-audio:active { opacity:.7; }
.tap-audio.playing { color:var(--accent) !important; }

/* ───────── 패턴 카드 ───────── */
.m-card.pattern {
  gap:14px;
  padding:20px 16px;
}
.m-card.pattern .m-ar {
  font-size:var(--ar-pattern-size);
  font-weight:600;
  padding:14px 4px 8px;
}
.m-card.pattern .m-ko {
  font-size:12px;
  font-weight:600;
  margin-top:2px;
  line-height:1.7;
}
.m-card.pattern .m-trans {
  margin-top:0;
}
.m-card.pattern .m-summary {
  margin-top:10px;
  font-size:var(--script-size); line-height:1.65; color:var(--sub);
  text-align:left;
}
.m-card.pattern .m-summary .bullet {
  display:block; padding-left:14px; position:relative;
  margin:0;
  line-height:1.55;
  color:var(--sub);
}
.m-card.pattern .m-summary .bullet::before {
  content:'•'; color:var(--accent); position:absolute; left:2px; top:0;
}
/* 아랍어로 시작하는 불릿 → RTL: 점을 우측으로, 본문도 우측 정렬 */
.m-card.pattern .m-summary .bullet[dir="rtl"] {
  padding-left:0; padding-right:14px; text-align:right;
}
.m-card.pattern .m-summary .bullet[dir="rtl"]::before {
  left:auto; right:2px;
}
.m-card.pattern .m-summary .para {
  display:block;
  margin:0 0 16px;
}
/* 블릿 뒤에 이어지는 설명은 줄바꿈(간격)을 넣어 분리 (대표 지침) */
.m-card.pattern .m-summary .bullet + .para {
  margin-top:16px;
}
.m-card.pattern .m-summary .quote {
  display:block;
  margin:16px 0 0;
  padding:10px 12px;
  border-left:3px solid var(--accent);
  background:var(--accent-bg);
  border-radius:8px;
  color:var(--sub);
  line-height:1.55;
}
.m-card.pattern .m-summary .script-table,
.m-script .script-table {
  width:100%;
  table-layout:fixed;
  margin:10px 0 16px;
  border-collapse:separate;
  border-spacing:0;
  overflow:hidden;
  border:1px solid var(--border-soft);
  border-radius:8px;
  direction:ltr;
}
.m-card.pattern .m-summary .script-table td,
.m-card.pattern .m-summary .script-table th,
.m-script .script-table td,
.m-script .script-table th {
  padding:8px 9px;
  border-right:1px solid var(--border-soft);
  border-bottom:1px solid var(--border-soft);
  background:var(--surface);
  color:var(--text);
  font-size:11px;
  line-height:1.45;
  text-align:center;
  vertical-align:middle;
}
.m-card.pattern .m-summary .script-table tr:last-child td,
.m-card.pattern .m-summary .script-table tr:last-child th,
.m-script .script-table tr:last-child td,
.m-script .script-table tr:last-child th { border-bottom:0; }
.m-card.pattern .m-summary .script-table td:last-child,
.m-card.pattern .m-summary .script-table th:last-child,
.m-script .script-table td:last-child,
.m-script .script-table th:last-child { border-right:0; }
.m-card.pattern .m-summary .script-table th,
.m-script .script-table th {
  background:var(--soft);
  font-weight:700;
}
.m-card.pattern .m-summary .script-table [dir="rtl"],
.m-script .script-table [dir="rtl"] {
  font-family:var(--font-ar);
  font-size:15px;
  font-weight:500;
  text-align:center;
}

/* ───────── 패턴 + 히어로 이미지 (임시) ─────────
   pattern에 GCS 이미지가 있으면(id_ptn(no) 일치), 카드 상단에 이미지를 띄우고
   아랍어/한국어/음가 데이터는 숨김. 스크립트만 적정 간격을 두고 노출.
   이미지 실패 시 JS의 onFail에서 .pattern-with-hero 클래스 제거 → 일반 카드로 복원. */
.m-card.pattern.pattern-with-hero {
  padding-top: 0;            /* 이미지가 카드 상단 가장자리에 붙도록 위쪽 패딩 제거 */
  overflow: hidden;          /* 이미지가 카드 radius를 넘지 않게 */
}
.m-card.pattern.pattern-with-hero .m-hero-wrap {
  margin: 0 -16px;           /* 카드 좌우 패딩(16px) 상쇄해 가로폭 가득 채움 */
  width: calc(100% + 32px);
}
.m-card.pattern.pattern-with-hero .m-hero { width:100%; height:auto; display:block; }
/* 데이터 숨김 — 이미지가 패턴 정보를 대체 */
.m-card.pattern.pattern-with-hero .m-ar,
.m-card.pattern.pattern-with-hero .m-ko,
.m-card.pattern.pattern-with-hero .m-trans { display: none; }
/* 이미지 ↔ 스크립트 간격 */
.m-card.pattern.pattern-with-hero .m-summary {
  margin-top: 18px;
  padding: 0 4px 4px;
}

/* ───────── 표현·래퍼토리 카드 (작게, 인쇄 카드 느낌) ─────────
   래퍼토리 문장은 표현(exp)과 완전히 같은 양식. 5열 그리드는 한국어가 없는
   알파벳/발음 연습에만 사용한다. */
.m-card.exp,
.m-card.repertory { gap:7px; }
.m-card.exp .m-ar,
.m-card.repertory .m-ar { font-size:var(--ar-nass-size); }
/* 페어 모드 레퍼토리 — 개별 카드들을 묶는 투명 컨테이너 */
.m-rep-wrap {
  display:flex; flex-direction:column; gap:8px;
}

/* ───────── 드릴 표 ───────── */
.m-drill-table {
  background:var(--surface);
  border-radius:var(--r-md);
  box-shadow:var(--shadow);
  padding:18px 10px;
}
.m-rep-grid,
.m-drill-grid {
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:14px 4px;
  direction:rtl;
}
@media (max-width:480px) {
  .m-rep-grid:not(.cols-two),
  .m-drill-grid:not(.cols-two) { grid-template-columns:repeat(4, 1fr); gap:14px 2px; }
}
/* 2열 모드 (`css = 'two'`) — 박스가 좌우로 2개씩 */
.m-rep-grid.cols-two,
.m-drill-grid.cols-two {
  grid-template-columns:1fr 1fr;
  gap:10px;
  direction:ltr;  /* 박스 배치는 좌→우 */
}
.cols-two .drill-cell {
  flex-direction:row;
  align-items:flex-start;
  background:var(--surface);
  border:1px solid rgba(18,32,90,0.07);
  border-radius:10px;
  padding:14px 12px 15px;  /* 한국어 2줄+깃발 넉넉하게 — 위아래 여유 */
  box-shadow:0 1px 2px rgba(18,32,90,0.035);
  gap:10px;
}
.cols-two .dc-body { flex:1 1 auto; display:flex; flex-direction:column; gap:3px; min-width:0; }
.cols-two .m-ar-line {
  justify-content:flex-start;  /* RTL: start = 오른쪽 */
  direction:rtl;
  flex-wrap:wrap;   /* 긴 문장+깃발이 칸을 넘치면 깃발이 아래로 내려가 칸이 안 깨짐 */

<script>
/* ============================================================
   ATA 1.4.4 — 교재 모바일 앱 초안 (textbook144m.html)
   - 페이지 = 교재 페이지 단위 (한 페이지가 길면 스크롤)
   - 글로벌 페이지 시퀀스: 표현 → 패턴(N) → 드릴 → 지문
   - ◀▶ = 글로벌 페이지 이동 / 섹션 탭 = 해당 섹션 첫 페이지로 점프
   ============================================================ */

const SHEET_ID    = '1cFamlN6FjnIiRLTBl3OsAPbHTPiQYKJUio4caR-7Lm4';
const AUDIO_BASE  = 'https://storage.googleapis.com/all-that-arabic-145/audio';
const IMG_BASE    = 'https://storage.googleapis.com/all-that-arabic-145/img';
const IMG_LOCAL_BASE = '../img';

// 1.4.5 실제 탭명. rep/drill/exp/kalimat 는 데이터시트sheet 단일 탭을 공유(type 열로 구분).
const TABS = {
  units:   '유닛unit',
  pattern: '패턴pattern',
  drill:   '데이터시트sheet',
  exp:     '데이터시트sheet',
  repertory:'데이터시트sheet',
  nass:    '데이터시트sheet',
  kalimat: '데이터시트sheet',
};

const LAHJA_FLAG = {
  EGY: '../assets/icons/icon-egypt.png',
  EGP: '../assets/icons/icon-egypt.png',
  LEV: '../assets/icons/icon-lebanon.png',
  GLF: '../assets/icons/icon-saudi.png',
};

// 섹션 메타 (라벨 lookup 용도) — 실제 순서는 isPatternFirst(unit)에 따라 동적 결정
const SECTIONS = [
  { key:'exp',   label:'표현', long:'expression' },
  { key:'ptn',   label:'패턴', long:'pattern' },
  { key:'drill', label:'드릴', long:'drill' },
  { key:'nass',  label:'지문', long:'nass' },
  { key:'kalimat', label:'단어', long:'kalimat' },
];

// 유닛 번호 파싱 (A07 → 7)
const unitNum = u => {
  const m = String(u || '').match(/(\d+)/);
  return m ? parseInt(m[1], 10) : 0;
};
// 6과부터 패턴 먼저 시작: 패턴 → 드릴 → 표현 → 지문 → 단어
// 1~5과는 표현 먼저: 표현 → 패턴 → 드릴 → 지문 → 단어 (알파벳 학습 시기)
const isPatternFirst = u => unitNum(u) >= 6;
const sectionOrderFor = u => isPatternFirst(u)
  ? ['ptn', 'drill', 'exp', 'nass', 'kalimat']
  : ['exp', 'ptn', 'drill', 'nass', 'kalimat'];

/* ───────── 상태 ───────── */
const state = {
  unit:        'A001',
  pages:       [],     // [{sec, kind, ...}]   글로벌 페이지 시퀀스
  page:        0,      // 글로벌 인덱스
  units:       [],
  hideKorean: false,
  audioId:     null,
};

/* ═══════════ 1.4.5 스키마 호환 계층 (v1.4.5-compat) ═══════════
   1.4.5 통합 시트를 레거시(1.4.4) 렌더 코드에 연결한다.
   - 탭: 한글+영문 실제 탭명으로 매핑. rep/drill/exp/kalimat 는 데이터시트sheet 단일 탭.
   - 링크: 패턴 ptn(p001) → id_ptn(no)/ref_ptn, 유닛은 U(A001) 그대로.
   - 타입: rep→repertory, drill/drill+→drilla(레이아웃은 css 열로 분기). */
const TAB_145 = {
  units:'유닛unit', unit:'유닛unit', pattern:'데이터시트sheet',
  repertory:'데이터시트sheet', drill:'데이터시트sheet', expression:'데이터시트sheet',
  exp:'데이터시트sheet', kalimat:'데이터시트sheet', sheet:'데이터시트sheet',
  nass:'나쓰nass', alam:'고유명사alam', appendix:'어펜딕스appendix',
};
const resolveTab145 = n => TAB_145[String(n||'').toLowerCase().trim()] || n;
const TYPE_145 = { rep:'repertory', drill:'drilla', 'drill+':'drilla' };
function compat145(r) {
  if (!r || typeof r !== 'object') return r;
  const t = String(r.type||'').toLowerCase().trim();
  if (TYPE_145[t]) r.type = TYPE_145[t];
  const p = String(r.ptn||'').trim();
  if (p) { if (!r['id_ptn(no)']) r['id_ptn(no)']=p; if (!r.id_ptn) r.id_ptn=p; if (!r.ref_ptn) r.ref_ptn=p; }
  return r;
}
// 표현 이미지 = type=expi 행. 파일명은 그 행의 id 값 그대로 사용한다.
const rowType = r => String((r && r.type) || '').toLowerCase().trim();
const isExpi = r => rowType(r) === 'expi';
const isAppExpression = r => rowType(r) === 'expi' || rowType(r) === 'exp' || rowType(r) === 'exp+';
const imageId = r => isExpi(r) ? String((r && r.id) || '').trim() : '';

/* ───────── JSONP 로더 ───────── */
const _cache = {};
function fetchSheet(name) {
  const real = resolveTab145(name);
  if (_cache[real]) return Promise.resolve(_cache[real]);
  return new Promise((resolve, reject) => {
    const cb = '__gviz_' + real.replace(/\W/g,'') + '_' + Date.now();
    const timer = setTimeout(() => { delete window[cb]; reject(new Error('Timeout: '+real)); }, 15000);
    window[cb] = resp => {
      clearTimeout(timer); delete window[cb];
      if (script.parentNode) script.parentNode.removeChild(script);
      try {
        if (!resp?.table) throw new Error('No data: '+real);
        const headers = resp.table.cols.map(c => (c.label||'').toLowerCase().trim());
        const rows = (resp.table.rows||[]).map(row => {
          const obj = {};
          headers.forEach((h,i) => {
            if (!h) return;
            const cell = row.c?.[i];
            const v = cell && cell.v != null
              ? (cell.f != null && (typeof cell.v==='number'||String(cell.v).startsWith('Date(')) ? cell.f : cell.v)
              : null;
            obj[h] = v != null ? String(v).trim() : '';
          });
          return compat145(obj);
        }).filter(r => Object.values(r).some(v => v !== ''));
        _cache[real] = rows; resolve(rows);
      } catch(e) { reject(e); }
    };
    const script = document.createElement('script');
    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&sheet=${encodeURIComponent(real)}&headers=1`;
    script.onerror = () => { clearTimeout(timer); delete window[cb]; reject(new Error('Load fail: '+real)); };
    document.head.appendChild(script);
  });
}

/* ───────── 유틸 ───────── */
// 실행 환경 — dev(localhost/file)인지 prod인지
try{const _dp=new URLSearchParams(location.search).get('dev');if(_dp==='1')localStorage.setItem('ata_dev','1');else if(_dp==='0')localStorage.removeItem('ata_dev');}catch(e){}
const IS_DEV = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || location.protocol === 'file:' || (()=>{try{return localStorage.getItem('ata_dev')==='1';}catch(e){return false;}})();
// 노출 규칙: confirmed = dev·prod 모두 / draft = dev에서만 / 그 외 = 숨김
// (유닛·콘텐츠 행 공통 — 유닛을 여는 매커니즘의 기준)
const ok = r => {
  const s = (r.status || '').trim().toLowerCase();
  if (s === 'confirmed') return true;
  if (s === 'draft')     return IS_DEV;
  return false;
};
const inU  = (r,u) => (r.u||'') === u;
const norm = t => (t||'').toLowerCase().trim();
const normType = t => norm(t).replace(/\s+/g,'');

function parseInline(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>')
    .replace(/_([^_\n]+)_/g,'<span class="hl-box-inline">$1</span>')
    // *…* 안에 Arabic이 있으면 hl-ar 클래스 추가 → font-weight: inherit로
    //   Safari/CoreText의 weight 경계 셰이핑 끊김 방지 (예: الْقَ*مَر*)
    .replace(/\*([^*\n]+)\*/g, (_, m) => {
      const hasAr = /[؀-ۿݐ-ݿࢠ-ࣿﭐ-﷿ﹰ-﻿]/.test(m);
      return `<span class="hl-text${hasAr ? ' hl-ar' : ''}">${m}</span>`;
    });
}

// 첫 강한 방향 문자로 LTR/RTL 판정 — 마크업(`*_<tag>`) 제거 후 검사.
// 아랍어 시작 → 'rtl', 라틴/한글 시작 → 'ltr'. (불릿/산문에서 줄 단위로 사용)
function firstStrongDir(raw) {
  const t = String(raw || '').replace(/<[^>]+>/g, '').replace(/[*_]/g, '');
  for (const ch of t) {
    const c = ch.codePointAt(0);
    if ((c >= 0x0600 && c <= 0x06FF) || (c >= 0x0750 && c <= 0x077F) ||
        (c >= 0x08A0 && c <= 0x08FF) || (c >= 0xFB50 && c <= 0xFDFF) ||
        (c >= 0xFE70 && c <= 0xFEFF)) return 'rtl';
    if ((c >= 0x41 && c <= 0x5A) || (c >= 0x61 && c <= 0x7A) ||
        (c >= 0xAC00 && c <= 0xD7A3) || (c >= 0x3130 && c <= 0x318F)) return 'ltr';
  }
  return 'ltr';
}

function parseTrans(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>')
    .replace(/_([^_\n]+)_/g,'$1')
    .replace(/\*([^*\n]+)\*/g, (_, m) => {
      const hasAr = /[؀-ۿݐ-ݿࢠ-ࣿﭐ-﷿ﹰ-﻿]/.test(m);
      return `<span class="hl-text${hasAr ? ' hl-ar' : ''}">${m}</span>`;
    });
}

function parseDrillBlank(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>')
    .replace(/\*([^*\n]+)\*/g,'<span class="m-blank">$1</span>');
}

// 명사문 구분자 — `css = 'nom'` 행의 `|`를 옅은 회색 분리자로
function applyNomDivider(html) {
  return html.replace(/\s*\|\s*/g, '<span class="nom-divider">|</span>');
}
const isNomRow = r => (r.css || '').trim().toLowerCase() === 'nom';

function getRowId(r) {
  return r.id || r.id_unit || r['id_ptn(no)'] || r.id_ptn || r.id_drill ||
    r.id_rep || r.id_repertory || r.id_kalimat || r.id_expression || r.id_nass || '';
}

function fallbackAudioKey(row) {
  const note = (row.note || row.transliteration || '').trim();
  if (!note) return '';
  const type = normType(row.type);
  if (type === 'repertory' || type === 'repertorie') {
    return (/^_/.test(note) || /^(fatha|damma)$/i.test(note)) ? `rep_${note}` : `mit_${note}`;
  }
  if (type === 'drilla' || type === 'drillb' || type === 'drillc') return `dri_${note}`;
  if (type === 'exp') return `exp_${note}`;
  return '';
}

// dev(localhost)에서만 캐시 우회 — 오디오 수정 즉시 확인용.
// prod(github.io 등)는 쿼리 없이 GCS 1시간 캐시 그대로 (사용자 빠름).
// (IS_DEV는 위 유틸 섹션에서 정의)
function audioCacheBust(u) {
  return IS_DEV ? `${u}${u.includes('?') ? '&' : '?'}_dev=${Date.now()}` : u;
}

function audioUrlsFor(row) {
  if (row?.url) return [audioCacheBust(row.url.trim())];
  const id = getRowId(row) || fallbackAudioKey(row);
  if (!id) return [];
  const unit = row?.u || state.unit;
  const enc = encodeURIComponent(id.normalize('NFD')).replace(/%2C/gi, ',');
  // mp3 우선 시도 (작고 빠름) → 실패 시 wav 폴백 (audio-rules 규칙)
  return [
    audioCacheBust(`${AUDIO_BASE}/${unit}/${enc}.mp3`),
    audioCacheBust(`${AUDIO_BASE}/${unit}/${enc}.wav`),
  ];
}

function lahjaFlags(row) {
  return (row?.lahja || '')
    .toUpperCase()
    .split(/[,\s]+/)
    .map(k => LAHJA_FLAG[k])
    .filter(Boolean);
}

function renderFlags(row) {
  const flags = lahjaFlags(row);
  if (!flags.length) return '';
  return `<span class="m-flags">${flags.map(src => `<img class="m-flag" src="${src}" alt="">`).join('')}</span>`;
}

function getUnitRow(unit) {
  return (_cache[TABS.units] || []).find(r => r.u === unit && ok(r)) ||
    (_cache[TABS.units] || []).find(r => r.u === unit) || {};
}

function matchesUnit(row, unit, unitRow = getUnitRow(unit)) {
  return row.u === unit || (!!unitRow.id_unit && row.ref_unit === unitRow.id_unit);
}

function ptnRef(row) {
  return row?.id || row?.['id_ptn(no)'] || row?.id_ptn || '';
}

function refKey(value) {
  return String(value || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9가-힣ء-ي]/g, '');
}

function ptnNumOf(v) {
  const m = String(v || '').match(/^(ptn\d+)/i);
  return m ? m[1].toLowerCase() : '';
}
function sameRef(a, b) {
  if (refKey(a) && refKey(a) === refKey(b)) return true;
  // 폴백: 래퍼 ref_ptn 슬러그가 패턴 id 슬러그와 달라도 ptnNNN 번호가 같으면 매칭(인쇄앱과 동일)
  const pa = ptnNumOf(a), pb = ptnNumOf(b);
  return !!pa && pa === pb;
}

function ptnLabel(row) {
  const m = ptnRef(row).match(/p(?:tn)?0*(\d+)/i);
  return m ? `PATTERN ${m[1].padStart(2,'0')}` : 'PATTERN';
}

function ptnNumber(row) {
  const m = ptnRef(row).match(/p(?:tn)?0*(\d+)/i);
  return m ? m[1].padStart(2,'0') : '';
}

// 앱 표시용 유닛 코드: A001 → A01 (문자 유지, 번호 2자리). 시트값은 그대로.
function unitNo(unit) {
  return String(unit || '').replace(/\d+/, m => m.slice(-2).padStart(2, '0'));
}

function pageKindLabel(page) {
  if (page.sec === 'exp') return 'EXPRESSION';
  if (page.sec === 'ptn') return 'PATTERN';
  if (page.sec === 'drill') return 'DRILL';
  if (page.sec === 'nass') return 'NASS';
  if (page.sec === 'kalimat') return 'KALIMAT';
  return (page.title || '').toUpperCase();
}

function pageKindMain(page) {
  if (page.sec === 'ptn') return ptnNumber(page.row) || 'PATTERN';
  return pageKindLabel(page);
}

function sortByPtn(a, b) {
  return ptnRef(a).localeCompare(ptnRef(b), undefined, { numeric:true, sensitivity:'base' });
}

function rowsByUnit(tab, unit, typeFilter) {
  const unitRow = getUnitRow(unit);
  return (_cache[tab] || [])
    .filter(r => matchesUnit(r, unit, unitRow) && ok(r))
    .filter(r => !typeFilter || typeFilter(normType(r.type), r));
}

function drillPageMode(row) {
  return String(row?.css || '').trim().toLowerCase() === 'two' ? 'two' : 'grid';
}

function drillPageRef(row) {
  const ref = String(row?.ref_ptn || '').trim();
  const numbered = ref.match(/^p(?:tn)?0*(\d+)/i);
  return numbered ? `p${Number(numbered[1])}` : (refKey(ref) || '__unit__');
}

// 한 page 안에서도 레이아웃 모드가 바뀌면 화면을 나눈다.
// 특히 two 드릴은 서로 다른 패턴 세트를 한 화면에 합치지 않는다.
function splitDrillPageSegments(rows) {
  const segments = [];
  rows.forEach(row => {
    const mode = drillPageMode(row);
    const ref = mode === 'two' ? drillPageRef(row) : '';
    const prev = segments[segments.length - 1];
    const startsNew = !prev || prev.mode !== mode || (mode === 'two' && prev.ref !== ref);
    if (startsNew) segments.push({ mode, ref, rows: [] });
    segments[segments.length - 1].rows.push(row);
  });
  return segments;
}

/* ───────── 페이지 빌더 ───────── */
/* 페이지 = 교재 한 페이지. 한 페이지 안의 모든 카드/표는 그대로 스택해 스크롤. */

function buildPagesForUnit(unit) {
  const unitRow = getUnitRow(unit);
  const bySec = { exp: [], ptn: [], drill: [], nass: [], kalimat: [] };

  // 표현 — 학생앱에는 expi + exp + exp+를 모두 노출한다.
  const expRows = rowsByUnit(TABS.exp, unit, (_t, r) => isAppExpression(r));
  if (expRows.length) {
    // 대표 표현 이미지 = type=expi인 첫 행의 id.png. expi/ID가 없으면 요청하지 않는다.
    const expImageId = imageId(expRows.find(r => imageId(r)));
    bySec.exp.push({
      sec:'exp', kind:'list',
      title:'표현', subtitle: expRows.length + '개',
      hero: expImageId,
      cards: expRows.map(r => ({...r, _kind:'exp'})),
    });
  }

  // 패턴 (한 패턴 = 한 페이지, 내부에 레퍼토리 포함)
  const ptnRows = rowsByUnit(TABS.pattern, unit, t => t === 'ptn').sort(sortByPtn);
  ptnRows.forEach((r, i) => {
    const ref = ptnRef(r);
    const reps = rowsByUnit(TABS.repertory, unit, t => t === 'repertory' || t === 'repertorie')
      .filter(rep => sameRef(rep.ref_ptn, ref));
    // 패턴 이미지는 더 이상 img 체크박스로 요청하지 않는다. 대표 이미지는 expi 행이 담당한다.
    bySec.ptn.push({
      sec:'ptn', kind:'pattern',
      title:'패턴', subtitle: ptnNumber(r) || `${i+1} / ${ptnRows.length}`,
      hero: '',
      row: r, reps,
    });
  });

  // 드릴 — page 값 있으면 화면 분리, 없으면 한 페이지
  const drillRows = rowsByUnit(TABS.drill, unit,
    (t, r) => ['drilla','drillb','drillc','writing'].includes(t) && (r.arabic || '').trim() !== '');
  if (drillRows.length) {
    const pageVal = r => (r.page || '').toString().trim();
    const hasPaged = drillRows.some(r => pageVal(r) !== '');
    const chapter = String(unitRow.C || unitRow.c || '');
    if (hasPaged) {
      const byPage = new Map();
      drillRows.forEach(r => {
        const k = pageVal(r) || '￿';
        if (!byPage.has(k)) byPage.set(k, []);
        byPage.get(k).push(r);
      });
      const keys = [...byPage.keys()].sort((a, b) => {
        const na = parseFloat(a), nb = parseFloat(b);
        if (!isNaN(na) && !isNaN(nb)) return na - nb;
        return String(a).localeCompare(String(b), undefined, { numeric: true });
      });
      const pageGroups = keys.flatMap(k => splitDrillPageSegments(byPage.get(k)).map(seg => seg.rows));
      pageGroups.forEach((rows, i) => {
        bySec.drill.push({
          sec:'drill', kind:'drill',
          title:'드릴', subtitle: `${i+1} / ${pageGroups.length}`,
          rows,
          chapter,
        });
      });
    } else {
      // css 그리드와 two가 섞이거나 two의 연결 패턴이 바뀌면 다음 페이지로 넘긴다.
      const segs = splitDrillPageSegments(drillRows);
      segs.forEach((seg, i) => bySec.drill.push({
        sec:'drill', kind:'drill',
        title:'드릴', subtitle: segs.length > 1 ? `${i+1} / ${segs.length}` : seg.rows.length + '개',
        rows: seg.rows,
        chapter,
      }));
    }
  }

  // 지문 (nass + nass+ 통합)
  const nassRows = rowsByUnit(TABS.nass, unit, t => t === 'nass' || t === 'nass+');
  if (nassRows.length) {
    bySec.nass.push({
      sec:'nass', kind:'list',
      title:'지문', subtitle: nassRows.length + '개',
      cards: nassRows.map(r => ({...r, _kind:'nass'})),
    });
  }

  // 단어 (kalimat → kalimat+)
  const kReg  = rowsByUnit(TABS.kalimat, unit, (t, r) => t === 'kalimat'  && (r.arabic || '').trim() !== '');
  const kPlus = rowsByUnit(TABS.kalimat, unit, (t, r) => t === 'kalimat+' && (r.arabic || '').trim() !== '');
  if (kReg.length || kPlus.length) {
    bySec.kalimat.push({
      sec:'kalimat', kind:'list',
      title:'단어', subtitle: (kReg.length + kPlus.length) + '개',
      cards: [
        ...kReg.map(r => ({...r, _kind:'kalimat'})),
        ...kPlus.map(r => ({...r, _kind:'kalimat-plus'})),
      ],
    });
  }

  // 섹션 순서: 7과부터는 ptn → drill → exp → nass → kalimat (패턴 우선)
  //           1~6과는 종전대로 exp → ptn → drill → nass → kalimat (알파벳 학습기)
  return sectionOrderFor(unit).flatMap(key => bySec[key]);
}

function curSection() { return state.pages[state.page]?.sec || 'exp'; }

/* ───────── 렌더 ───────── */

function renderHead() {
  const unitRow = (_cache[TABS.units]||[]).find(r => r.u === state.unit);
  document.getElementById('h-unit').textContent = unitNo(state.unit);
  document.getElementById('h-unit-ar').textContent = (unitRow?.arabic || '').slice(0, 22);
  document.getElementById('h-unit-ko').textContent = (unitRow?.korean || '').slice(0, 34);

  // 헤더 카운터: 패턴은 패턴번호 2자리(예: "패턴 01"), 그 외 섹션은 위치(예: "드릴 2/3")
  const sec = curSection();
  const inSec = state.pages.filter(p => p.sec === sec);
  const idxInSec = inSec.findIndex(p => p === state.pages[state.page]);
  const secLabel = SECTIONS.find(s => s.key === sec)?.label || '';
  const curPage = state.pages[state.page];
  const ptnNo = (sec === 'ptn' && curPage?.row) ? ptnNumber(curPage.row) : '';
  document.getElementById('h-counter').textContent =
    ptnNo ? `${secLabel} ${ptnNo}`
          : (inSec.length > 1 ? `${secLabel} ${idxInSec+1}/${inSec.length}` : secLabel);

  // 푸터 인디케이터: 글로벌 (예: "03 / 07")
  const total = state.pages.length || 1;
  const cur   = Math.min(state.page+1, total);
  document.getElementById('page-ind').textContent =
    String(cur).padStart(2,'0') + ' / ' + String(total).padStart(2,'0');
  document.getElementById('prev').disabled = state.page <= 0;
  document.getElementById('next').disabled = state.page >= total - 1;
}

function renderTabs() {
  const cur = curSection();
  // 유닛 번호에 따라 탭 시각 순서 전환 (CSS flex order로 처리)
  const tabsNav = document.getElementById('tabs');
  if (tabsNav) tabsNav.dataset.order = isPatternFirst(state.unit) ? 'ptn-first' : 'exp-first';
  document.querySelectorAll('.m-tab').forEach(btn => {
    const sec = btn.dataset.sec;
    const has = state.pages.some(p => p.sec === sec);
    btn.dataset.disabled = has ? '0' : '1';
    btn.classList.toggle('active', sec === cur);
  });
}

function buildPageContent(wrap, page) {
  if (page.kind === 'pattern') {
    // 패턴 카드: hero는 카드 내부 상단으로 보냄 (이미지 있으면 데이터 숨김, 없으면 일반 카드)
    wrap.appendChild(renderPatternCard(page.row, page.hero));
    if ((page.reps || []).length) wrap.appendChild(renderRepertoryCard(page.reps || []));
    return;
  }
  if (page.hero) wrap.appendChild(renderHero(page.hero));
  if (page.kind === 'list') {
    if (page.sec === 'nass') renderNassPage(wrap, page.cards);
    else page.cards.forEach(c => wrap.appendChild(renderCard(c)));
  } else if (page.kind === 'drill') {
    renderDrillPage(wrap, page.rows || [], page.chapter);
  }
}

function renderBody() {
  const body = document.getElementById('body');
  body.innerHTML = '';

  if (!state.pages.length) {
    body.innerHTML = '<div class="m-empty">이 유닛에는<br>아직 표시할 데이터가 없습니다.</div>';
    return;
  }

  // 3-pane 캐러셀 구조: [prev | current | next] — 가운데가 -33.333% 위치
  const strip = document.createElement('div');
  strip.className = 'm-strip';

  const buildPane = (pageIdx) => {
    const pane = document.createElement('div');
    pane.className = 'm-pane';
    if (pageIdx >= 0 && pageIdx < state.pages.length) {
      const wrap = document.createElement('div');
      wrap.className = 'm-page';
      buildPageContent(wrap, state.pages[pageIdx]);
      pane.appendChild(wrap);
    }
    return pane;
  };

  strip.appendChild(buildPane(state.page - 1));
  strip.appendChild(buildPane(state.page));
  strip.appendChild(buildPane(state.page + 1));

  body.appendChild(strip);
  // 가운데 pane이 보이도록 위치 (애니메이션 없이)
  strip.style.transform = 'translateX(-33.333%)';
}

function renderHero(id, opts = {}) {
  // 시트의 img 플래그와 id가 모두 있을 때만 호출됨. 배포 파일명은 {id}.png다.
  const wrap = document.createElement('div');
  wrap.className = 'm-hero-wrap';
  const img = document.createElement('img');
  img.className = 'm-hero';
  img.alt = '';
  img.onerror = () => {
    if (!img.dataset.localTried) {
      img.dataset.localTried = '1';
      img.src = `${IMG_LOCAL_BASE}/${encodeURIComponent(id)}.png?v=${IMG_VERSION}`;
      return;
    }
    wrap.remove();
    opts.onFail?.();
  };
  img.onload = () => { opts.onLoad?.(); };
  img.src = `${IMG_BASE}/${encodeURIComponent(id)}.png?v=${IMG_VERSION}`;
  wrap.appendChild(img);
  return wrap;
}

function renderCard(row) {
  const el = document.createElement('div');
  el.className = 'm-card ' + (row._kind || '');

  const pair = document.createElement('div');
  pair.className = 'm-pair';
  const left = document.createElement('div');
  left.className = 'm-pair-left';
  const right = document.createElement('div');
  right.className = 'm-pair-right';
  const flagsHtml = renderFlags(row);
  if (row.arabic) {
    const ar = document.createElement('div');
    ar.className = 'm-ar tap-audio';
    ar.innerHTML = parseInline(row.arabic);
    ar.addEventListener('click', () => playAudio(row, ar));
    // 표현 카드: 깃발 인라인 / 나스 카드: 좌측 한국어 칸 하단
    if (flagsHtml && row._kind !== 'nass') {
      const line = document.createElement('div');
      line.className = 'm-ar-line';
      line.appendChild(ar);
      const flagWrap = document.createElement('span');
      flagWrap.innerHTML = flagsHtml;
      line.appendChild(flagWrap.firstChild);
      right.appendChild(line);
    } else {
      right.appendChild(ar);
    }
  }
  const trans = row.note || row.transliteration || '';
  if (trans) {
    const tr = document.createElement('div');
    tr.className = 'm-trans';
    tr.innerHTML = parseTrans(trans);
    right.appendChild(tr);
  }
  if (row.korean) {
    const ko = document.createElement('div');
    ko.className = 'm-ko';
    ko.innerHTML = parseInline(row.korean);
    left.appendChild(ko);
  }
  if (flagsHtml && row._kind === 'nass') {
    const flagWrap = document.createElement('span');
    flagWrap.innerHTML = flagsHtml;
    left.appendChild(flagWrap.firstChild);
  }
  pair.appendChild(left);
  pair.appendChild(right);
  el.appendChild(pair);
  if (row._kind === 'nass' && row.sual) {
    const su = document.createElement('div');
    su.className = 'm-sual';
    su.innerHTML = parseInline(row.sual);
    el.appendChild(su);
  }
  // 표현(exp)·드릴의 script(설명)는 학생앱에서 노출한다 (인쇄 교재에선 숨김) — 대표 지침 2026-07-22
  if (row.script) {
    const sc = document.createElement('div');
    sc.className = 'm-script';
    sc.innerHTML = renderScriptLines(row.script);
    el.appendChild(sc);
  }
  if (isNomRow(row)) el.innerHTML = applyNomDivider(el.innerHTML);  // 명사문 `|` → 분리자
  return el;
}

function renderPatternCard(row, hero) {
  const el = document.createElement('div');
  el.className = 'm-card pattern';
  // 이미지가 실제로 로드된 경우에만 hero 모드로 전환한다.
  // 없는 이미지를 찾는 동안 패턴 본문이 늦게 나타나는 문제를 막기 위함.
  if (hero) {
    const heroWrap = renderHero(hero, {
      onLoad: () => el.classList.add('pattern-with-hero'),
      onFail: () => el.classList.remove('pattern-with-hero'),
    });
    el.appendChild(heroWrap);   // 최상단에 위치하도록 가장 먼저 append
  }
  const cssVal = (row.css || '').trim().toLowerCase();
  const isBaseline = cssVal === 'baseline' || cssVal === 'baseline2';
  const noLine = cssVal === 'baseline2';

  if (isBaseline) {
    el.appendChild(renderBaseline(row, { noLine }));
  } else if (row.arabic) {
    const ar = document.createElement('div');
    ar.className = 'm-ar tap-audio';
    ar.innerHTML = parseInline(row.arabic);
    ar.addEventListener('click', () => playAudio(row, ar));
    el.appendChild(ar);
  }
  // 기본 패턴 순서: 아랍어(가운데) → 음가 → 한국어 (인쇄교재와 통일)
  const trans = row.note || row.transliteration || '';
  if (trans && !isBaseline) {
    const tr = document.createElement('div');
    tr.className = 'm-trans';
    tr.innerHTML = parseTrans(trans);
    el.appendChild(tr);
  }
  if (row.korean) {
    const ko = document.createElement('div');
    ko.className = 'm-ko';
    ko.innerHTML = parseInline(row.korean);
    el.appendChild(ko);
  }
  // script(설명) 컬럼이 있으면 풀어서 표시
  const summary = row.script || row.summary || '';
  if (summary) {
    const sm = document.createElement('div');
    sm.className = 'm-summary';
    sm.innerHTML = renderScriptLines(summary);
    el.appendChild(sm);
  }
  if (isNomRow(row)) el.innerHTML = applyNomDivider(el.innerHTML);  // 명사문 `|` → 분리자
  return el;
}

function renderRepertoryCard(rows) {
  if (useRepertoryGrid(rows)) {
    // 그리드 모드 — 종전대로 한 표를 .m-card.repertory가 감쌈
    const el = document.createElement('div');
    el.className = 'm-card repertory';
    el.appendChild(renderRepertory(rows));
    return el;
  }
  // 디폴트 페어 모드 — 각 행을 개별 .m-card.repertory(=표현 카드와 같은 양식)로
  const wrap = document.createElement('div');
  wrap.className = 'm-rep-wrap';
  rows.forEach(r => wrap.appendChild(renderCard({ ...r, _kind: 'repertory' })));
  return wrap;
}

function useRepertoryGrid(rows) {
  const cssOf = r => (r.css || '').trim().toLowerCase();
  const gridCols = rows.reduce((cols, r) => {
    const css = cssOf(r);
    if (css === 'six') return Math.max(cols, 6);
    if (css === 'five') return Math.max(cols, 5);
    if (css === 'three') return Math.max(cols, 3);
    if (css === 'two') return Math.max(cols, 2);
    return cols;
  }, 0);
  // 그리드는 알파벳/발음 노출처럼 실제 칸을 채울 때만 사용한다.
  return gridCols > 0 && rows.length >= gridCols;
}

function renderScriptLines(text) {
  const src = String(text || '');
  const parts = [];
  let last = 0;
  src.replace(/<table\b[^>]*>[\s\S]*?<\/table>/gi, (match, offset) => {
    if (offset > last) parts.push({ type:'text', value:src.slice(last, offset) });
    parts.push({ type:'table', value:match });
    last = offset + match.length;
    return match;
  });
  if (last < src.length) parts.push({ type:'text', value:src.slice(last) });

  return parts.map(part => (
    part.type === 'table' ? renderScriptTable(part.value) : renderScriptText(part.value)
  )).filter(Boolean).join('');
}

function renderScriptText(text) {
  return String(text || '').split('\n').map(line => {
    const t = line.trim();
    if (!t) return '';
    if (t.startsWith('- ')) {
      const raw = t.slice(2);
      // 스크립트 불릿은 전부 LTR 고정 — 아랍 토큰은 흐름 안에서 RTL로 임베드(대표 지침 2026-07-21)
      return `<span class="bullet" dir="ltr">${parseInline(raw)}</span>`;
    }
    if (t.startsWith('>')) return `<span class="quote">${parseInline(t.replace(/^>\s*/, ''))}</span>`;
    return `<span class="para">${parseInline(line)}</span>`;
  }).filter(Boolean).join('');
}

function renderScriptTable(html) {
  const rows = [];
  String(html || '').replace(/<tr\b[^>]*>([\s\S]*?)<\/tr>/gi, (_, rowHtml) => {
    const cells = [];
    rowHtml.replace(/<(t[dh])\b[^>]*>([\s\S]*?)<\/t[dh]>/gi, (match, tag, cellHtml) => {
      const text = cellHtml
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/<[^>]+>/g, '')
        .trim();
      cells.push({ tag: tag.toLowerCase() === 'th' ? 'th' : 'td', text });
      return match;
    });
    if (cells.length) rows.push(cells);
    return rowHtml;
  });
  if (!rows.length) return `<span class="para">${parseInline(html)}</span>`;

  const body = rows.map(cells => (
    '<tr>' + cells.map(cell => {
      const dir = firstStrongDir(cell.text);
      return `<${cell.tag} dir="${dir}">${parseInline(cell.text)}</${cell.tag}>`;
    }).join('') + '</tr>'
  )).join('');
  return `<table class="script-table">${body}</table>`;
}

function renderRepertory(rows) {
  const cssOf = r => (r.css || '').trim().toLowerCase();
  const useTwo = rows.length >= 2 && rows.some(r => cssOf(r) === 'two');
  const useThree = rows.length >= 3 && rows.some(r => cssOf(r) === 'three');
  const useSix = rows.length >= 6 && rows.some(r => cssOf(r) === 'six');
  const useFive = rows.length >= 5 && rows.some(r => cssOf(r) === 'five');
  if (useTwo) return renderGridTable(rows, 'm-rep-table', false, 2);
  if (useThree) return renderGridTable(rows, 'm-rep-table', false, 3);
  if (useSix) return renderGridTable(rows, 'm-rep-table', false, 6);
  if (useFive) return renderGridTable(rows, 'm-rep-table', false);
  const wrap = document.createElement('div');
  rows.forEach(r => wrap.appendChild(renderPairRow(r)));
  return wrap;
}

function renderGridTable(rows, className = 'm-drill-table', blanks = false, cols = 5) {
  const wrap = document.createElement('div');
  wrap.className = className;
  const grid = document.createElement('div');
  grid.className = className === 'm-rep-table' ? 'm-rep-grid' : 'm-drill-grid';
  if (cols === 2) grid.classList.add('cols-two');
  else if (cols === 3) grid.classList.add('cols-three');
  else if (cols === 6) grid.classList.add('cols-six');
  rows.forEach(r => {
    const cell = document.createElement('div');
    cell.className = 'drill-cell';
    const ar = blanks ? parseDrillBlank(r.arabic || '') : parseInline(r.arabic || '');
    const tr = blanks ? parseDrillBlank(r.note || r.transliteration || '') : parseTrans(r.note || r.transliteration || '');
    const flagsHtml = renderFlags(r);
    let html;
    if (cols === 2) {
      // 2열: 한국어(해석)를 아래가 아니라 왼쪽에 두고, 아랍어+음가는 오른쪽
      html = `<span class="dc-ko m-ko">${r.korean ? parseInline(r.korean) : ''}</span>` +
        `<span class="dc-body">` +
        `<span class="m-ar-line"><span class="dc-ar tap-audio">${ar}</span>${flagsHtml}</span>` +
        `<span class="dc-trans m-trans">${tr}</span></span>`;
    } else {
      html = `
      <span class="m-ar-line"><span class="dc-ar tap-audio">${ar}</span>${flagsHtml}</span>
      <span class="dc-trans m-trans">${tr}</span>`;
    }
    cell.innerHTML = html;
    if (isNomRow(r)) cell.innerHTML = applyNomDivider(cell.innerHTML);  // 명사문 셀
    cell.querySelector('.tap-audio')?.addEventListener('click', e => playAudio(r, e.currentTarget));
    grid.appendChild(cell);
  });
  wrap.appendChild(grid);
  return wrap;
}

function renderPairRow(r, blanks = false) {
  const row = document.createElement('div');
  row.className = 'm-rep-row';
  const ar = blanks ? parseDrillBlank(r.arabic || '') : parseInline(r.arabic || '');
  const tr = blanks ? parseDrillBlank(r.note || r.transliteration || '') : parseTrans(r.note || r.transliteration || '');
  const flagsHtml = renderFlags(r);
  row.innerHTML = `
    <div class="m-row-ko m-ko">${parseInline(r.korean || '')}</div>
    <div>
      <div class="m-ar-line"><div class="m-row-ar tap-audio">${ar}</div>${flagsHtml}</div>
      <div class="m-row-trans m-trans">${tr}</div>
    </div>`;
  if (isNomRow(r)) row.innerHTML = applyNomDivider(row.innerHTML);  // 명사문 행
  row.querySelector('.tap-audio')?.addEventListener('click', e => playAudio(r, e.currentTarget));
  return row;
}

function renderDrillPage(wrap, rows, chapter) {
  const order = ['drilla','drillb','drillc','writing'];
  order.forEach(type => {
    const groupRows = rows.filter(r => normType(r.type) === type);
    if (!groupRows.length) return;
    const section = document.createElement('section');
    section.className = 'm-subsection';
    const instr = document.createElement('div');
    instr.className = 'm-instruction';
    instr.textContent = drillInstruction(type, state.unit, chapter);
    section.appendChild(instr);
    groupByRef(groupRows).forEach(group => {
      const cssOf = r => (r.css || '').trim().toLowerCase();
      const useTwo = group.rows.some(r => cssOf(r) === 'two');
      const useThree = group.rows.some(r => cssOf(r) === 'three');
      const useSix = group.rows.some(r => cssOf(r) === 'six');
      const five = group.rows.some(r => cssOf(r) === 'five') || group.rows.every(r => !r.korean);
      if (useTwo) section.appendChild(renderGridTable(group.rows, 'm-drill-table', type !== 'drilla', 2));
      else if (useThree) section.appendChild(renderGridTable(group.rows, 'm-drill-table', type !== 'drilla', 3));
      else if (useSix) section.appendChild(renderGridTable(group.rows, 'm-drill-table', type !== 'drilla', 6));
      else if (five) section.appendChild(renderGridTable(group.rows, 'm-drill-table', type !== 'drilla'));
      else {
        const box = document.createElement('div');
        group.rows.forEach(r => {
          const item = renderPairRow(r, type !== 'drilla');
          item.classList.add('m-drill-row');
          box.appendChild(item);
        });
        section.appendChild(box);
      }
    });
    wrap.appendChild(section);
  });
}

function groupByRef(rows) {
  const map = new Map();
  rows.forEach((r, index) => {
    const ref = String(r.ref_ptn || '').trim();
    // A005의 알리프(p015)·함자(p016) 드릴을 한 테이블 블록으로 이어서 보여 준다.
    // 데이터의 ref_ptn은 바꾸지 않고 표시 그룹 키만 합쳐 패턴 연결성을 보존한다.
    // (five=5칸/six=6칸 둘 다 허용 — 6+6=12칸 six 병합 지원)
    const mergeA005AlifHamza = String(r.u || '').trim() === 'A005'
      && ['five','six'].includes(String(r.css || '').trim().toLowerCase())
      && /^ptn01(?:5|6)(?:_|$)/i.test(ref);
    const key = mergeA005AlifHamza ? 'ptn015_016_a005_alif_hamza' : (ref || '__unit__');
    if (!map.has(key)) map.set(key, { key, first:index, rows:[] });
    map.get(key).rows.push(r);
  });
  return [...map.values()].sort((a, b) => {
    if (a.key === '__unit__') return 1;
    if (b.key === '__unit__') return -1;
    return a.first - b.first;
  });
}

function drillInstruction(type, unit, chapter) {
  if (type === 'drillb') {
    return /^A0[1-6]$/.test(unit) || String(chapter) === '0'
      ? '다음을 듣고 빈 칸에 들어갈 글자를 유추해 보세요'
      : '다음을 듣고 빈 칸에 들어갈 말을 유추해 보세요';
  }
  if (type === 'drillc') return '다음을 듣고 알맞은 말을 유추해 보세요';
  if (type === 'writing') return '배운 패턴을 떠올리며 직접 써 보세요';
  return '다음을 듣고 따라 읽어 보세요';
}

function renderNassPage(wrap, cards) {
  // nass·nass+ 구분 없이 시트 순서대로 연속 표시
  const rows = cards.filter(r => ['nass','nass+'].includes(normType(r.type)));
  if (!rows.length) return;
  const section = document.createElement('section');
  section.className = 'm-subsection';
  rows.forEach(r => section.appendChild(renderCard(r)));
  wrap.appendChild(section);
}

function renderBaseline(row, opts = {}) {
  const noLine = !!opts.noLine;  // css='baseline2'면 가로 기준선 미표시
  const wrap = document.createElement('div');
  wrap.className = 'm-baseline' + (noLine ? ' no-line' : '');
  const grid = document.createElement('div');
  grid.className = 'm-bl-grid';
  const lines = String(row.arabic || '').split(/\n+/);
  const splitTokens = line => {
    const sep = line.includes('|') ? /\s*\|\s*/ : /\s+/;
    return line.split(sep).map(t => t.trim()).filter(Boolean);
  };
  const letters = splitTokens(lines[0] || '');
  const triples = splitTokens(lines[1] || '');
  const labels = splitTokens(row.note || row.transliteration || '');
  letters.forEach((ch, i) => {
    const cell = document.createElement('div');
    cell.className = 'm-bl-cell';
    const sp = document.createElement('div');
    sp.className = 'm-bl-letter tap-audio';
    sp.innerHTML = parseInline(ch);
    sp.addEventListener('click', () => playAudio(row, sp));
    cell.appendChild(sp);
    if (triples[i]) {
      const tri = document.createElement('div');
      tri.className = 'm-bl-triple';
      tri.innerHTML = parseInline(triples[i]);
      cell.appendChild(tri);
    }
    const lb = document.createElement('div');
    lb.className = 'm-bl-label';
    lb.innerHTML = labels[i] ? parseTrans(labels[i]) : '&nbsp;';
    cell.appendChild(lb);
    grid.appendChild(cell);
  });
  wrap.appendChild(grid);
  return wrap;
}

/* ───────── 오디오 ───────── */
function playAudio(row, el) {
  const audio = document.getElementById('player');
  if (state.audioId === el && !audio.paused) {
    audio.pause();
    el.classList.remove('playing');
    state.audioId = null;
    return;
  }
  document.querySelectorAll('.tap-audio.playing').forEach(n => n.classList.remove('playing'));
  state.audioId = null;
  const urls = audioUrlsFor(row);
  if (!urls.length) { console.warn('audio: no id/url for', row); return; }
  let idx = 0;
  const tryNext = () => {
    if (idx >= urls.length) { el.classList.remove('playing'); state.audioId = null; return; }
    audio.src = urls[idx++];
    audio.play().catch(tryNext);
  };
  audio.onended = () => { el.classList.remove('playing'); state.audioId = null; };
  audio.onerror = tryNext;
  el.classList.add('playing');
  state.audioId = el;
  tryNext();
}

/* ───────── 사이드바 (유닛 픽커) ───────── */
function buildUnitList() {
  const list = document.getElementById('unit-list');
  list.innerHTML = '';
  const rows = (_cache[TABS.units]||[]).filter(ok);
  state.units = rows.map(r => r.u).filter(Boolean);
  rows.forEach(r => {
    const li = document.createElement('li');
    li.className = 'm-unit-row' + (r.u === state.unit ? ' active' : '');
    li.dataset.unit = r.u;
    li.innerHTML = `
      <span class="ucode">${unitNo(r.u)}</span>
      <span class="ubody">
        <span class="uar">${(r.arabic||'').slice(0, 26)}</span>
        <span class="uko">${(r.korean||'').slice(0, 28)}</span>
      </span>`;
    li.addEventListener('click', () => {
      state.unit = r.u; state.page = 0;
      refresh(); closeSidebar(); saveURL();
    });
    list.appendChild(li);
  });
}
function openSidebar()  { document.getElementById('sb').classList.add('open'); }
function closeSidebar() { document.getElementById('sb').classList.remove('open'); }

/* ───────── 한국어 토글 ───────── */
function toggleKorean() {
  state.hideKorean = !state.hideKorean;
  const app = document.getElementById('app');
  const btn = document.getElementById('toggle');
  app.classList.toggle('hide-korean', state.hideKorean);
  if (state.hideKorean) { btn.textContent = '한국어 보기';   btn.classList.remove('on'); }
  else                  { btn.textContent = '한국어 가리기'; btn.classList.add('on'); }
  localStorage.setItem('m.hide-korean', state.hideKorean ? '1' : '0');
}

/* ───────── 이동 ───────── */
function goSection(sec) {
  const idx = state.pages.findIndex(p => p.sec === sec);
  if (idx === -1) return;
  state.page = idx;
  paintCurrent(); saveURL();
}
function goPage(delta) {
  const next = state.page + delta;
  if (next < 0 || next >= state.pages.length) return;
  state.page = next;
  paintCurrent(); saveURL();
}
function paintCurrent() {
  renderHead();
  renderTabs();
  renderBody();
  // baseline 기준선 동적 정렬 — 폰트 로드 완료 후 첫 글자 baseline에 맞춤
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(adjustBaselines);
  } else {
    requestAnimationFrame(adjustBaselines);
  }
}

function adjustBaselines() {
  document.querySelectorAll('.m-bl-grid').forEach(grid => {
    const letter = grid.querySelector('.m-bl-letter');
    if (!letter) return;
    // height:0 + vertical-align:baseline 프로브 — 프로브 top이 곧 baseline 위치
    const probe = document.createElement('span');
    probe.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline;';
    letter.appendChild(probe);
    const probeRect = probe.getBoundingClientRect();
    const gridRect = grid.getBoundingClientRect();
    probe.remove();
    const baselineFromTop = probeRect.top - gridRect.top;
    if (baselineFromTop > 0) grid.style.setProperty('--bl-top', baselineFromTop + 'px');
  });
}

window.addEventListener('resize', () => {
  clearTimeout(window._blTimer);
  window._blTimer = setTimeout(adjustBaselines, 120);
});

/* ───────── refresh ───────── */
function refresh() {
  state.pages = buildPagesForUnit(state.unit);
  state.page = Math.min(state.page, Math.max(0, state.pages.length - 1));
  buildUnitList();
  paintCurrent();
}

/* ───────── URL 동기화 ───────── */
function saveURL() {
  const sp = new URLSearchParams(location.search);
  sp.set('unit', state.unit);
  sp.set('page', state.page);
  history.replaceState(null,'','?'+sp.toString());
}

/* ───────── 이벤트 ───────── */
document.getElementById('burger').onclick   = openSidebar;
document.getElementById('sb-close').onclick = closeSidebar;
document.getElementById('sb-mask').onclick  = closeSidebar;
document.getElementById('prev').onclick     = () => goPage(-1);
document.getElementById('next').onclick     = () => goPage(+1);
document.getElementById('toggle').onclick   = toggleKorean;
document.querySelectorAll('.m-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.disabled === '1') return;
    goSection(btn.dataset.sec);
  });
});
// 드래그-페이지 캐러셀 — 손가락 따라 strip이 이동, 임계값 넘으면 다음/이전으로 스냅
(() => {
  const body = document.getElementById('body');
  let primaryId = null;
  let startX = 0, startY = 0;
  let direction = null;          // 'h' | 'v' | null (방향 잠김 전)
  let dragging = false;
  let lastDx = 0;
  let strip = null;

  const getStrip = () => body.querySelector('.m-strip');

  body.addEventListener('pointerdown', e => {
    if (primaryId !== null) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    primaryId = e.pointerId;
    startX = e.clientX;
    startY = e.clientY;
    direction = null;
    dragging = false;
    lastDx = 0;
    strip = getStrip();
  });

  body.addEventListener('pointermove', e => {
    if (e.pointerId !== primaryId) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    // 첫 ~8px 이동 시 방향 잠금
    if (!direction) {
      if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
        direction = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
        if (direction === 'h' && strip) {
          dragging = true;
          strip.classList.add('dragging');
          try { body.setPointerCapture(primaryId); } catch (_) {}
        }
      }
    }

    if (!dragging || !strip) return;

    // 가장자리 저항 (rubber-band)
    const atFirst = state.page <= 0;
    const atLast  = state.page >= state.pages.length - 1;
    let effDx = dx;
    if (atFirst && dx > 0) effDx = dx * 0.35;
    if (atLast  && dx < 0) effDx = dx * 0.35;

    lastDx = effDx;
    strip.style.transform = `translateX(calc(-33.3333% + ${effDx}px))`;
  });

  const finish = (e, cancelled) => {
    if (e.pointerId !== primaryId) return;
    primaryId = null;

    if (!dragging || !strip) {
      dragging = false;
      strip = null;
      return;
    }
    dragging = false;
    strip.classList.remove('dragging');  // transition 다시 활성

    const vw = body.clientWidth || 375;
    const threshold = Math.min(70, vw * 0.18);  // ~18% 또는 최대 70px
    const stripEl = strip;
    strip = null;

    const commit = (delta, snapTo) => {
      stripEl.style.transform = `translateX(${snapTo})`;
      let done = false;          // transitionend·폴백 타이머 중복 실행 방지
      let timer = null;
      const cleanup = () => {
        if (done) return;        // 단 한 번만 — 안 그러면 state.page가 2칸 점프(섹션 건너뜀)
        done = true;
        clearTimeout(timer);
        stripEl.removeEventListener('transitionend', cleanup);
        if (delta !== 0) {
          state.page += delta;
          paintCurrent(); saveURL();
        }
      };
      stripEl.addEventListener('transitionend', cleanup, { once: true });
      // transitionend 폴백 — 일부 브라우저에서 누락될 수 있음
      timer = setTimeout(cleanup, 320);
    };

    if (cancelled) {
      commit(0, '-33.3333%');
      return;
    }
    if (lastDx < -threshold && state.page < state.pages.length - 1) {
      commit(+1, '-66.6667%');
    } else if (lastDx > threshold && state.page > 0) {
      commit(-1, '0%');
    } else {
      commit(0, '-33.3333%');
    }
  };

  body.addEventListener('pointerup',     e => finish(e, false));
  body.addEventListener('pointercancel', e => finish(e, true));
})();
// 키보드 (데스크탑 미리보기용)
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown')      { e.preventDefault(); goPage(+1); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp')    { e.preventDefault(); goPage(-1); }
  else if (e.key === ' ')                                    { e.preventDefault(); toggleKorean(); }
  else if (e.key === 'm' || e.key === 'M')                  { document.getElementById('sb').classList.toggle('open'); }
  else if (e.key === 'Escape')                              { closeSidebar(); }
});

/* ───────── 초기화 ───────── */
async function init() {
  try {
    // 데이터시트sheet 는 여러 논리탭이 공유하므로 중복 제거 후 로드
    await Promise.all([...new Set(Object.values(TABS))].map(t => fetchSheet(t).catch(e => {
      console.warn('sheet load fail:', t, e); return [];
    })));

    if (localStorage.getItem('m.hide-korean') === '1') {
      state.hideKorean = true;
      document.getElementById('app').classList.add('hide-korean');
      const btn = document.getElementById('toggle');
      btn.textContent = '한국어 보기'; btn.classList.remove('on');
    }

    const sp = new URLSearchParams(location.search);
    const u  = sp.get('unit');
    const p  = parseInt(sp.get('page'));
    const validUnits = (_cache[TABS.units]||[]).filter(ok).map(r => r.u);
    state.unit = (u && validUnits.includes(u)) ? u : (validUnits[0] || 'A001');
    if (!isNaN(p)) state.page = Math.max(0, p);

    refresh();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = '';
  } catch (e) {
    document.getElementById('loading').innerHTML =
      `<div class="m-error">로딩 실패<br><small>${e.message}</small></div>`;
    console.error(e);
  }
}

init();
</script>
