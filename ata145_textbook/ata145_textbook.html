<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>올댓아라빅 교재 모바일 (1.4.4 m-draft)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/spoqa/spoqa-han-sans@latest/css/SpoqaHanSansNeo.css" rel="stylesheet">
<style>
/* ───────── 디자인 토큰 (교재와 공유) ───────── */
:root {
  --bg:        #F3F5F1;            /* 페이지 배경 — 차가운 네이비 베이스가 아닌 중립/약간 따뜻한 light gray */
  --surface:   #ffffff;
  --accent:    #1D49FF;            /* 액센트만 파랑 (브랜드 컬러 유지) */
  --accent-bg: rgba(29,73,255,0.08);
  --warm:      #F4C45B;
  --mint:      #DDEFE8;
  --hl-text:   #3554C6;            /* `*…*` 색 강조 — 액센트 계열이라 파랑 유지 */
  --text:      #1a1f29;            /* 본문 — soft black charcoal (네이비 #12205A 아님) */
  --sub:       #6E7591;            /* 보조 — 중립 gray (blue tint 최소화) */
  --border:    #DDE2EE;            /* 구분선 — 매우 옅은 중립 light gray */
  --border-soft:#E9ECF3;
  --soft:      #f9fafc;
  --shadow:    0 1px 3px rgba(29,73,255,0.06), 0 0 0 1px rgba(29,73,255,0.03);
  --r-sm: 8px; --r-md: 12px; --r-lg: 18px;
  --max-w: 440px;  /* 모바일 폰 폭에 가깝게 — 데스크톱에서도 폰 시뮬레이션 룩 */
  --font-kr: 'Spoqa Han Sans Neo','Apple SD Gothic Neo',sans-serif;
  --font-ar: 'Noto Sans Arabic', serif;
  --ar-content-size: 15px; /* 패턴을 제외한 학생앱 아랍어 콘텐츠 공통 크기 */
  --ar-card-size: var(--ar-content-size);
  --ar-nass-size: var(--ar-content-size);
  --ar-pattern-size: clamp(1.2rem, 5.2vw, 1.55rem);
  --trans-size: 10px;
  --ko-size: 11px;
  --script-size: 11px;
  --pattern-card-max-height: min(520px, calc(100dvh - 198px));   /* 학생앱 패턴 카드 안전 상한. 스크립트 박스가 실제 조절 대상 */
  --pattern-summary-max-height: min(360px, 50dvh);               /* 현재 최장 패턴 스크립트(A003 ptn007) 기준. 초과 시 이 박스 안에서 스크롤 */
  --pattern-hero-card-height: min(450px, calc(100dvh - 238px));  /* 이미지형 패턴은 이미지 공간 때문에 별도 고정 높이 */
}
*,*::before,*::after { box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:var(--font-kr); -webkit-text-size-adjust:100%; }
button { font-family:var(--font-kr); cursor:pointer; border:none; background:none; color:inherit; }

/* ───────── 앱 셸 ───────── */
.m-app {
  display:flex; flex-direction:column;
  height:100dvh; max-width:var(--max-w);
  margin:0 auto; background:var(--bg);
  position:relative;
}
/* viewport가 모바일 max-width(440px)보다 크면 데스크톱 카드형 — 폰 시뮬레이션 룩 */
@media (min-width:461px) {
  .m-app {
    margin-top:28px; margin-bottom:28px;
    height:calc(100dvh - 56px);
    border-radius:var(--r-lg);
    border:1px solid var(--border);
    box-shadow:0 2px 24px rgba(29,73,255,0.08);
    overflow:hidden;
  }
}

/* 한국어 토글 — 공간은 유지(visibility). 음가(.m-trans)도 함께 가림 (전 앱 공통 규칙) */
.m-app.hide-korean .m-ko,
.m-app.hide-korean .m-trans { visibility:hidden; }

/* ───────── 상단바 (48px) ───────── */
.m-head {
  flex-shrink:0; height:56px;
  display:flex; align-items:center; gap:8px;
  padding:0 12px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
}
.m-burger {
  width:36px; height:36px;
  display:flex; align-items:center; justify-content:center;
  font-size:20px; color:var(--sub); border-radius:var(--r-sm);
}
.m-burger:active { background:var(--accent-bg); color:var(--accent); }
.m-title {
  flex:1; min-width:0;
  display:flex;
  align-items:baseline;
  gap:8px;
}
.m-unit {
  flex:0 0 auto;
  font-size:11px; font-weight:700; letter-spacing:1.5px;
  color:var(--accent);
}
.m-unit-ar {
  flex:0 1 auto;
  font-family:var(--font-ar); direction:rtl; unicode-bidi:isolate;
  font-size:var(--ar-content-size); font-weight:700; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:36%;
}
.m-unit-ko {
  flex:1 1 auto;
  min-width:0;
  font-size:10px;
  color:var(--sub);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.m-counter {
  flex-shrink:0;
  font-size:11px; color:var(--sub);
  font-variant-numeric:tabular-nums;
  letter-spacing:.3px;
}

/* ───────── 2단계 소형 네비게이션 ─────────
   상위: 표현·패턴들·전체 지문 / 하위: 돌아가기·현재 패턴·드릴·지문 */
.m-context-nav {
  flex-shrink:0; min-height:31px;
  display:flex; align-items:center; justify-content:flex-start; gap:4px;
  padding:3px 8px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
  overflow-x:auto;
  overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.m-context-nav::-webkit-scrollbar { display:none; }
.m-context-btn {
  flex:0 0 auto; min-width:48px; height:24px;
  padding:0 8px;
  border:0;
  border-radius:4px;
  background:transparent;
  font-size:9px; font-weight:600; color:var(--sub);
  white-space:nowrap;
  transition:background .12s,color .12s,border-color .12s;
}
.m-context-btn.back { min-width:58px; }
.m-context-btn.active {
  background:var(--accent);
  color:#fff;
  box-shadow:0 1px 3px rgba(29,73,255,.2);
}
.m-context-btn:not(.active):active {
  background:var(--accent-bg);
  color:var(--accent);
}
.m-context-btn:disabled {
  opacity:.28;
  pointer-events:none;
}

/* ───────── 콘텐츠 (스크롤) ───────── */
.m-body {
  flex:1; overflow:hidden;
  background:var(--bg);
  position:relative;
  touch-action:pan-y;          /* 가로 동작은 앱이 처리 (드래그 페이지 이동) */
  overscroll-behavior-x:none;  /* iOS Safari swipe-back 차단 */
}
.m-body::-webkit-scrollbar { width:0; }

/* 3-pane 캐러셀 — [prev | current | next], 가운데 보이도록 -33.333% */
.m-strip {
  display:flex;
  width:300%;
  height:100%;
  transition:transform .26s cubic-bezier(.2,.8,.2,1);
  will-change:transform;
}
.m-strip.dragging { transition:none; }
.m-pane {
  flex:0 0 33.3333%;
  height:100%;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
.m-pane::-webkit-scrollbar { width:0; }
.m-page {
  padding:12px 14px 18px;
  display:flex; flex-direction:column; gap:10px;
}
.m-page.pattern-page {
  height:100%;
  min-height:0;
  overflow:hidden;
}
.m-empty {
  margin:80px 20px; text-align:center;
  font-size:13px; color:var(--sub); line-height:1.7;
}

/* ───────── 카드 공통 ───────── */
.m-card {
  background:var(--surface);
  border-radius:var(--r-md);
  box-shadow:var(--shadow);
  padding:13px 14px;
  display:flex; flex-direction:column; gap:6px;
  position:relative;
}
/* + 타입 — 학생앱 전용 보충 카드. 일반 카드와 아주 살짝 구분되는 연회색 음영 */
.m-card.plus-card,
.m-card.kalimat-plus { background:#f2f3f6; }
.hl-text { color:var(--hl-text); font-weight:inherit; }
/* 명사문 구분자 (`css = 'nom'`) — 시작어 ‖ 서술어 */
.nom-divider {
  display:inline-block;
  color:var(--sub);
  opacity:.4;
  font-size:.55em;     /* 부모 폰트의 55% — 세로 길이 작게 */
  font-weight:200;     /* 얇게 */
  margin:0 .5em;
  vertical-align:.2em; /* 살짝 위로 — 글자 중앙 부근에 위치 */
  user-select:none;
}
.m-trans .hl-text,
.m-ko .hl-text,
.m-summary .hl-text { font-weight:700; }
/* 아랍어 부분 강조는 DOM을 나누지 않는 CSS Custom Highlight로 처리 */
::highlight(ata-arabic-focus) { color:var(--hl-text); }
.ata-highlight-fallback .ata-range-text { color:var(--hl-text); }
.hl-box-inline {
  border:1.5px solid var(--accent);
  border-radius:6px;
  padding:.05em .35em;
  color:var(--accent);
}
.m-hero {
  width:100%;
  height:auto;
  display:block;
  border-radius:0;
}
.m-hero-wrap {
  position:relative;
  width:100%;
  overflow:hidden;
}
.m-hero-fallback {
  position:absolute;
  inset:0;
  display:none;
  place-items:center;
  padding:18px;
  text-align:center;
  font-size:12px;
  line-height:1.55;
  color:var(--sub);
  border:1px dashed rgba(18,32,90,.18);
}
.m-hero-wrap.failed .m-hero { visibility:hidden; }
.m-hero-wrap.failed .m-hero-fallback { display:grid; }
.m-script {
  margin-top:10px;
  padding-top:12px;
  border-top:1px solid var(--border-soft);
  font-size:var(--script-size);
  line-height:1.6;
  color:var(--sub);
  text-align:left;
  white-space:pre-line;
}
.m-instruction {
  padding:0 4px;
  font-size:13px;
  line-height:1.65;
  color:var(--text);
  text-align:center;
}
.m-subsection {
  display:flex;
  flex-direction:column;
  gap:12px;
}
.m-subsection + .m-subsection { margin-top:14px; }
.m-subtitle {
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 4px;
  font-size:11px;
  font-weight:700;
  color:var(--sub);
  letter-spacing:1.3px;
  text-transform:uppercase;
}
.m-subtitle::before {
  content:'';
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--warm);
}
.m-card .m-ar {
  font-family:var(--font-ar); direction:rtl;
  font-size:var(--ar-card-size); font-weight:500; line-height:1.45;
  color:var(--text); text-align:center;
  padding:2px 2px 1px;
}
.m-card .m-trans {
  font-size:var(--trans-size); color:var(--sub);
  text-align:center; line-height:1.4;
  font-style:italic; font-weight:400;
  letter-spacing:.2px;
}
.m-card .m-ko {
  font-size:var(--ko-size); color:var(--text);
  font-weight:500;
  text-align:center; line-height:1.4;
}
.m-pair {
  display:grid;
  grid-template-columns:minmax(0,.9fr) minmax(0,1.2fr);
  gap:10px;
  align-items:start;
}
.m-pair-left {
  text-align:left;
  min-width:0;
}
.m-pair-right {
  min-width:0;
  text-align:right;
  display:flex; flex-direction:column; gap:5px;  /* 아랍어 ↔ 음가 간격 */
}
.m-pair-right .m-ar,
.m-pair-right .m-trans {
  text-align:right;
}
.m-pair-left .m-ko {
  text-align:left;
}
/* max-width가 440px이라 데스크톱에서도 모바일과 같은 폰트/그리드 유지 — 별도 오버라이드 없음 */
.m-flag {
  display:inline-block;
  width:12px; height:12px;
  border-radius:50%;
  vertical-align:middle;
  opacity:1;
  flex-shrink:0;
}
.m-flags {
  display:inline-flex;
  align-items:center;
  gap:4px;
  vertical-align:middle;
}
/* 아랍어 라인 안 인라인 깃발 (표현/래퍼토리 페어/드릴 non-five) */
.m-ar-line {
  display:flex;
  align-items:center;
  justify-content:flex-start;  /* RTL에서 start = 오른쪽 */
  gap:6px;
  direction:rtl;
}
.m-ar-line .m-ar { padding:0; }
/* 나스 카드 — 좌측 한국어 칸 하단 깃발 */
.m-pair-left .m-flags {
  margin-top:8px;
  justify-content:flex-start;
}
/* 5열 모드만 깃발 미표시 (좁은 칸). 2열 모드는 깃발 표시 */
.m-rep-grid:not(.cols-two) .m-flags,
.m-drill-grid:not(.cols-two) .m-flags { display:none; }

/* 탭 가능한 아랍어 (오디오) */
.tap-audio { cursor:pointer; transition:color .18s; }
.tap-audio:active { opacity:.7; }
.tap-audio.playing { color:var(--accent) !important; }

/* ───────── 패턴 카드 ───────── */
.m-card.pattern {
  gap:12px;
  padding:18px 16px;
  height:auto;
  max-height:var(--pattern-card-max-height);
  flex:0 0 auto;
  min-height:0;
  overflow:hidden;
}
.m-card.pattern .m-ar {
  font-size:var(--ar-pattern-size);
  font-weight:600;
  padding:14px 4px 8px;
}
.m-card.pattern .m-ko {
  font-size:12px;
  font-weight:600;
  margin-top:2px;
  line-height:1.7;
}
.m-card.pattern .m-trans {
  margin-top:0;
}
.m-card.pattern .m-summary {
  margin-top:8px;
  font-size:var(--script-size); line-height:1.65; color:var(--sub);
  text-align:left;
  flex:1 1 auto;
  min-height:0;
  max-height:none;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:0 4px 4px 0;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
}
.m-card.pattern .m-summary .bullet {
  display:block; padding-left:14px; position:relative;
  margin:0;
  line-height:1.55;
  color:var(--sub);
}
.m-card.pattern .m-summary .bullet::before {
  content:'•'; color:var(--accent); position:absolute; left:2px; top:0;
}
/* 아랍어로 시작하는 불릿 → RTL: 점을 우측으로, 본문도 우측 정렬 */
.m-card.pattern .m-summary .bullet[dir="rtl"] {
  padding-left:0; padding-right:14px; text-align:right;
}
.m-card.pattern .m-summary .bullet[dir="rtl"]::before {
  left:auto; right:2px;
}
.m-card.pattern .m-summary .para {
  display:block;
  margin:0 0 16px;
}
/* 블릿 뒤에 이어지는 설명은 줄바꿈(간격)을 넣어 분리 (대표 지침) */
.m-card.pattern .m-summary .bullet + .para {
  margin-top:16px;
}
.m-card.pattern .m-summary .quote {
  display:block;
  margin:16px 0 0;
  padding:10px 12px;
  border-left:3px solid var(--accent);
  background:var(--accent-bg);
  border-radius:8px;
  color:var(--sub);
  line-height:1.55;
}
.m-card.pattern .m-summary .script-table,
.m-script .script-table {
  width:100%;
  table-layout:fixed;
  margin:10px 0 16px;
  border-collapse:separate;
  border-spacing:0;
  overflow:hidden;
  border:1px solid var(--border-soft);
  border-radius:8px;
  direction:ltr;
}
.m-card.pattern .m-summary .script-table td,
.m-card.pattern .m-summary .script-table th,
.m-script .script-table td,
.m-script .script-table th {
  padding:8px 9px;
  border-right:1px solid var(--border-soft);
  border-bottom:1px solid var(--border-soft);
  background:var(--surface);
  color:var(--text);
  font-size:11px;
  line-height:1.45;
  text-align:center;
  vertical-align:middle;
}
.m-card.pattern .m-summary .script-table tr:last-child td,
.m-card.pattern .m-summary .script-table tr:last-child th,
.m-script .script-table tr:last-child td,
.m-script .script-table tr:last-child th { border-bottom:0; }
.m-card.pattern .m-summary .script-table td:last-child,
.m-card.pattern .m-summary .script-table th:last-child,
.m-script .script-table td:last-child,
.m-script .script-table th:last-child { border-right:0; }
.m-card.pattern .m-summary .script-table th,
.m-script .script-table th {
  background:var(--soft);
  font-weight:700;
}
.m-card.pattern .m-summary .script-table [dir="rtl"],
.m-script .script-table [dir="rtl"] {
  font-family:var(--font-ar);
  font-size:15px;
  font-weight:500;
  text-align:right;
}
.m-card.pattern .m-summary .script-table td[dir="ltr"],
.m-script .script-table td[dir="ltr"] {
  direction:ltr;
  text-align:left;
}
.m-card.pattern .m-summary .script-table td[dir="rtl"],
.m-script .script-table td[dir="rtl"] {
  direction:rtl;
  text-align:right;
}

/* 스크립트 길이와 css 값에 관계없이 패턴 카드 높이를 통일한다.
   아래 레퍼토리가 있으면 최대 170px과 페이지 간격 10px을 먼저 확보한다. */
.m-page.pattern-page > .m-card.pattern:not(.pattern-with-hero) {
  flex:0 0 auto;
  height:var(--pattern-card-max-height);
  min-height:0;
  max-height:var(--pattern-card-max-height);
}
.m-page.pattern-page.has-reps > .m-card.pattern:not(.pattern-with-hero) {
  height:min(var(--pattern-card-max-height), calc(100% - min(170px, 30dvh) - 10px));
  max-height:min(var(--pattern-card-max-height), calc(100% - min(170px, 30dvh) - 10px));
}
.m-page.pattern-page > .m-rep-wrap,
.m-page.pattern-page > .m-card.repertory,
.m-page.pattern-page > .m-rep-table {
  flex:0 0 auto;
  max-height:min(170px, 30dvh);
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}

/* 패턴 스크립트의 2열 예문표: 한국어는 왼쪽, 아랍어와 음가는 오른쪽에 정렬한다. */
.m-card.pattern .m-summary .script-pair-table,
.m-script .script-pair-table {
  table-layout:fixed;
}
.m-card.pattern .m-summary .script-pair-table td,
.m-script .script-pair-table td {
  padding:9px 10px;
  border-right:0;
  vertical-align:middle;
}
.m-card.pattern .m-summary .script-pair-table .script-ko,
.m-script .script-pair-table .script-ko {
  width:44%;
  direction:ltr;
  text-align:left;
  font-family:var(--font-kr);
  font-size:var(--ko-size);
  font-weight:500;
  line-height:1.45;
  color:var(--text);
}
.m-card.pattern .m-summary .script-pair-table .script-ar,
.m-script .script-pair-table .script-ar {
  width:56%;
  direction:rtl;
  text-align:right;
  font-family:var(--font-ar);
  font-size:15px;
  font-weight:500;
  line-height:1.45;
  color:var(--text);
}
.m-card.pattern .m-summary .script-pair-table .script-ar-main,
.m-script .script-pair-table .script-ar-main {
  display:block;
  direction:rtl;
  unicode-bidi:isolate;
  text-align:right;
  font-family:var(--font-ar);
  font-size:15px;
  font-weight:500;
  line-height:1.45;
}
.m-card.pattern .m-summary .script-pair-table .script-trans,
.m-script .script-pair-table .script-trans {

/* ───────── 패턴 + 히어로 이미지 (임시) ─────────

   아랍어/한국어/음가 데이터는 숨김. 스크립트만 적정 간격을 두고 노출.
   이미지 실패 시 JS의 onFail에서 .pattern-with-hero 클래스 제거 → 일반 카드로 복원. */
.m-card.pattern.pattern-with-hero {
  height:var(--pattern-hero-card-height);
  flex-basis:var(--pattern-hero-card-height);
  padding-top: 0;            /* 이미지가 카드 상단 가장자리에 붙도록 위쪽 패딩 제거 */
  overflow: hidden;          /* 이미지가 카드 radius를 넘지 않게 */
}
.m-card.pattern.pattern-with-hero .m-hero-wrap {
  margin: 0 -16px;           /* 카드 좌우 패딩(16px) 상쇄해 가로폭 가득 채움 */
  width: calc(100% + 32px);
  flex: 0 0 168px;
  height: 168px;
}
.m-card.pattern.pattern-with-hero .m-hero { width:100%; height:100%; object-fit:cover; display:block; }
/* 데이터 숨김 — 이미지가 패턴 정보를 대체 */
.m-card.pattern.pattern-with-hero .m-ar,
.m-card.pattern.pattern-with-hero .m-ko,
.m-card.pattern.pattern-with-hero .m-trans { display: none; }
/* 이미지 ↔ 스크립트 간격 */
.m-card.pattern.pattern-with-hero .m-summary {
  margin-top: 14px;
  padding: 0 4px 4px;
}

@media (max-height:700px) {

    --pattern-card-max-height: min(480px, calc(100dvh - 188px));

    --pattern-hero-card-height: min(410px, calc(100dvh - 224px));

  .m-card.pattern {
    gap:10px;
    padding-top:16px;
    padding-bottom:16px;

/* ───────── 표현·래퍼토리 카드 (작게, 인쇄 카드 느낌) ─────────
   래퍼토리 문장은 표현(exp)과 완전히 같은 양식. 5열 그리드는 한국어가 없는
   알파벳/발음 연습에만 사용한다. */
.m-card.exp,
.m-card.repertory { gap:7px; }
.m-card.exp.exp-plus {
  background:#f2f3f6; /* exp+는 학생앱 전용 보충 표현: 아주 연한 음영으로만 구분 */
}
.m-card.exp .m-ar,
.m-card.repertory .m-ar { font-size:var(--ar-nass-size); }
/* 페어 모드 레퍼토리 — 개별 카드들을 묶는 투명 컨테이너 */
.m-rep-wrap {
  display:flex; flex-direction:column; gap:8px;
}

/* ───────── 드릴 표 ───────── */
.m-drill-table {
  background:var(--surface);

}
.m-rep-grid,
.m-drill-grid {

  gap:14px 4px;

}
@media (max-width:480px) {
  .m-rep-grid:not(.cols-two),
  .m-drill-grid:not(.cols-two) { grid-template-columns:repeat(4, 1fr); gap:14px 2px; }
}
/* 2열 모드 (`css = 'two'`) — 박스가 좌우로 2개씩 */
.m-rep-grid.cols-two,
.m-drill-grid.cols-two {
  grid-template-columns:1fr 1fr;
  gap:10px;
  direction:ltr;  /* 박스 배치는 좌→우 */
}
.cols-two .drill-cell {
  flex-direction:row;

  gap:10px;
}
.cols-two .dc-body { flex:1 1 auto; display:flex; flex-direction:column; gap:3px; min-width:0; }
.cols-two .m-ar-line {
  justify-content:flex-start;  /* RTL: start = 오른쪽 */
  direction:rtl;
  flex-wrap:wrap;   /* 긴 문장+깃발이 칸을 넘치면 깃발이 아래로 내려가 칸이 안 깨짐 */
  row-gap:3px;
}
.cols-two .dc-ar,
.cols-two .dc-trans {
  text-align:right;
  direction:rtl;
}
.cols-two .dc-ko {
  font-family:var(--font-kr);
  font-size:var(--ko-size);

  line-height:1.45;
  flex:0 0 40%;
  direction:ltr;
}
/* two 박스 국기는 셀 좌측 아래로 (아랍어 자리 안 뺏게) — 대표 지침 */
.cols-two .drill-cell { position:relative; }

/* 6열 모드 (`css = 'six'`) — five와 같지만 6칸. 칸이 좁으니 글자 약간 축소 */

.m-drill-grid.cols-six { grid-template-columns:repeat(6, 1fr); gap:14px 3px; }
@media (max-width:480px) {

}

/* 3열 모드 (`css = 'three'`) — five와 동일하되 3칸. 칸이 넓어 글자 크기는 five 그대로 */

.m-drill-grid.cols-three { grid-template-columns:repeat(3, 1fr); gap:14px 6px; }

.m-drill-table + .m-drill-table,

/* ───────── 나스(지문) 카드 ───────── */
.m-card.nass.nass-plus {
  background:#f2f3f6; /* nass+는 학생앱 전용 보충 지문: 아주 연한 음영으로만 구분 */

/* ───────── baseline (알파벳) ───────── */
.m-baseline {
  background:var(--surface);

  border:1px solid var(--border-soft);
  padding:20px 0 16px;

}

  display:flex;

}
.m-bl-grid::after {

}
.m-baseline.no-line .m-bl-grid::after { display:none; }  /* css='baseline2' — 기준선 미표시 */
.m-bl-cell {

}
.m-bl-letter {
  font-family:var(--font-ar);

  text-align:center; font-weight:600; color:var(--text);
  line-height:1; z-index:1;
}
.m-bl-triple {
  font-family:var(--font-ar);
  font-size:clamp(.82rem, 4.1vw, 1.15rem);

  font-weight:500;
  color:var(--text);
  line-height:1.2;
  white-space:nowrap;
}
.m-bl-label {
  font-size:var(--trans-size); color:var(--sub);  /* 다른 발음(음가)과 동일 크기·색으로 통일 (vw→고정 10px) */
  text-align:center; font-weight:500;
  letter-spacing:.3px;
}

.m-foot {
  flex-shrink:0; height:64px;

}

}

.m-page-ind {

}
.m-toggle.on { background:var(--accent-bg); border-color:var(--accent); color:var(--accent); }

/* ───────── 사이드바 (유닛 픽커) ───────── */
.m-sb-overlay {

}

}

.m-unit-link,

}
.m-unit-link.active,
.m-pattern-link.active {

.m-sb-foot {

<script>
/* ============================================================
   ATA 1.4.4 — 교재 모바일 앱 초안 (textbook144m.html)
   - 페이지 = 교재 페이지 단위 (한 페이지가 길면 스크롤)
   - 글로벌 페이지 시퀀스: 표현 → 단어 → 패턴(N)·드릴 → 지문
   - ◀▶ = 유닛 전체 순차 이동 / 사이드바 = 유닛·패턴별 바로가기

/* ═══════════ 1.4.5 스키마 호환 계층 (v1.4.5-compat) ═══════════

   - 타입: rep→repertory, drill/drill+→drilla(레이아웃은 css 열로 분기). */
const TAB_145 = {
  units:'데이터시트sheet', unit:'데이터시트sheet', pattern:'데이터시트sheet',
  repertory:'데이터시트sheet', drill:'데이터시트sheet', expression:'데이터시트sheet',
  exp:'데이터시트sheet', kalimat:'데이터시트sheet', sheet:'데이터시트sheet',
  nass:'데이터시트sheet', alam:'고유명사alam', appendix:'어펜딕스appendix',
};
const resolveTab145 = n => TAB_145[String(n||'').toLowerCase().trim()] || n;
const TYPE_145 = { rep:'repertory', drill:'drilla', 'drill+':'drilla', kal:'kalimat', 'kal+':'kalimat+' };
function compat145(r) {
  if (!r || typeof r !== 'object') return r;
  const t = String(r.type||'').toLowerCase().trim();
  // drill / drill+은 같은 화면 타입으로 렌더하지만, 메인→추가 순서는 보존한다.
  if (t === 'drill' || t === 'drill+') r._sourceType = t;
  if (TYPE_145[t]) r.type = TYPE_145[t];
  if (t === 'unit') {                 // 유닛 헤더: `|` 구분자 제거 + 이어쓰기(둘째 줄) 숨김 → 첫 줄만
    if (r.arabic) r.arabic = String(r.arabic).split('\n')[0].replace(/\s*\|\s*/g, ' ').trim();
    if (r.korean) r.korean = String(r.korean).split('\n')[0].replace(/\s*\|\s*/g, ' ').trim();
  }
  const p = String(r.ptn||'').trim();
  if (p) { if (!r['id_ptn(no)']) r['id_ptn(no)']=p; if (!r.id_ptn) r.id_ptn=p; if (!r.ref_ptn) r.ref_ptn=p; }
  return r;
}
// 표현 이미지 = type=expi 행. 파일명은 그 행의 id 값 그대로 사용한다.
const rowType = r => String((r && r.type) || '').toLowerCase().trim();
// 유닛 행: 데이터시트sheet의 type=unit 행에서 가져온다(유닛unit 탭은 참고용 자동뷰)
const unitRows = () => (_cache[TABS.units] || []).filter(r => rowType(r) === 'unit');
const isExpi = r => rowType(r) === 'expi';
const isAppExpression = r => rowType(r) === 'expi' || rowType(r) === 'exp' || rowType(r) === 'exp+';
const isExpPlus = r => rowType(r) === 'exp+';
const sortAppExpressions = rows => [
  ...rows.filter(r => !isExpPlus(r)),
  ...rows.filter(r => isExpPlus(r)),
];
const isNassPlus = r => rowType(r) === 'nass+';
const sortNassRows = rows => [

const isPlusRow = r => rowType(r).endsWith('+') || String((r && r._kind) || '').endsWith('-plus');
function slug145(raw) {
  return String(raw || '')

    .replace(/\*/g, '')
    .replace(/_/g, '')
    .replace(/'/g, '')
    .replace(/ʿ|ʕ/g, '3')
    .replace(/ʾ/g, '2')
    .replace(/[.,!?]/g, '')
    .replace(/ā/g, 'aa')
    .replace(/ī/g, 'ii')
    .replace(/ū/g, 'uu')
    .replace(/ē/g, 'e')
    .replace(/ō/g, 'o')
    .replace(/ḥ/g, 'hh')
    .replace(/ṣ/g, 'ss')
    .replace(/ḍ/g, 'dd')
    .replace(/ṭ/g, 'tt')
    .replace(/ẓ/g, 'zz')
    .replace(/[\s-]+/g, '-')
    .replace(/^-+|-+$/g, '');
}
function imageId(r) {
  if (!isExpi(r)) return '';
  const id = String((r && r.id) || '').trim();
  if (id) return id;
  const fallback = slug145(r && (r.note || r.transliteration || r.korean || r.arabic));

}

/* ───────── JSONP 로더 ───────── */
const _cache = {};
function fetchSheet(name) {
  const real = resolveTab145(name);
  if (_cache[real]) return Promise.resolve(_cache[real]);
  return new Promise((resolve, reject) => {
    const cb = '__gviz_' + real.replace(/\W/g,'') + '_' + Date.now();
    const timer = setTimeout(() => { delete window[cb]; reject(new Error('Timeout: '+real)); }, 15000);
    window[cb] = resp => {
      clearTimeout(timer); delete window[cb];
      if (script.parentNode) script.parentNode.removeChild(script);
      try {
        if (!resp?.table) throw new Error('No data: '+real);
        const headers = resp.table.cols.map(c => (c.label||'').toLowerCase().trim());
        const rows = (resp.table.rows||[]).map(row => {
          const obj = {};
          headers.forEach((h,i) => {
            if (!h) return;
            const cell = row.c?.[i];
            const v = cell && cell.v != null
              ? (cell.f != null && (typeof cell.v==='number'||String(cell.v).startsWith('Date(')) ? cell.f : cell.v)
              : null;
            obj[h] = v != null ? String(v).trim() : '';
          });
          return compat145(obj);
        }).filter(r => Object.values(r).some(v => v !== ''));
        _cache[real] = rows; resolve(rows);
      } catch(e) { reject(e); }
    };
    const script = document.createElement('script');
    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&sheet=${encodeURIComponent(real)}&headers=1`;
    script.onerror = () => { clearTimeout(timer); delete window[cb]; reject(new Error('Load fail: '+real)); };
    document.head.appendChild(script);
  });
}

try{const _dp=new URLSearchParams(location.search).get('dev');if(_dp==='1')localStorage.setItem('ata_dev','1');else if(_dp==='0')localStorage.removeItem('ata_dev');}catch(e){}

function parseInline(str) {
  if (!str) return '';
  const html = String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>')
    .replace(/_([^_\n]+)_/g,'<span class="hl-box-inline">$1</span>');
  return ATAInlineHighlights.render(html, 'hl-text');
}

// 첫 강한 방향 문자로 LTR/RTL 판정 — 마크업(`*_<tag>`) 제거 후 검사.
// 아랍어 시작 → 'rtl', 라틴/한글 시작 → 'ltr'. (불릿/산문에서 줄 단위로 사용)
function firstStrongDir(raw) {
  const t = String(raw || '').replace(/<[^>]+>/g, '').replace(/[*_]/g, '');
  for (const ch of t) {
    const c = ch.codePointAt(0);
    if ((c >= 0x0600 && c <= 0x06FF) || (c >= 0x0750 && c <= 0x077F) ||
        (c >= 0x08A0 && c <= 0x08FF) || (c >= 0xFB50 && c <= 0xFDFF) ||
        (c >= 0xFE70 && c <= 0xFEFF)) return 'rtl';
    if ((c >= 0x41 && c <= 0x5A) || (c >= 0x61 && c <= 0x7A) ||
        (c >= 0xAC00 && c <= 0xD7A3) || (c >= 0x3130 && c <= 0x318F)) return 'ltr';
  }
  return 'ltr';
}

function parseTrans(str) {
  if (!str) return '';
  const html = String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>')
    .replace(/_([^_\n]+)_/g,'$1');
  return ATAInlineHighlights.render(html, 'hl-text');
}

function parseDrillBlank(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\n/g,'<br>')
    .replace(/\*([^*\n]+)\*/g, '<span class="m-blank">$1</span>');
}

// 명사문 구분자 — `css = 'nom'` 행의 `|`를 옅은 회색 분리자로
function applyNomDivider(html) {

}
const isNomRow = r => (r.css || '').trim().toLowerCase() === 'nom';

function getRowId(r) {
  return r.id || r.id_unit || r['id_ptn(no)'] || r.id_ptn || r.id_drill ||
    r.id_rep || r.id_repertory || r.id_kalimat || r.id_expression || r.id_nass || '';
}

function fallbackAudioKey(row) {
  const note = (row.note || row.transliteration || '').trim();
  if (!note) return '';
  const type = normType(row.type);
  if (type === 'repertory' || type === 'repertorie') {
    return (/^_/.test(note) || /^(fatha|damma)$/i.test(note)) ? `rep_${note}` : `mit_${note}`;
  }
  if (type === 'drilla' || type === 'drillb' || type === 'drillc') return `dri_${note}`;
  if (type === 'exp') return `exp_${note}`;
  return '';
}

// dev(localhost)에서만 캐시 우회 — 오디오 수정 즉시 확인용.
// prod(github.io 등)는 쿼리 없이 GCS 1시간 캐시 그대로 (사용자 빠름).
// (IS_DEV는 위 유틸 섹션에서 정의)
function audioCacheBust(u) {
  return IS_DEV ? `${u}${u.includes('?') ? '&' : '?'}_dev=${Date.now()}` : u;
}

function audioUrlsFor(row) {
  if (row?.url) return [audioCacheBust(row.url.trim())];
  const id = getRowId(row) || fallbackAudioKey(row);
  if (!id) return [];
  const unit = row?.u || state.unit;
  const enc = encodeURIComponent(id.normalize('NFD')).replace(/%2C/gi, ',');
  // mp3 우선 시도 (작고 빠름) → 실패 시 wav 폴백 (audio-rules 규칙)
  return [
    audioCacheBust(`${AUDIO_BASE}/${unit}/${enc}.mp3`),
    audioCacheBust(`${AUDIO_BASE}/${unit}/${enc}.wav`),
  ];
}

function lahjaFlags(row) {
  return (row?.lahja || '')
    .toUpperCase()
    .split(/[,\s]+/)

}

function renderFlags(row) {
  const flags = lahjaFlags(row);
  if (!flags.length) return '';
  return `<span class="m-flags">${flags.map(src => `<img class="m-flag" src="${src}" alt="">`).join('')}</span>`;
}

function getUnitRow(unit) {
  return unitRows().find(r => r.u === unit && ok(r)) ||
    unitRows().find(r => r.u === unit) || {};
}

function matchesUnit(row, unit, unitRow = getUnitRow(unit)) {
  return row.u === unit || (!!unitRow.id_unit && row.ref_unit === unitRow.id_unit);
}

function ptnRef(row) {
  return row?.id || row?.['id_ptn(no)'] || row?.id_ptn || '';
}

function refKey(value) {
  return String(value || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9가-힣ء-ي]/g, '');
}

function ptnNumOf(v) {
  const m = String(v || '').match(/^(ptn\d+)/i);
  return m ? m[1].toLowerCase() : '';
}
function sameRef(a, b) {
  if (refKey(a) && refKey(a) === refKey(b)) return true;
  // 폴백: 래퍼 ref_ptn 슬러그가 패턴 id 슬러그와 달라도 ptnNNN 번호가 같으면 매칭(인쇄앱과 동일)
  const pa = ptnNumOf(a), pb = ptnNumOf(b);
  return !!pa && pa === pb;
}

function ptnLabel(row) {
  const m = ptnRef(row).match(/p(?:tn)?0*(\d+)/i);
  return m ? `PATTERN ${m[1].padStart(2,'0')}` : 'PATTERN';
}

function ptnNumber(row) {
  const m = ptnRef(row).match(/p(?:tn)?0*(\d+)/i);
  return m ? m[1].padStart(2,'0') : '';
}

// 앱 표시용 유닛 코드: A001 → A01 (문자 유지, 번호 2자리). 시트값은 그대로.
function unitNo(unit) {
  return String(unit || '').replace(/\d+/, m => m.slice(-2).padStart(2, '0'));
}

function isChapterZeroUnit(unit = state.unit) {
  const match = String(unit || '').match(/^A0*(\d+)$/i);
  const number = match ? Number(match[1]) : NaN;
  return Number.isFinite(number) && number >= 1 && number <= 5;
}

function patternTitle(row) {
  return String(row?.korean || '')
    .split(/\n+/)[0]

function pagePatternRefs(page) {
  const refs = Array.isArray(page?.ptnRefs) ? page.ptnRefs : [];
  if (refs.length) return refs.filter(Boolean);
  if (page?.row && page.sec === 'ptn') return [ptnRef(page.row)].filter(Boolean);
  return [];
}

function pageHasPatternRef(page, ref) {
  return pagePatternRefs(page).some(candidate => sameRef(candidate, ref));
}

function patternRowForRef(ref, pages = state.pages) {
  return pages.find(page => page.sec === 'ptn' && sameRef(ptnRef(page.row), ref))?.row || null;
}

function activePatternRef(page = state.pages[state.page]) {
  const refs = pagePatternRefs(page);
  if (!refs.length) return '';
  if (state.contextPtnRef && refs.some(ref => sameRef(ref, state.contextPtnRef))) {
    return refs.find(ref => sameRef(ref, state.contextPtnRef)) || refs[0];
  }
  return refs[0];
}

function firstPageIndexForPattern(ref, sec, pages = state.pages) {
  return pages.findIndex(page => page.sec === sec && pageHasPatternRef(page, ref));
}

function firstOverviewNassIndex(pages = state.pages) {
  const scoped = pages.findIndex(page => page.sec === 'nass' && page.navScope === 'overview');
  return scoped >= 0 ? scoped : pages.findIndex(page => page.sec === 'nass');
}

function pageLocationLabel(page) {
  if (!page) return '';
  if (page.sec === 'exp') return '표현';
  if (page.sec === 'kalimat') return '단어';
  if (page.sec === 'nass' && page.navScope === 'overview') {
    return isChapterZeroUnit() ? '지문' : '전체 지문';
  }

  const ref = activePatternRef(page);
  const patternRow = ref ? patternRowForRef(ref) : null;
  const no = patternRow ? ptnNumber(patternRow) : '';
  const prefix = no ? `패턴 ${Number(no)}` : '';

  if (page.sec === 'ptn') return prefix || '패턴';
  if (page.sec === 'drill') {
    if (!patternRow) return '종합 드릴';
    const siblings = ref
      ? state.pages.filter(candidate => candidate.sec === 'drill' && pageHasPatternRef(candidate, ref))
      : state.pages.filter(candidate => candidate.sec === 'drill');
    const idx = siblings.findIndex(candidate => candidate === page);
    const suffix = siblings.length > 1 ? ` ${idx + 1}/${siblings.length}` : '';
    return prefix ? `${prefix} · 드릴${suffix}` : `드릴${suffix}`;
  }
  if (page.sec === 'nass') {
    if (prefix) return `${prefix} · 지문`;
    const siblings = state.pages.filter(candidate => candidate.sec === 'nass');
    const idx = siblings.findIndex(candidate => candidate === page);
    return siblings.length > 1 ? `지문 ${idx + 1}/${siblings.length}` : '지문';
  }
  return page.title || '';
}

function sortByPtn(a, b) {
  return ptnRef(a).localeCompare(ptnRef(b), undefined, { numeric:true, sensitivity:'base' });
}

function rowsByUnit(tab, unit, typeFilter) {
  const unitRow = getUnitRow(unit);
  return (_cache[tab] || [])
    .filter(r => matchesUnit(r, unit, unitRow) && ok(r))
    .filter(r => !typeFilter || typeFilter(normType(r.type), r));
