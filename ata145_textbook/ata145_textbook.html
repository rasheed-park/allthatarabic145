function drillPageMode(row) {
  return String(row?.css || '').trim().toLowerCase() === 'two' ? 'two' : 'grid';
}

function drillPageRef(row) {
  const ref = String(row?.ref_ptn || '').trim();
  const numbered = ref.match(/^p(?:tn)?0*(\d+)/i);
  return numbered ? `p${Number(numbered[1])}` : (refKey(ref) || '__unit__');
}

function drillSegmentRef(row) {
  const ref = String(row?.ref_ptn || '').trim();
  const mergesA005AlifHamza = String(row?.u || '').trim() === 'A005' &&
    /^ptn01(?:5|6)(?:_|$)/i.test(ref);
  return mergesA005AlifHamza ? 'ptn015_016_a005_alif_hamza' : drillPageRef(row);
}

// 한 page 안에서도 레이아웃 모드가 바뀌면 화면을 나눈다.
// 서로 다른 패턴은 나누되 A005의 알리프·함자 공동 드릴만 한 화면에 유지한다.
function splitDrillPageSegments(rows) {
  const segments = [];
  rows.forEach(row => {
    const mode = drillPageMode(row);
    const ref = drillSegmentRef(row);
    const prev = segments[segments.length - 1];
    const startsNew = !prev || prev.mode !== mode || prev.ref !== ref;
    if (startsNew) segments.push({ mode, ref, rows: [] });
    segments[segments.length - 1].rows.push(row);
  });
  return segments;
}

// css와 무관한 학습 단계: 같은 패턴에서는 메인 드릴 뒤에 추가 드릴을 둔다.
// `two`는 순서가 아니라 레이아웃만 결정한다.
function drillStage(row) {
  return String(row?._sourceType || '').trim().toLowerCase() === 'drill+' ? 1 : 0;
}

function orderDrillRows(rows) {
  return rows.map((row, index) => ({ row, index })).sort((a, b) => {
    const aRef = drillPageRef(a.row), bRef = drillPageRef(b.row);
    if (aRef === bRef && drillStage(a.row) !== drillStage(b.row)) {
      return drillStage(a.row) - drillStage(b.row);
    }
    return a.index - b.index;
  }).map(({ row }) => row);
}

/* ───────── 페이지 빌더 ───────── */
/* 페이지 = 교재 한 페이지. 한 페이지 안의 모든 카드/표는 그대로 스택해 스크롤. */

function buildPagesForUnit(unit) {
  const unitRow = getUnitRow(unit);
  const expPages = [];
  const kalimatPages = [];
  const patternPages = [];
  const drillPages = [];
  const patternNassPages = [];
  const overviewNassPages = [];
  const uniqueRefs = rows => [...new Set(rows.map(row => String(row.ref_ptn || '').trim()).filter(Boolean))];

  // 표현 — 학생앱에는 expi + exp + exp+를 모두 노출한다.
  const expRows = sortAppExpressions(rowsByUnit(TABS.exp, unit, (_t, r) => isAppExpression(r)));
  if (expRows.length) {
    // 유닛 이미지(1.4.5): 유닛당 1개 `img_<유닛>.png`, 첫 표현 위. 없으면 onerror로 숨김(expi 폐기).
    const expImageId = 'img_' + String(unit).toLowerCase();
    expPages.push({
      sec:'exp', kind:'list',
      title:'표현', subtitle: expRows.length + '개',
      hero: expImageId,
      cards: expRows.map(r => ({...r, _kind:'exp'})),
    });
  }

  // 패턴 (한 패턴 = 한 페이지, 내부에 레퍼토리 포함)
  const ptnRows = rowsByUnit(TABS.pattern, unit, t => t === 'ptn').sort(sortByPtn);
  ptnRows.forEach((r, i) => {
    const ref = ptnRef(r);
    const reps = rowsByUnit(TABS.repertory, unit, t => t === 'repertory' || t === 'repertorie')
      .filter(rep => sameRef(rep.ref_ptn, ref));
    // 패턴 이미지는 더 이상 img 체크박스로 요청하지 않는다. 대표 이미지는 expi 행이 담당한다.
    patternPages.push({
      sec:'ptn', kind:'pattern',
      title:'패턴', subtitle: ptnNumber(r) || `${i+1} / ${ptnRows.length}`,
      hero: '',
      row: r, reps, ptnRefs:[ref],
    });
  });

  // 드릴 — page 값 있으면 화면 분리, 없으면 한 페이지.
  // css는 레이아웃만 결정한다. 같은 패턴 안에서는 메인 드릴 뒤에 추가 드릴을 둔다.
  const drillRowsRaw = rowsByUnit(TABS.drill, unit,
    (t, r) => ['drilla','drillb','drillc','writing'].includes(t) && (r.arabic || '').trim() !== '');
  const drillRows = orderDrillRows(drillRowsRaw);
  if (drillRows.length) {
    const pageVal = r => (r.page || '').toString().trim();
    const hasPaged = drillRows.some(r => pageVal(r) !== '');
    const chapter = String(unitRow.C || unitRow.c || '');
    if (hasPaged) {
      const byPage = new Map();
      drillRows.forEach(r => {
        const k = pageVal(r) || '￿';
        if (!byPage.has(k)) byPage.set(k, []);
        byPage.get(k).push(r);
      });
      const keys = [...byPage.keys()].sort((a, b) => {
        const na = parseFloat(a), nb = parseFloat(b);
        if (!isNaN(na) && !isNaN(nb)) return na - nb;
        return String(a).localeCompare(String(b), undefined, { numeric: true });
      });
      const pageGroups = keys.flatMap(k => splitDrillPageSegments(byPage.get(k)).map(seg => seg.rows));
      pageGroups.forEach((rows, i) => {
        drillPages.push({
          sec:'drill', kind:'drill',
          title:'드릴', subtitle: `${i+1} / ${pageGroups.length}`,
          rows,
          chapter,
          ptnRefs:uniqueRefs(rows),
        });
      });
    } else {
      // css 그리드와 two가 섞이거나 two의 연결 패턴이 바뀌면 다음 페이지로 넘긴다.
      const segs = splitDrillPageSegments(drillRows);
      segs.forEach((seg, i) => drillPages.push({
        sec:'drill', kind:'drill',
        title:'드릴', subtitle: segs.length > 1 ? `${i+1} / ${segs.length}` : seg.rows.length + '개',
        rows: seg.rows,
        chapter,
        ptnRefs:uniqueRefs(seg.rows),
      }));
    }
  }

  // 단어 (시트 행 순서의 kal → kalimat+)
  const kReg  = rowsByUnit(TABS.kalimat, unit, (t, r) => t === 'kalimat'  && (r.arabic || '').trim() !== '');
  const kPlus = rowsByUnit(TABS.kalimat, unit, (t, r) => t === 'kalimat+' && (r.arabic || '').trim() !== '');
  if (kReg.length || kPlus.length) {
    kalimatPages.push({
      sec:'kalimat', kind:'list',
      title:'단어', subtitle: (kReg.length + kPlus.length) + '개',
      cards: [
        ...kReg.map(r => ({...r, _kind:'kalimat'})),
        ...kPlus.map(r => ({...r, _kind:'kalimat-plus'})),
      ],
    });
  }

  // 연결 지문은 패턴 단계에서 드릴 바로 뒤에 놓고, 같은 행을 유닛 전체 지문에도 다시 모은다.
  // 미연결 지문은 패턴 단계에는 넣지 않고 전체 지문에만 자동 포함한다.
  const nassRows = rowsByUnit(TABS.nass, unit, t => t === 'nass' || t === 'nass+');
  const usedNass = new Set();
  const orderedNassRows = [];
  patternPages.forEach(patternPage => {
    const ref = patternPage.ptnRefs[0];
    const linked = sortNassRows(nassRows.filter(row =>
      !usedNass.has(row) && sameRef(row.ref_ptn, ref)
    ));
    if (!linked.length) return;
    linked.forEach(row => {
      usedNass.add(row);
      orderedNassRows.push(row);
    });
    patternNassPages.push({
      sec:'nass', kind:'list',
      title:'지문', subtitle: linked.length + '개',
      cards: linked.map(row => ({...row, _kind:'nass'})),
      ptnRefs:[ref],
      navScope:'pattern',
    });
  });
  const unlinkedNass = sortNassRows(nassRows.filter(row => !usedNass.has(row)));
  const allNassRows = [...orderedNassRows, ...unlinkedNass];
  if (allNassRows.length) {
    overviewNassPages.push({
      sec:'nass', kind:'list',
      title:'전체 지문', subtitle: allNassRows.length + '개',
      cards: allNassRows.map(row => ({...row, _kind:'nass'})),
      ptnRefs:[],
      navScope:'overview',
    });
  }

  // 챕터 1 여정은 표현 → 단어 → [패턴 → 드릴 → 연결 지문] 반복 → 전체 지문 순서다.
  // 챕터 0은 패턴·래퍼를 전부 끝낸 뒤 drill, drill+, 유닛 지문 순서로 고정한다.
  const journey = [...expPages, ...kalimatPages];
  if (isChapterZeroUnit(unit)) {
    journey.push(...patternPages, ...drillPages, ...overviewNassPages);
    return journey;
  }
  const usedDrills = new Set();
  patternPages.forEach((patternPage, patternIndex) => {
    journey.push(patternPage);
    drillPages.forEach(drillPage => {
      if (usedDrills.has(drillPage)) return;
      const matchedPatternIndexes = patternPages
        .map((candidate, index) => drillPage.ptnRefs.some(ref => pageHasPatternRef(candidate, ref)) ? index : -1)
        .filter(index => index >= 0);
      if (!matchedPatternIndexes.length || Math.max(...matchedPatternIndexes) !== patternIndex) return;
      usedDrills.add(drillPage);
      journey.push(drillPage);
    });
    if (!isChapterZeroUnit(unit)) {
      patternNassPages
        .filter(nassPage => pageHasPatternRef(nassPage, patternPage.ptnRefs[0]))
        .forEach(nassPage => journey.push(nassPage));
    }
  });
  drillPages.filter(page => !usedDrills.has(page)).forEach(page => journey.push(page));
  journey.push(...overviewNassPages);

  return journey;
}

/* ───────── 렌더 ───────── */

function renderHead() {
  const unitRow = unitRows().find(r => r.u === state.unit);
  document.getElementById('h-unit').textContent = unitNo(state.unit);
  document.getElementById('h-unit-ar').textContent = (unitRow?.arabic || '').slice(0, 22);
  document.getElementById('h-unit-ko').textContent = (unitRow?.korean || '').slice(0, 34);

  const curPage = state.pages[state.page];
  document.getElementById('h-counter').textContent = pageLocationLabel(curPage);

  // 푸터 인디케이터: 글로벌 (예: "03 / 07")
  const total = state.pages.length || 1;
  const cur   = Math.min(state.page+1, total);
  document.getElementById('page-ind').textContent =
    String(cur).padStart(2,'0') + ' / ' + String(total).padStart(2,'0');
  document.getElementById('prev').disabled = state.page <= 0;
  document.getElementById('next').disabled = state.page >= total - 1;
}

function renderContextNav() {
  const nav = document.getElementById('context-nav');
  const page = state.pages[state.page];
  const ref = activePatternRef(page);
  const row = ref ? patternRowForRef(ref) : null;
  const chapterZero = isChapterZeroUnit();
  if (chapterZero) {
    state.navMode = 'overview';
  } else {
    if (state.navMode === 'auto') {
      state.navMode = row ? 'pattern' : 'overview';
    }
    if (state.navMode === 'pattern' && !row) state.navMode = 'overview';
  }
  if (row) state.contextPtnRef = ref;

  const makeButton = (label, index, options = {}) => {
    const button = document.createElement('button');
    button.className = 'm-context-btn' + (options.back ? ' back' : '');
    button.type = 'button';
    button.textContent = label;
    button.disabled = index < 0;
    button.classList.toggle('active', Boolean(options.active));
    button.addEventListener('click', () => {
      if (index < 0) return;
      goToUnitPage(state.unit, index, options.ref || '', options.mode || 'overview');
    });
    return button;
  };

  nav.innerHTML = '';
  if (chapterZero) {
    const expIndex = state.pages.findIndex(candidate => candidate.sec === 'exp');
    const drillIndex = state.pages.findIndex(candidate => candidate.sec === 'drill');
    const nassIndex = firstOverviewNassIndex();
    nav.appendChild(makeButton('표현', expIndex, {
      active:page?.sec === 'exp', mode:'overview',
    }));
    const patternPages = state.pages.filter(candidate => candidate.sec === 'ptn');
    const patternGroups = patternPages.length <= 3
      ? patternPages.map(patternPage => [patternPage])
      : [[patternPages[0]], [patternPages[1]], patternPages.slice(2)];
    patternGroups.forEach((group, index) => {
      const patternRefs = group.flatMap(patternPage => patternPage.ptnRefs || []).filter(Boolean);
      nav.appendChild(makeButton(`패턴 ${index + 1}`, state.pages.indexOf(group[0]), {
        active:page?.sec === 'ptn' && patternRefs.some(patternRef => pageHasPatternRef(page, patternRef)),
        ref:patternRefs[0] || '',
        mode:'overview',
      }));
    });
    nav.append(
      makeButton('드릴', drillIndex, {
        active:page?.sec === 'drill', mode:'overview',
      }),
      makeButton('지문', nassIndex, {
        active:page?.sec === 'nass' && page?.navScope === 'overview', mode:'overview',
      })
    );
    return;
  }

  if (state.navMode === 'pattern' && row) {
    const expIndex = state.pages.findIndex(candidate => candidate.sec === 'exp');
    const number = ptnNumber(row);
    nav.append(
      makeButton('돌아가기', expIndex >= 0 ? expIndex : 0, { back:true, mode:'overview' }),
      makeButton(`패턴 ${number ? Number(number) : ''}`.trim(), firstPageIndexForPattern(ref, 'ptn'), {
        active:page?.sec === 'ptn', ref, mode:'pattern',
      }),
      makeButton('드릴', firstPageIndexForPattern(ref, 'drill'), {
        active:page?.sec === 'drill', ref, mode:'pattern',
      }),
      makeButton('지문', firstPageIndexForPattern(ref, 'nass'), {
        active:page?.sec === 'nass', ref, mode:'pattern',
      })
    );
    return;
  }

  const expIndex = state.pages.findIndex(candidate => candidate.sec === 'exp');
  const kalimatIndex = state.pages.findIndex(candidate => candidate.sec === 'kalimat');
  const nassIndex = firstOverviewNassIndex();
  nav.appendChild(makeButton('표현', expIndex, {
    active:page?.sec === 'exp', mode:'overview',
  }));
  nav.appendChild(makeButton('단어', kalimatIndex, {
    active:page?.sec === 'kalimat', mode:'overview',
  }));
  state.pages.filter(candidate => candidate.sec === 'ptn').forEach(patternPage => {
    const patternRef = patternPage.ptnRefs[0];
    const number = ptnNumber(patternPage.row);
    nav.appendChild(makeButton(`패턴 ${number ? Number(number) : ''}`.trim(), state.pages.indexOf(patternPage), {
      ref:patternRef, mode:'pattern',
    }));
  });
  nav.appendChild(makeButton('전체 지문', nassIndex, {
    active:page?.sec === 'nass' && page?.navScope === 'overview', mode:'overview',
  }));
}

function buildPageContent(wrap, page) {
  if (page.kind === 'pattern') {
    // 패턴 카드: hero는 카드 내부 상단으로 보냄 (이미지 있으면 데이터 숨김, 없으면 일반 카드)
    wrap.appendChild(renderPatternCard(page.row, page.hero));
    if ((page.reps || []).length) wrap.appendChild(renderRepertoryCard(page.reps || []));
    return;
  }
  if (page.hero) wrap.appendChild(renderHero(page.hero));
  if (page.kind === 'list') {
    if (page.sec === 'nass') renderNassPage(wrap, page.cards);
    else page.cards.forEach(c => wrap.appendChild(renderCard(c)));
  } else if (page.kind === 'drill') {
    renderDrillPage(wrap, page.rows || [], page.chapter);
  }
}

function renderBody() {
  const body = document.getElementById('body');
  body.innerHTML = '';

  if (!state.pages.length) {
    body.innerHTML = '<div class="m-empty">이 유닛에는<br>아직 표시할 데이터가 없습니다.</div>';
    return;
  }

  // 3-pane 캐러셀 구조: [prev | current | next] — 가운데가 -33.333% 위치
  const strip = document.createElement('div');
  strip.className = 'm-strip';

  const buildPane = (pageIdx) => {
    const pane = document.createElement('div');
    pane.className = 'm-pane';
    if (pageIdx >= 0 && pageIdx < state.pages.length) {
      const wrap = document.createElement('div');
      wrap.className = 'm-page';
      if (state.pages[pageIdx]?.sec === 'ptn') {
        wrap.classList.add('pattern-page');
        if ((state.pages[pageIdx]?.reps || []).length) wrap.classList.add('has-reps');
      }
      buildPageContent(wrap, state.pages[pageIdx]);
      pane.appendChild(wrap);
    }
    return pane;
  };

  strip.appendChild(buildPane(state.page - 1));
  strip.appendChild(buildPane(state.page));
  strip.appendChild(buildPane(state.page + 1));

  body.appendChild(strip);
  // 가운데 pane이 보이도록 위치 (애니메이션 없이)
  strip.style.transform = 'translateX(-33.333%)';
}

function renderHero(id, opts = {}) {
  // type=expi 대표 이미지. 배포 파일명은 {id}.png이며 GCS 실패 시 로컬 미러를 한 번 재시도한다.
  const wrap = document.createElement('div');
  wrap.className = 'm-hero-wrap';
  const img = document.createElement('img');
  img.className = 'm-hero';
  img.alt = '';
  img.onerror = () => {
    if (!img.dataset.localTried) {
      img.dataset.localTried = '1';
      img.src = `${IMG_LOCAL_BASE}/${encodeURIComponent(id)}.png?v=${IMG_VERSION}`;
      return;
    }
    wrap.remove();
    opts.onFail?.();
  };
  img.onload = () => { opts.onLoad?.(); };
  img.src = `${IMG_BASE}/${encodeURIComponent(id)}.png?v=${IMG_VERSION}`;
  wrap.appendChild(img);
  return wrap;
}

function renderCard(row) {
  const el = document.createElement('div');
  el.className = 'm-card ' + (row._kind || '')
    + (isPlusRow(row) ? ' plus-card' : '')
    + (isExpPlus(row) ? ' exp-plus' : '')
    + (isNassPlus(row) ? ' nass-plus' : '');

  const pair = document.createElement('div');
  pair.className = 'm-pair';
  const left = document.createElement('div');
  left.className = 'm-pair-left';
  const right = document.createElement('div');
  right.className = 'm-pair-right';
  const flagsHtml = renderFlags(row);
  if (row.arabic) {
    const ar = document.createElement('div');
    ar.className = 'm-ar tap-audio';
    ar.innerHTML = parseInline(row.arabic);
    ar.addEventListener('click', () => playAudio(row, ar));
    // 표현 카드: 깃발 인라인 / 나스 카드: 좌측 한국어 칸 하단
    if (flagsHtml && row._kind !== 'nass') {
      const line = document.createElement('div');
      line.className = 'm-ar-line';
      line.appendChild(ar);
      const flagWrap = document.createElement('span');
      flagWrap.innerHTML = flagsHtml;
      line.appendChild(flagWrap.firstChild);
      right.appendChild(line);
    } else {
      right.appendChild(ar);
    }
  }
  const trans = row.note || row.transliteration || '';
  if (trans) {
    const tr = document.createElement('div');
    tr.className = 'm-trans';
    tr.innerHTML = parseTrans(trans);
    right.appendChild(tr);
  }
  if (row.korean) {
    const ko = document.createElement('div');
    ko.className = 'm-ko';
    ko.innerHTML = parseInline(row.korean);
    left.appendChild(ko);
  }
  if (flagsHtml && row._kind === 'nass') {
    const flagWrap = document.createElement('span');
    flagWrap.innerHTML = flagsHtml;
    left.appendChild(flagWrap.firstChild);
  }
  pair.appendChild(left);
  pair.appendChild(right);
  el.appendChild(pair);
  if (row._kind === 'nass' && row.sual) {
    const su = document.createElement('div');
    su.className = 'm-sual';
    su.innerHTML = parseInline(row.sual);
    el.appendChild(su);
  }
  // 표현(exp)·드릴의 script(설명)는 학생앱에서 노출한다 (인쇄 교재에선 숨김) — 대표 지침 2026-07-22
  if (row.script) {
    const sc = document.createElement('div');
    sc.className = 'm-script';
    sc.innerHTML = renderScriptLines(row.script);
    el.appendChild(sc);
  }
  if (isNomRow(row)) el.innerHTML = applyNomDivider(el.innerHTML);  // 명사문 `|` → 분리자
  return el;
}

function renderPatternCard(row, hero) {
  const el = document.createElement('div');
  el.className = 'm-card pattern';
  // 이미지가 실제로 로드된 경우에만 hero 모드로 전환한다.
  // 없는 이미지를 찾는 동안 패턴 본문이 늦게 나타나는 문제를 막기 위함.
  if (hero) {
    const heroWrap = renderHero(hero, {
      onLoad: () => el.classList.add('pattern-with-hero'),
      onFail: () => el.classList.remove('pattern-with-hero'),
    });
    el.appendChild(heroWrap);   // 최상단에 위치하도록 가장 먼저 append
  }
  const cssVal = (row.css || '').trim().toLowerCase();
  const isBaseline = cssVal === 'baseline' || cssVal === 'baseline2';
  const noLine = cssVal === 'baseline2';

  if (isBaseline) {
    el.appendChild(renderBaseline(row, { noLine }));
  } else if (row.arabic) {
    const ar = document.createElement('div');
    ar.className = 'm-ar tap-audio';
    ar.innerHTML = parseInline(row.arabic);
    ar.addEventListener('click', () => playAudio(row, ar));
    el.appendChild(ar);
  }
  // 기본 패턴 순서: 아랍어(가운데) → 음가 → 한국어 (인쇄교재와 통일)
  const trans = row.note || row.transliteration || '';
  if (trans && !isBaseline) {
    const tr = document.createElement('div');
    tr.className = 'm-trans';
    tr.innerHTML = parseTrans(trans);
    el.appendChild(tr);
  }
  if (row.korean) {
    const ko = document.createElement('div');
    ko.className = 'm-ko';
    ko.innerHTML = parseInline(row.korean);
    el.appendChild(ko);
  }
  // script(설명) 컬럼이 있으면 풀어서 표시
  const summary = row.script || row.summary || '';
  if (summary) {
    const sm = document.createElement('div');
    sm.className = 'm-summary';
    sm.innerHTML = renderScriptLines(summary);
    el.appendChild(sm);
  }
  if (isNomRow(row)) el.innerHTML = applyNomDivider(el.innerHTML);  // 명사문 `|` → 분리자
  return el;
}

function renderRepertoryCard(rows) {
  if (useRepertoryGrid(rows)) {
    // 그리드 모드 — 종전대로 한 표를 .m-card.repertory가 감쌈
    const el = document.createElement('div');
    el.className = 'm-card repertory';
    el.appendChild(renderRepertory(rows));
    return el;
  }
  // 디폴트 페어 모드 — 각 행을 개별 .m-card.repertory(=표현 카드와 같은 양식)로
  const wrap = document.createElement('div');
  wrap.className = 'm-rep-wrap';
  rows.forEach(r => wrap.appendChild(renderCard({ ...r, _kind: 'repertory' })));
  return wrap;
}

function useRepertoryGrid(rows) {
  const cssOf = r => (r.css || '').trim().toLowerCase();
  const gridCols = rows.reduce((cols, r) => {
    const css = cssOf(r);
    if (css === 'six') return Math.max(cols, 6);
    if (css === 'five') return Math.max(cols, 5);
    if (css === 'three') return Math.max(cols, 3);
    if (css === 'two') return Math.max(cols, 2);
    return cols;
  }, 0);
  // 그리드는 알파벳/발음 노출처럼 실제 칸을 채울 때만 사용한다.
  return gridCols > 0 && rows.length >= gridCols;
}

function renderScriptLines(text) {
  const src = String(text || '');
  const parts = [];
  let last = 0;
  src.replace(/<table\b[^>]*>[\s\S]*?<\/table>/gi, (match, offset) => {
    if (offset > last) parts.push({ type:'text', value:src.slice(last, offset) });
    parts.push({ type:'table', value:match });
    last = offset + match.length;
    return match;
  });
  if (last < src.length) parts.push({ type:'text', value:src.slice(last) });

  return parts.map(part => (
    part.type === 'table' ? renderScriptTable(part.value) : renderScriptText(part.value)
  )).filter(Boolean).join('');
}

function renderScriptText(text) {
  return String(text || '').split('\n').map(line => {
    const t = line.trim();
    if (!t) return '';
    if (t.startsWith('- ')) {
      const raw = t.slice(2);
      // 스크립트 불릿은 전부 LTR 고정 — 아랍 토큰은 흐름 안에서 RTL로 임베드(대표 지침 2026-07-21)
      return `<span class="bullet" dir="ltr">${parseInline(raw)}</span>`;
    }
    if (t.startsWith('>')) return `<span class="quote">${parseInline(t.replace(/^>\s*/, ''))}</span>`;
    return `<span class="para">${parseInline(line)}</span>`;
  }).filter(Boolean).join('');
}

function renderScriptTable(html) {
  const template = document.createElement('template');
  template.innerHTML = String(html || '');
  const sourceTable = template.content.querySelector('table');
  if (!sourceTable) return `<span class="para">${parseInline(html)}</span>`;

  const sourceRows = [...sourceTable.querySelectorAll('tr')]
    .map(row => [...row.children].filter(cell => /^(TD|TH)$/.test(cell.tagName)))
    .filter(cells => cells.length);
  if (!sourceRows.length) return `<span class="para">${parseInline(html)}</span>`;

  const decodeText = value => {
    const decoder = document.createElement('textarea');
    decoder.innerHTML = String(value || '');
    return decoder.value;
  };
  const cellLines = cell => decodeText(
    cell.innerHTML
      .replace(/<br\s*\/?>/gi, '\n')
      .replace(/<\/(?:div|p|span|small)>/gi, '\n')
      .replace(/<[^>]+>/g, '')
  ).split(/\n+/).map(line => line.trim()).filter(Boolean);
  const plainCellText = cell => cellLines(cell).join('\n');
  const hasArabic = value => /[؀-ۿݐ-ݿࢠ-ࣿﭐ-﷿ﹰ-﻿]/.test(String(value || ''));
  const hasLatin = value => /[A-Za-zÀ-ɏḀ-ỿʰ-˿]/.test(String(value || ''));

  // 시트 HTML의 class가 제거되어도 2열의 언어와 줄 구조로 예문표를 판별한다.
  const rowLooksLikePair = cells => {
    if (cells.length !== 2 || firstStrongDir(cells[0].textContent) !== 'ltr') return false;
    const rightLines = cellLines(cells[1]);
    const hasMain = Boolean(cells[1].querySelector('.script-ar-main')) ||
      rightLines.some(line => hasArabic(line));
    const hasTrans = Boolean(cells[1].querySelector('.script-trans')) ||
      rightLines.some(line => hasLatin(line) && !hasArabic(line));
    return hasMain && hasTrans;
  };
  const isPairTable = sourceTable.classList.contains('script-pair-table') ||
    sourceRows.every(rowLooksLikePair);

  const pairRowData = cells => {
    const rightCell = cells[1];
    const rightLines = cellLines(rightCell);
    const semanticMain = rightCell.querySelector('.script-ar-main')?.textContent.trim() || '';
    const semanticTrans = rightCell.querySelector('.script-trans')?.textContent.trim() || '';
    const arabicIndex = rightLines.findIndex(line => hasArabic(line));
    const arabic = semanticMain ||
      (arabicIndex >= 0 ? rightLines[arabicIndex] : rightLines[0] || '');
    const trans = semanticTrans ||
      rightLines.slice(Math.max(0, arabicIndex + 1)).find(line => hasLatin(line) && !hasArabic(line)) ||
      '';
    return {
      korean: cells[0].textContent.trim(),
      arabic,
      trans,
    };
  };

  const body = isPairTable
    ? sourceRows.map(cells => {
      const row = pairRowData(cells);
      const mainHtml = row.arabic
        ? `<span class="script-ar-main" dir="rtl">${parseInline(row.arabic)}</span>`
        : '';
      const transHtml = row.trans
        ? `<span class="script-trans" dir="ltr">${parseTrans(row.trans)}</span>`
        : '';
      return '<tr>' +
        `<td class="script-ko" dir="ltr">${parseInline(row.korean)}</td>` +
        `<td class="script-ar" dir="rtl">${mainHtml}${transHtml}</td>` +
        '</tr>';
    }).join('')
    : sourceRows.map(cells => (
      '<tr>' + cells.map(cell => {
        const tag = cell.tagName === 'TH' ? 'th' : 'td';
        const text = plainCellText(cell);
        const dir = firstStrongDir(text);
        return `<${tag} dir="${dir}">${parseInline(text)}</${tag}>`;
      }).join('') + '</tr>'
    )).join('');

  return `<table class="script-table${isPairTable ? ' script-pair-table' : ''}">${body}</table>`;
}

function renderRepertory(rows) {
  const cssOf = r => (r.css || '').trim().toLowerCase();
  const useTwo = rows.length >= 2 && rows.some(r => cssOf(r) === 'two');
  const useThree = rows.length >= 3 && rows.some(r => cssOf(r) === 'three');
  const useSix = rows.length >= 6 && rows.some(r => cssOf(r) === 'six');
  const useFive = rows.length >= 5 && rows.some(r => cssOf(r) === 'five');
  if (useTwo) return renderGridTable(rows, 'm-rep-table', false, 2);
  if (useThree) return renderGridTable(rows, 'm-rep-table', false, 3);
  if (useSix) return renderGridTable(rows, 'm-rep-table', false, 6);
  if (useFive) return renderGridTable(rows, 'm-rep-table', false);
  const wrap = document.createElement('div');
  rows.forEach(r => wrap.appendChild(renderPairRow(r)));
  return wrap;
}

function renderGridTable(rows, className = 'm-drill-table', blanks = false, cols = 5) {
  const wrap = document.createElement('div');
  wrap.className = className;
  const grid = document.createElement('div');
  grid.className = className === 'm-rep-table' ? 'm-rep-grid' : 'm-drill-grid';
  if (cols === 2) grid.classList.add('cols-two');
  else if (cols === 3) grid.classList.add('cols-three');
  else if (cols === 6) grid.classList.add('cols-six');
  rows.forEach(r => {
    const cell = document.createElement('div');
    cell.className = 'drill-cell';
    const ar = blanks ? parseDrillBlank(r.arabic || '') : parseInline(r.arabic || '');
    const tr = blanks ? parseDrillBlank(r.note || r.transliteration || '') : parseTrans(r.note || r.transliteration || '');
    const flagsHtml = renderFlags(r);
    let html;
    if (cols === 2) {
      // 2열: 한국어(해석)를 아래가 아니라 왼쪽에 두고, 아랍어+음가는 오른쪽
      html = `<span class="dc-ko m-ko">${r.korean ? parseInline(r.korean) : ''}</span>` +
        `<span class="dc-body">` +
        `<span class="m-ar-line"><span class="dc-ar tap-audio">${ar}</span>${flagsHtml}</span>` +
        `<span class="dc-trans m-trans">${tr}</span></span>`;
    } else {
      html = `
      <span class="m-ar-line"><span class="dc-ar tap-audio">${ar}</span>${flagsHtml}</span>
      <span class="dc-trans m-trans">${tr}</span>`;
    }
    cell.innerHTML = html;
    if (isNomRow(r)) cell.innerHTML = applyNomDivider(cell.innerHTML);  // 명사문 셀
    cell.querySelector('.tap-audio')?.addEventListener('click', e => playAudio(r, e.currentTarget));
    grid.appendChild(cell);
  });
  wrap.appendChild(grid);
  return wrap;
}

function renderPairRow(r, blanks = false) {
  const row = document.createElement('div');
  row.className = 'm-rep-row';
  const ar = blanks ? parseDrillBlank(r.arabic || '') : parseInline(r.arabic || '');
  const tr = blanks ? parseDrillBlank(r.note || r.transliteration || '') : parseTrans(r.note || r.transliteration || '');
  const flagsHtml = renderFlags(r);
  row.innerHTML = `
    <div class="m-row-ko m-ko">${parseInline(r.korean || '')}</div>
    <div>
      <div class="m-ar-line"><div class="m-row-ar tap-audio">${ar}</div>${flagsHtml}</div>
      <div class="m-row-trans m-trans">${tr}</div>
    </div>`;
  if (isNomRow(r)) row.innerHTML = applyNomDivider(row.innerHTML);  // 명사문 행
  row.querySelector('.tap-audio')?.addEventListener('click', e => playAudio(r, e.currentTarget));
  return row;
}

function renderDrillPage(wrap, rows, chapter) {
  const order = ['drilla','drillb','drillc','writing'];
  order.forEach(type => {
    const groupRows = rows.filter(r => normType(r.type) === type);
    if (!groupRows.length) return;
    const section = document.createElement('section');
    section.className = 'm-subsection';
    const instr = document.createElement('div');
    instr.className = 'm-instruction';
    instr.textContent = drillInstruction(type, state.unit, chapter);
    section.appendChild(instr);
    groupByRef(groupRows).forEach(group => {
      const cssOf = r => (r.css || '').trim().toLowerCase();
      const useTwo = group.rows.some(r => cssOf(r) === 'two');
      const useThree = group.rows.some(r => cssOf(r) === 'three');
      const useSix = group.rows.some(r => cssOf(r) === 'six');
      const five = group.rows.some(r => cssOf(r) === 'five') || group.rows.every(r => !r.korean);
      if (useTwo) section.appendChild(renderGridTable(group.rows, 'm-drill-table', type !== 'drilla', 2));
      else if (useThree) section.appendChild(renderGridTable(group.rows, 'm-drill-table', type !== 'drilla', 3));
      else if (useSix) section.appendChild(renderGridTable(group.rows, 'm-drill-table', type !== 'drilla', 6));
      else if (five) section.appendChild(renderGridTable(group.rows, 'm-drill-table', type !== 'drilla'));
      else {
        const box = document.createElement('div');
        group.rows.forEach(r => {
          const item = renderPairRow(r, type !== 'drilla');
          item.classList.add('m-drill-row');
          box.appendChild(item);
        });
        section.appendChild(box);
      }
    });
    wrap.appendChild(section);
  });
}

function groupByRef(rows) {
  const map = new Map();
  rows.forEach((r, index) => {
    const ref = String(r.ref_ptn || '').trim();
    // A005의 알리프(p015)·함자(p016) 드릴을 한 테이블 블록으로 이어서 보여 준다.
    // 데이터의 ref_ptn은 바꾸지 않고 표시 그룹 키만 합쳐 패턴 연결성을 보존한다.
    // (five=5칸/six=6칸 둘 다 허용 — 6+6=12칸 six 병합 지원)
    const mergeA005AlifHamza = String(r.u || '').trim() === 'A005'
      && ['five','six'].includes(String(r.css || '').trim().toLowerCase())
      && /^ptn01(?:5|6)(?:_|$)/i.test(ref);
    const key = mergeA005AlifHamza ? 'ptn015_016_a005_alif_hamza' : (ref || '__unit__');
    if (!map.has(key)) map.set(key, { key, first:index, rows:[] });
    map.get(key).rows.push(r);
  });
  return [...map.values()].sort((a, b) => {
    if (a.key === '__unit__') return 1;
    if (b.key === '__unit__') return -1;
    return a.first - b.first;
  });
}

function drillInstruction(type, unit, chapter) {
  if (type === 'drillb') {
    return /^A0[1-6]$/.test(unit) || String(chapter) === '0'
      ? '다음을 듣고 빈 칸에 들어갈 글자를 유추해 보세요'
      : '다음을 듣고 빈 칸에 들어갈 말을 유추해 보세요';
  }
  if (type === 'drillc') return '다음을 듣고 알맞은 말을 유추해 보세요';
  if (type === 'writing') return '배운 패턴을 떠올리며 직접 써 보세요';
  return '다음을 듣고 따라 읽어 보세요';
}

function renderNassPage(wrap, cards) {
  // nass 먼저, nass+는 학생앱 전용 보충 지문으로 맨 아래에 모아 표시한다.
  const rows = sortNassRows(cards.filter(r => ['nass','nass+'].includes(normType(r.type))));
  if (!rows.length) return;
  const section = document.createElement('section');
  section.className = 'm-subsection';
  rows.forEach(r => section.appendChild(renderCard(r)));
  wrap.appendChild(section);
}

function renderBaseline(row, opts = {}) {
  const noLine = !!opts.noLine;  // css='baseline2'면 가로 기준선 미표시
  const wrap = document.createElement('div');
  wrap.className = 'm-baseline' + (noLine ? ' no-line' : '');
  const grid = document.createElement('div');
  grid.className = 'm-bl-grid';
  const lines = String(row.arabic || '').split(/\n+/);
  const splitTokens = line => {
    const sep = line.includes('|') ? /\s*\|\s*/ : /\s+/;
    return line.split(sep).map(t => t.trim()).filter(Boolean);
  };
  const letters = splitTokens(lines[0] || '');
  const triples = splitTokens(lines[1] || '');
  const labels = splitTokens(row.note || row.transliteration || '');
  letters.forEach((ch, i) => {
    const cell = document.createElement('div');
    cell.className = 'm-bl-cell';
    const sp = document.createElement('div');
    sp.className = 'm-bl-letter tap-audio';
    sp.innerHTML = parseInline(ch);
    sp.addEventListener('click', () => playAudio(row, sp));
    cell.appendChild(sp);
    if (triples[i]) {
      const tri = document.createElement('div');
      tri.className = 'm-bl-triple';
      tri.innerHTML = parseInline(triples[i]);
      cell.appendChild(tri);
    }
    const lb = document.createElement('div');
    lb.className = 'm-bl-label';
    lb.innerHTML = labels[i] ? parseTrans(labels[i]) : '&nbsp;';
    cell.appendChild(lb);
    grid.appendChild(cell);
  });
  wrap.appendChild(grid);
  return wrap;
}

/* ───────── 오디오 ───────── */
function playAudio(row, el) {
  const audio = document.getElementById('player');
  if (state.audioId === el && !audio.paused) {
    audio.pause();
    el.classList.remove('playing');
    state.audioId = null;
    return;
  }
  document.querySelectorAll('.tap-audio.playing').forEach(n => n.classList.remove('playing'));
  state.audioId = null;
  const urls = audioUrlsFor(row);
  if (!urls.length) { console.warn('audio: no id/url for', row); return; }
  let idx = 0;
  const tryNext = () => {
    if (idx >= urls.length) { el.classList.remove('playing'); state.audioId = null; return; }
    audio.src = urls[idx++];
    audio.play().catch(tryNext);
  };
  audio.onended = () => { el.classList.remove('playing'); state.audioId = null; };
  audio.onerror = tryNext;
  el.classList.add('playing');
  state.audioId = el;
  tryNext();
}

/* ───────── 사이드바 (유닛 픽커) ───────── */
function buildUnitList() {
  const list = document.getElementById('unit-list');
  list.innerHTML = '';
  const rows = unitRows().filter(ok);
  state.units = rows.map(r => r.u).filter(Boolean);

  const makeLink = (className, label, unit, index, options = {}) => {
    const button = document.createElement('button');
    button.className = className;
    button.type = 'button';
    button.textContent = label;
    button.disabled = index < 0;
    button.dataset.unit = unit;
    button.dataset.page = index >= 0 ? String(index) : '';
    button.dataset.match = options.match || 'page';
    if (options.sec) button.dataset.sec = options.sec;
    if (options.ref) button.dataset.ref = options.ref;
    button.addEventListener('click', event => {
      event.stopPropagation();
      if (index < 0) return;
      goToUnitPage(
        unit,
        index,
        options.ref || '',
        options.mode || (options.ref ? 'pattern' : 'overview')
      );
      closeSidebar();
    });
    return button;
  };

  rows.forEach(r => {
    const pages = r.u === state.unit ? state.pages : buildPagesForUnit(r.u);
    const firstIndex = pages.findIndex(page => page.sec === 'exp');
    const startIndex = firstIndex >= 0 ? firstIndex : 0;
    const expIndex = pages.findIndex(page => page.sec === 'exp');
    const kalimatIndex = pages.findIndex(page => page.sec === 'kalimat');
    const nassIndex = firstOverviewNassIndex(pages);
    const expanded = state.expandedUnits.has(r.u) || r.u === state.unit;

    const li = document.createElement('li');
    li.className = 'm-unit-group' + (r.u === state.unit ? ' active' : '');
    li.dataset.unit = r.u;

    const row = document.createElement('div');
    row.className = 'm-unit-row';

    const open = document.createElement('button');
    open.className = 'm-unit-open';
    open.type = 'button';
    open.innerHTML = `
      <span class="ucode">${unitNo(r.u)}</span>
      <span class="ubody">
        <span class="uar">${(r.arabic || '').slice(0, 26)}</span>
        <span class="uko">${(r.korean || '').slice(0, 28)}</span>
      </span>`;
    open.addEventListener('click', () => {
      goToUnitPage(r.u, startIndex);
      closeSidebar();
    });

    const expand = document.createElement('button');
    expand.className = 'm-unit-expand';
    expand.type = 'button';
    expand.textContent = '›';
    expand.setAttribute('aria-label', `${unitNo(r.u)} 하위 항목`);
    expand.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    expand.addEventListener('click', event => {
      event.stopPropagation();
      if (state.expandedUnits.has(r.u)) state.expandedUnits.delete(r.u);
      else state.expandedUnits.add(r.u);
      buildUnitList();
    });

    row.append(open, expand);
    li.appendChild(row);

    const children = document.createElement('div');
    children.className = 'm-unit-children';
    children.hidden = !expanded;
    children.appendChild(makeLink('m-unit-link', '표현', r.u, expIndex, { sec:'exp', match:'section' }));
    children.appendChild(makeLink('m-unit-link', '단어', r.u, kalimatIndex, { sec:'kalimat', match:'section' }));

    pages.filter(page => page.sec === 'ptn').forEach(patternPage => {
      const ref = patternPage.ptnRefs[0];
      const patternIndex = pages.indexOf(patternPage);
      const drillIndex = firstPageIndexForPattern(ref, 'drill', pages);
      const patternNassIndex = firstPageIndexForPattern(ref, 'nass', pages);
      const number = ptnNumber(patternPage.row);
      const title = patternTitle(patternPage.row);
      const group = document.createElement('div');
      group.className = 'm-pattern-nav-group';
      group.dataset.ref = ref;

      const patternLink = makeLink(
        'm-pattern-link',
        `패턴 ${number ? Number(number) : ''}${title ? ` · ${title}` : ''}`.trim(),
        r.u,
        patternIndex,
        { ref, match:'pattern' }
      );
      group.appendChild(patternLink);

      const stages = document.createElement('div');
      stages.className = 'm-pattern-stage-row';
      stages.append(
        makeLink('m-pattern-stage', '패턴', r.u, patternIndex, { ref, sec:'ptn', match:'pattern-stage' }),
        makeLink('m-pattern-stage', '드릴', r.u, drillIndex, { ref, sec:'drill', match:'pattern-stage' }),
        makeLink('m-pattern-stage', '지문', r.u, patternNassIndex, { ref, sec:'nass', match:'pattern-stage' })
      );
      group.appendChild(stages);
      children.appendChild(group);
    });

    const unitDrillIndex = pages.findIndex(page => {
      if (page.sec !== 'drill') return false;
      const refs = pagePatternRefs(page);
      return !refs.length || !refs.some(ref => patternRowForRef(ref, pages));
    });
    if (unitDrillIndex >= 0) {
      children.appendChild(makeLink('m-unit-link', '종합 드릴', r.u, unitDrillIndex, {
        sec:'drill', match:'page',
      }));
    }
    children.appendChild(makeLink('m-unit-link', '지문 전체', r.u, nassIndex, {
      sec:'nass', match:'page',
    }));

    li.appendChild(children);
    list.appendChild(li);
  });
  syncUnitNavActive();
}

function syncUnitNavActive() {
  const currentPage = state.pages[state.page];
  const currentRef = activePatternRef(currentPage);
  document.querySelectorAll('#unit-list [data-match]').forEach(button => {
    if (button.dataset.unit !== state.unit) {
      button.classList.remove('active');
      return;
    }
    const match = button.dataset.match;
    const samePattern = currentRef && button.dataset.ref &&
      sameRef(currentRef, button.dataset.ref);
    const active =
      (match === 'page' && Number(button.dataset.page) === state.page) ||
      (match === 'section' && button.dataset.sec === currentPage?.sec) ||
      (match === 'pattern' && samePattern) ||
      (match === 'pattern-stage' && samePattern && button.dataset.sec === currentPage?.sec);
    button.classList.toggle('active', Boolean(active));
  });
}
function openSidebar()  { document.getElementById('sb').classList.add('open'); }
function closeSidebar() { document.getElementById('sb').classList.remove('open'); }

/* ───────── 한국어 토글 ───────── */
function toggleKorean() {
  state.hideKorean = !state.hideKorean;
  const app = document.getElementById('app');
  const btn = document.getElementById('toggle');
  app.classList.toggle('hide-korean', state.hideKorean);
  if (state.hideKorean) { btn.textContent = '한국어 보기';   btn.classList.remove('on'); }
  else                  { btn.textContent = '한국어 가리기'; btn.classList.add('on'); }
  localStorage.setItem('m.hide-korean', state.hideKorean ? '1' : '0');
}

/* ───────── 이동 ───────── */
function goToUnitPage(unit, index, patternRef = '', navMode = 'overview') {
  const unitChanged = unit !== state.unit;
  if (unitChanged) {
    state.unit = unit;
    state.pages = buildPagesForUnit(unit);
  }
  if (!state.pages.length) return;
  state.page = Math.max(0, Math.min(index, state.pages.length - 1));
  state.contextPtnRef = patternRef || pagePatternRefs(state.pages[state.page])[0] || '';
  state.navMode = navMode;
  state.expandedUnits.add(unit);
  if (unitChanged) buildUnitList();
  paintCurrent();
  saveURL();
}

function goPage(delta) {
  const next = state.page + delta;
  if (next < 0 || next >= state.pages.length) return;
  state.page = next;
  const nextPage = state.pages[next];
  const refs = pagePatternRefs(nextPage);
  if (!refs.some(ref => sameRef(ref, state.contextPtnRef))) {
    state.contextPtnRef = refs[0] || '';
  }
  const nextPatternRow = state.contextPtnRef ? patternRowForRef(state.contextPtnRef) : null;
  if (!nextPatternRow) {
    state.navMode = 'overview';
  } else if (!(nextPage.sec === 'nass' && state.navMode === 'overview')) {
    state.navMode = 'pattern';
  }
  paintCurrent(); saveURL();
}
function paintCurrent() {
  renderHead();
  renderContextNav();
  renderBody();
  syncUnitNavActive();
  // baseline 기준선 동적 정렬 — 폰트 로드 완료 후 첫 글자 baseline에 맞춤
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(adjustBaselines);
  } else {
    requestAnimationFrame(adjustBaselines);
  }
}

function adjustBaselines() {
  document.querySelectorAll('.m-bl-grid').forEach(grid => {
    const letter = grid.querySelector('.m-bl-letter');
    if (!letter) return;
    // height:0 + vertical-align:baseline 프로브 — 프로브 top이 곧 baseline 위치
    const probe = document.createElement('span');
    probe.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline;';
    letter.appendChild(probe);
    const probeRect = probe.getBoundingClientRect();
    const gridRect = grid.getBoundingClientRect();
    probe.remove();
    const baselineFromTop = probeRect.top - gridRect.top;
    if (baselineFromTop > 0) grid.style.setProperty('--bl-top', baselineFromTop + 'px');
  });
}

window.addEventListener('resize', () => {
  clearTimeout(window._blTimer);
  window._blTimer = setTimeout(adjustBaselines, 120);
});

/* ───────── refresh ───────── */
function refresh() {
  state.pages = buildPagesForUnit(state.unit);
  state.page = Math.min(state.page, Math.max(0, state.pages.length - 1));
  state.expandedUnits.add(state.unit);
  state.contextPtnRef = pagePatternRefs(state.pages[state.page])[0] || '';
  buildUnitList();
  paintCurrent();
}

/* ───────── URL 동기화 ───────── */
function saveURL() {
  const sp = new URLSearchParams(location.search);
  sp.set('unit', state.unit);
  sp.set('page', state.page);
  sp.set('nav', state.navMode);
  history.replaceState(null,'','?'+sp.toString());
}

/* ───────── 이벤트 ───────── */
document.getElementById('burger').onclick   = openSidebar;
document.getElementById('sb-close').onclick = closeSidebar;
document.getElementById('sb-mask').onclick  = closeSidebar;
document.getElementById('prev').onclick     = () => goPage(-1);
document.getElementById('next').onclick     = () => goPage(+1);
document.getElementById('toggle').onclick   = toggleKorean;
// 드래그-페이지 캐러셀 — 손가락 따라 strip이 이동, 임계값 넘으면 다음/이전으로 스냅
(() => {
  const body = document.getElementById('body');
  let primaryId = null;
  let startX = 0, startY = 0;
  let direction = null;          // 'h' | 'v' | null (방향 잠김 전)
  let dragging = false;
  let lastDx = 0;
  let strip = null;

  const getStrip = () => body.querySelector('.m-strip');

  body.addEventListener('pointerdown', e => {
    if (primaryId !== null) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    primaryId = e.pointerId;
    startX = e.clientX;
    startY = e.clientY;
    direction = null;
    dragging = false;
    lastDx = 0;
    strip = getStrip();
  });

  body.addEventListener('pointermove', e => {
    if (e.pointerId !== primaryId) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    // 첫 ~8px 이동 시 방향 잠금
    if (!direction) {
      if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
        direction = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
        if (direction === 'h' && strip) {
          dragging = true;
          strip.classList.add('dragging');
          try { body.setPointerCapture(primaryId); } catch (_) {}
        }
      }
    }

    if (!dragging || !strip) return;

    // 가장자리 저항 (rubber-band)
    const atFirst = state.page <= 0;
    const atLast  = state.page >= state.pages.length - 1;
    let effDx = dx;
    if (atFirst && dx > 0) effDx = dx * 0.35;
    if (atLast  && dx < 0) effDx = dx * 0.35;

    lastDx = effDx;
    strip.style.transform = `translateX(calc(-33.3333% + ${effDx}px))`;
  });

  const finish = (e, cancelled) => {
    if (e.pointerId !== primaryId) return;
    primaryId = null;

    if (!dragging || !strip) {
      dragging = false;
      strip = null;
      return;
    }
    dragging = false;
    strip.classList.remove('dragging');  // transition 다시 활성

    const vw = body.clientWidth || 375;
    const threshold = Math.min(70, vw * 0.18);  // ~18% 또는 최대 70px
    const stripEl = strip;
    strip = null;

    const commit = (delta, snapTo) => {
      stripEl.style.transform = `translateX(${snapTo})`;
      let done = false;          // transitionend·폴백 타이머 중복 실행 방지
      let timer = null;
      const cleanup = () => {
        if (done) return;        // 단 한 번만 — 안 그러면 state.page가 2칸 점프(섹션 건너뜀)
        done = true;
        clearTimeout(timer);
        stripEl.removeEventListener('transitionend', cleanup);
        if (delta !== 0) {
          goPage(delta);
        }
      };
      stripEl.addEventListener('transitionend', cleanup, { once: true });
      // transitionend 폴백 — 일부 브라우저에서 누락될 수 있음
      timer = setTimeout(cleanup, 320);
    };

    if (cancelled) {
      commit(0, '-33.3333%');
      return;
    }
    if (lastDx < -threshold && state.page < state.pages.length - 1) {
      commit(+1, '-66.6667%');
    } else if (lastDx > threshold && state.page > 0) {
      commit(-1, '0%');
    } else {
      commit(0, '-33.3333%');
    }
  };

  body.addEventListener('pointerup',     e => finish(e, false));
  body.addEventListener('pointercancel', e => finish(e, true));
})();
// 키보드 (데스크탑 미리보기용)
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown')      { e.preventDefault(); goPage(+1); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp')    { e.preventDefault(); goPage(-1); }
  else if (e.key === ' ')                                    { e.preventDefault(); toggleKorean(); }
  else if (e.key === 'm' || e.key === 'M')                  { document.getElementById('sb').classList.toggle('open'); }
  else if (e.key === 'Escape')                              { closeSidebar(); }
});

/* ───────── 초기화 ───────── */
async function init() {
  try {
    // 데이터시트sheet 는 여러 논리탭이 공유하므로 중복 제거 후 로드
    await Promise.all([...new Set(Object.values(TABS))].map(t => fetchSheet(t).catch(e => {
      console.warn('sheet load fail:', t, e); return [];
    })));

    if (localStorage.getItem('m.hide-korean') === '1') {
      state.hideKorean = true;
      document.getElementById('app').classList.add('hide-korean');
      const btn = document.getElementById('toggle');
      btn.textContent = '한국어 보기'; btn.classList.remove('on');
    }

    const sp = new URLSearchParams(location.search);
    const u  = sp.get('unit');
    const p  = parseInt(sp.get('page'));
    const navMode = sp.get('nav');
    const validUnits = unitRows().filter(ok).map(r => r.u);
    state.unit = (u && validUnits.includes(u)) ? u : (validUnits[0] || 'A001');
    if (!isNaN(p)) state.page = Math.max(0, p);
    state.navMode = ['overview','pattern'].includes(navMode) ? navMode : 'auto';

    refresh();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = '';
  } catch (e) {
    document.getElementById('loading').innerHTML =
      `<div class="m-error">로딩 실패<br><small>${e.message}</small></div>`;
    console.error(e);
  }
}

init();
</script>
