<style>

body{font-family:var(--kr);background:var(--bg);color:var(--text);line-height:1.5;padding-bottom:80px}
.top{position:sticky;top:0;z-index:10;background:rgba(238,241,246,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:12px 16px}
.top h1{font-size:1rem;letter-spacing:.3px}.top .sub{color:var(--sub);font-size:.72rem;margin-top:2px}
.tabs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tab{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 15px;font-size:.82rem;font-weight:700;cursor:pointer;color:var(--sub)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px}
.unit{display:none}.unit.active{display:block}

yn ع 은 다른 언어에서 찾기 힘든 아랍어 고유의 소리라, 입 앞이 아니라 목 안쪽에서 시작한다는 느낌으로 들어 보세요. 먼저 편하게 '아' 소리를 내고, 그 상태에서 목 안쪽 깊은 곳을 살짝 좁혀 소리를 한 번 눌러 냅니다. 숨을 막거나 세게 긁는 것이 아니라, 목 안에서 눌려 나오게 하는 것이 핵심입니다.\n\n- أَ ʾa — 목을 가볍게 터뜨리며 끊어 내는 '아'\n- عَ ʕa — 목 안쪽을 조이며 시작하는 깊은 '아-'\n\n> *أَ*مَل amal(희망) ↔ *عَ*مَل ʕamal(일) · *أَ*لَم alam(고통) ↔ *عَ*لَم ʕalam(깃발)\n> 같은 자리에 두 소리를 넣어 보면 목 안쪽이 열리고 닫히는 차이가 또렷해집니다."}, {"p": "p012", "title": "샷다 shadda (겹자음)", "arabic": "الشَّدَّة", "note": "shadda", "css": "c", "script": "글자 위에 얹힌 작은 *w 모양* 기호를 *샷다 shadda*라고 합니다. \"*같은 자음을 두 번 눌러 발음하라*\"는 신호예요. 한국어의 *엄마·언니·멀리*처럼 앞 자음을 한 박자 붙잡았다가 다음 모음으로 이어 내는 소리와 같은 원리입니다.\n\n- *엄마* — ㅁ + 마 = _m-ma_\n- *언니* — ㄴ + 니 = _n-ni_\n- *멀리* — ㄹ + 리 = _l-li_\n\n> 샷다가 붙은 글자는 지나가듯 읽지 말고, 그 자음을 살짝 붙잡았다 이어 발음하세요(muḥa*m-ma*d, ḥa*m-mā*m)."}], "repertory": {"p010": [{"arabic": "*فَ*جْر", "note": "fajr"}, {"arabic": "*قَ*مَر", "note": "qamar"}, {"arabic": "*كَ*بِير", "note": "kabīr"}, {"arabic": "*لَ*يْل", "note": "layl"}, {"arabic": "*عَ*مَل", "note": "ʕamal"}, {"arabic": "*غَ*رِيب", "note": "gharīb"}, {"arabic": "*فِ*كْر", "note": "fikr"}, {"arabic": "*قَ*رِيب", "note": "qarīb"}, {"arabic": "*كِ*تَاب", "note": "kitāb"}, {"arabic": "*لُ*غَة", "note": "lugha"}, {"arabic": "*عَ*يْن", "note": "ʕayn"}, {"arabic": "*غَ*الِي", "note": "ghālī"}], "p011": [{"arabic": "*عَ*مَل", "note": "ʕamal"}, {"arabic": "*عَ*لَم", "note": "ʕalam"}, {"arabic": "*عَ*يْن", "note": "ʕayn"}, {"arabic": "*عَ*رَب", "note": "ʕarab"}, {"arabic": "*عِ*لْم", "note": "ʕilm"}, {"arabic": "*عَ*بْد", "note": "ʕabd"}, {"arabic": "*عَ*جِيب", "note": "ʕajīb"}, {"arabic": "*عِ*يد", "note": "ʕīd"}, {"arabic": "*عُ*مْر", "note": "ʕumr"}, {"arabic": "*عَ*زِيز", "note": "ʕazīz"}], "p012": [{"arabic": "مُحَ*مَّ*د", "note": "muḥammad"}, {"arabic": "حَ*مَّ*ام", "note": "ḥammām"}, {"arabic": "جَ*دّ", "note": "jadd"}, {"arabic": "حُ*بّ", "note": "ḥubb"}, {"arabic": "كُ*لّ", "note": "kull"}, {"arabic": "عَ*مّ", "note": "ʕamm"}, {"arabic": "حَ*قّ", "note": "ḥaqq"}, {"arabic": "جَ*نَّ*ة", "note": yn ghayn (ف ق ك ل ع غ)", "focus": "의문문 hal / a-", "code": "A004"}, {"patterns": [{"p": "p013", "title": "알파벳 그룹5 sīn shīn ṣād ḍād ṭā ẓā", "arabic": "س | ش | ص | ض | ط | ظ\\nسسس | ششش | صصص | ضضض | ططط | ظظظ", "note": "sīn shīn ṣād ḍād ṭā ẓā", "css": "baseline", "script": "이 그룹은 쓰는 모양은 닮았지만, *일반음(sīn·shīn)*과 *강조음(ṣād·ḍād·ṭā·ẓā)*을 나눠 연습해야 합니다. 강조음은 혀끝을 윗니 뒤에 대고, 혀의 나머지를 입안 바닥으로 낮게 떨어뜨려 소리를 *무겁게* 눌러 냅니다. 처음엔 완벽하기보다 '가벼운 소리 ↔ 무거운 소리'의 차이를 귀로 느껴 보세요.\n\n- sīn س — 가벼운 s. 'Sun'의 s\n- shīn ش — sh. 'Shoes'의 sh\n- ṣād ص — 무거운 s. sīn 의 강조음\n- ḍād ض — 무거운 d. 아랍어에만 있는 특유의 소리('ḍād 의 언어'로 불릴 만큼)\n- ṭā ط — 무거운 t. tā 의 강조음\n- ẓā ظ — 무거운 th(ð). dhāl 의 강조음\n\n> *سَ*لَام salām ↔ *صَ*لَاح ṣalāḥ · *تِ*ين tīn ↔ *طِ*ين ṭīn 처럼 가벼운/무거운 짝을 비교해 보세요."}, {"p": "p014", "title": "태양문자와 달문자 (정관사 الـ)", "arabic": "الشَّمْس وَالْقَمَر", "note": "ash-shams wa al-qamar", "css": "baseline", "script": "아랍어의 정관사는 الـ al- 하나뿐입니다. 영어 'the'처럼 *특정한 그것*을 가리켜요. 그런데 뒤에 오는 글자에 따라 발음이 둘로 갈립니다.\n\n- 달문자 앞: ل 소리를 살려 또렷하게 [al-]. a*l-qa*mar الْقَ*مَر*\n- 태양문자 앞: ل 소리를 내지 않고, 다음 자음에 샷다를 얹어 두 번 누르듯. a*sh-sha*ms الشَّ*مْس*, a*s-sa*lām السَّ*لَام*\n\n태양문자 = ت ث د ذ ر ز س ش ص ض ط ظ ل ن (혀·이 근처 소리) / 달문자 = ا ب ج ح خ ع غ ف ق ك م ه و ي.\n\n> 두 그룹은 예문을 소리 내어 읽다 보면 자연히 익습니다. 따로 외우지 말고 الـ 뒤 발음이 어떻게 달라지는지 귀로 익혀 보세요."}, {"p": "p015", "title": "전치사 + 정관사 (min / fi + al)", "arabic": "أَنَا مِنَ الْأُرْدُنّ.", "note": "anā mina al-urdunn", "css": "baseline", "script": "\"저는 요르단에서 왔어요\", \"그는 마르카즈에 있어요\"처럼 어디서 왔는지·어디에 있는지 말할 수 있습니다. 이때 مِنْ min(~에서/from), فِي fī(~에/in) 같은 전치사를 씁니다.\n\n전치사 뒤에 정관사 الـ 이 오면 두 단어가 이어져 들립니다.\n- مِنْ + الْأُرْدُنّ → مِنَ الْأُرْدُنّ mina l-urdunn (min 의 끝이 -a 로 이어짐)\n- فِي + الْبَيْت → فِي الْبَيْت fī l-bayt\n\n> 전치사는 뒤 단어와 붙여 한 호흡으로 읽으면 자연스럽습니다. 연음에 유의해 보세요."}], "repertory": {"p013": [{"arabic": "*سَ*لَام", "note": "salām"}, {"arabic": "*شَ*مْس", "note": "shams"}, {"arabic": "*صَ*دِيق", "note": "ṣadīq"}, {"arabic": "*ضَ*يْف", "note": "ḍayf"}, {"arabic": "*طَ*رِيق", "note": "ṭarīq"}, {"arabic": "*ظَ*رِيف", function inl(s){if(s==null)return'';return String(s)
  .replace(/\*([^*]+)\*/g,'<span class="hl">$1</span>')
  .replace(/_([^_]+)_/g,'<span class="box">$1</span>');}
function scriptHtml(t){return String(t||'').split('\n').map(l=>{const s=l.trim();
  if(!s)return'';if(s.startsWith('- '))return`<span class="bullet">${inl(s.slice(2))}</span>`;
  if(s.startsWith('>'))return`<span class="quote">${inl(s.replace(/^>\s*/,''))}</span>`;
  return`<span class="para">${inl(s)}</span>`;}).join('');}
function grid(items,css){if(!items||!items.length)return'';const c=css==='six'?'c6':'c5';
  return`<div class="grid ${c}">`+items.map(it=>`<div class="cell"><div class="a">${inl(it.arabic)}</div><div class="n">${inl(it.note||'')}</div></div>`).join('')+`</div>`;}
function render(){const tabs=document.getElementById('tabs'),wrap=document.getElementById('wrap');
 DATA.forEach((u,i)=>{const t=document.createElement('div');t.className='tab'+(i===0?' active':'');t.textContent=(i+3)+'과 '+u.code;t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.unit').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById('unit'+i).classList.add('active');window.scrollTo(0,0);};tabs.appendChild(t);
  const sec=document.createElement('div');sec.className='unit'+(i===0?' active':'');sec.id='unit'+i;
  let h=`<div class="uhead"><span class="code">${u.code}</span><h2>${u.title.replace(/^유닛\d+ A\d+ — /,'')}</h2><div class="focus">문법초점 · ${u.focus}</div></div>`;
  h+=`<div class="seclabel">패턴 · 래퍼토리 · 드릴</div>`;
  u.patterns.forEach(p=>{h+=`<div class="pcard"><div class="phdr"><div><div class="pnum">${p.p} · ${p.css}</div></div><div class="par">${inl(p.arabic.replace(/\\n/g,'<br>'))}</div><div class="pmeta"><div class="pnote">${p.note}</div></div></div>`;
    h+=`<div class="script">${scriptHtml(p.script)}</div>`;
    if(u.repertory[p.p])h+=`<div class="gridwrap"><div class="gridlabel">래퍼토리 repertory</div>${grid(u.repertory[p.p],p.p==='p010'||p.p==='p013'?'six':'five')}</div>`;
    if(u.drills[p.p])h+=`<div class="gridwrap"><div class="gridlabel">드릴 drill (${u.drills[p.p].length})</div>${grid(u.drills[p.p],'five')}</div>`;
    h+=`</div>`;});
  if(u.twoset.length){h+=`<div class="seclabel">추가 드릴세트 (two) — 짧은 문장</div><div class="twogrid">`+
    u.twoset.map(t=>`<div class="twocard"><div class="a">${inl(t.arabic)}</div><div class="k">${t.korean}</div><div class="n">${inl(t.note)}</div></div>`).join('')+`</div>`;}
  h+=`<div class="seclabel">표현 expression (5)</div>`;
  u.expressions.forEach(e=>{h+=`<div class="exp${e.rep?' rep':''}"><div class="exprow"><div class="a">${inl(e.arabic)}</div><div class="meta"><div class="k">${e.korean}${e.rep?'<span class="badge">대표</span>':''}</div><div class="n">${inl(e.note)}</div><div class="lahja">${e.lahja}${e.img==='TRUE'?' · 🖼 일러스트':''}</div></div></div>${e.script?`<div class="s">${inl(e.script)}</div>`:''}</div>`;});
  sec.innerHTML=h;wrap.appendChild(sec);});}
render();
</script></body></html>
