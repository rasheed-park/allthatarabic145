<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>올댓아라빅 1.4.4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@500;700&family=Noto+Kufi+Arabic:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/spoqa/spoqa-han-sans@latest/css/SpoqaHanSansNeo.css" rel="stylesheet">
<style>
@font-face {
  font-family: 'Dongol';
  src: url('../assets/fonts/Dongol-Regular.otf') format('opentype');
  font-weight: normal;
  font-style: normal;
}
/* ── 리셋 & 변수 ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:     #F2F4F6;
  --surface:#FFFFFF;
  --accent: #1D49FF;
  --text:   #12205A;
  --sub:    #888FAC;
  --border: #D5DAE8;
  --accent-soft: rgba(29,73,255,0.08);
  --accent-wash: #EAF0FF;
}
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Spoqa Han Sans Neo', 'Apple SD Gothic Neo', sans-serif;
  height: 100vh;
  position: relative;
}

/* ── 4 코너 ── */
#ui-tl, #ui-bl, #ui-br { position: fixed; z-index: 10; }
#ui-tl {
  top: clamp(1rem,3vw,2rem); left: clamp(1rem,3vw,3rem);
  font-size: clamp(0.8rem,1.8vw,1.3rem);
  font-weight: bold; color: var(--text);
  line-height: 1.4; max-width: 75vw;
}
#ui-tr {
  font-size: clamp(0.55rem,0.85vw,0.75rem);
  text-transform: uppercase;
  letter-spacing: 2.5px;
  color: var(--sub);
  opacity: 0.65;
  white-space: nowrap;
  margin-bottom: 0.5rem;
}
#ui-bl {
  bottom: clamp(1rem,3vw,2rem); left: clamp(1rem,3vw,3rem);
  font-size: clamp(0.65rem,1.2vw,1rem);
  color: var(--sub);
}
#ui-br {
  bottom: clamp(1rem,3vw,2rem); right: clamp(1rem,3vw,3rem);
}
#ui-br img {
  width: clamp(60px, 7vw, 110px);
  opacity: 0.85;
  display: block;
}

/* ── 진행바 ── */
#progress {
  position: fixed; top: 0; left: 0;
  height: 3px; background: var(--accent);
  transition: width 0.3s; z-index: 50;
}

/* ── 메인 콘텐츠 ── */
#main {
  position: fixed;
  top: 0; bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: min(92vw, 1400px);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(1rem, 3vh, 2.5rem);
  padding: clamp(60px,10vh,100px) clamp(1rem,4vw,3rem) clamp(80px,12vh,120px);
}

/* ── baseline 모드: CSS Grid 정렬 ── */
.bl-wrap { position:relative; width:100%; }
.bl-wrap.no-line .bl-line { display:none; }  /* css='baseline2' — 기준선 미표시 */
.bl-line {
  position:absolute; left:0; right:0; height:1.5px;
  background:rgba(29,73,255,0.3); pointer-events:none; z-index:0;
}
.bl-grid {
  display:grid;
  grid-template-columns:repeat(var(--items,5), 1fr);
  direction:rtl;
  width:100%;
  column-gap:clamp(6px,3vw,28px);
  row-gap:clamp(28px,3vw,48px);
}
.bl-letter {
  text-align:center;
  font-family:'Noto Sans Arabic',serif;
  font-size:clamp(3.5rem,10vw,9rem);  /* 일반 .arabic과 동일 크기 */
  font-weight:700; line-height:1; color:var(--text);
}
.bl-triple {
  text-align:center;
  font-family:'Noto Sans Arabic',serif;
  font-size:clamp(1.1rem,4vw,3.5rem);  /* letter의 약 40% — 위치별 연결형 */
  font-weight:500; line-height:1.2; color:var(--text);
  white-space:nowrap;
}
.bl-label {
  text-align:center;
  font-size:clamp(1.05rem,2.6vw,2.5rem);  /* 일반 .note와 동일 크기 */
  font-weight:500;
  color:var(--sub); letter-spacing:0.3px;
}

/* ── 아랍어 ── */
.arabic {
  font-family: 'Noto Sans Arabic', serif;
  font-size: clamp(3.5rem, 10vw, 9rem);  /* 일반: 10vw + max 9rem (큰 화면에서 baseline에 추월 안 됨) */
  font-weight: 700;
  direction: rtl;
  line-height: 1.6;
  text-align: center;
}
/* A/G 유닛: 문장형이라 폰트 살짝 축소 (일반보다 작지만 sentence 자체도 baseline과 격차 좁힘) */
.arabic.arabic-sentence {
  font-size: clamp(2.5rem, 8vw, 8rem);
}

/* ── 한국어/노트 ── */
.korean {
  display: block;
  font-size: clamp(1.4rem, 4vw, 4rem);  /* 키움: 3.5vw→4vw, max 3.5→4rem */
  transition: opacity 0.3s;
  line-height: 1.4;
}
.note {
  display: block;
  font-size: clamp(1.25rem, 3.2vw, 3rem);  /* 키움: 2.6vw→3.2vw, max 2.5→3rem */
  color: var(--sub);
  text-align: center;
  transition: opacity 0.3s;
  line-height: 1.4;
  margin-top: 0.4em;
}
/* ── writing 타입 ── */
.arabic-writing {
  font-family: 'Dongol', 'Noto Kufi Arabic', 'Noto Sans Arabic', serif !important;
  font-weight: normal;
  letter-spacing: 0.05em;
}
/* ── write 애니메이션 모드 ── */
.write-pair-row {
  display: flex; flex-direction: row-reverse;
  align-items: baseline;
  gap: clamp(4px, calc(12cqi / var(--items, 4)), 20px);
}
.write-pair {
  display: flex; flex-direction: column;
  align-items: center;
  gap: clamp(10px, 2.5vw, 24px);
}
.write-arabic-letter {
  font-family: 'Dongol', 'Noto Kufi Arabic', serif;
  font-weight: 400;
  font-size: clamp(3.5rem, calc(90cqi / var(--items, 3)), 10rem);
  color: var(--text);
  line-height: 1;
}
.write-token {
  display: inline-block;
  vertical-align: baseline;
  clip-path: inset(-40% 0% -40% 100%); /* 완전히 숨김 (오른쪽에서 왼쪽으로 등장) */
}
.write-pair-label {
  font-size: clamp(0.6rem, 1.2vw, 0.85rem);
  font-weight: 500;
  color: var(--sub);
  text-align: center;
  white-space: nowrap;
  letter-spacing: 0.02em;
}
/* ── 나스 korean 힌트 ── */
.nass-korean-hint {
  font-size: clamp(0.9rem, 2vw, 1.6rem);  /* 키움: 일반 .korean의 ~40% — 다른 슬라이드보다 작지만 인지 가능 */
  color: var(--sub);
  opacity: 0.85;
  text-align: center;
  margin-top: 0.5rem;
}
#arabic-area { container-type: inline-size; width: 100%; }
#text-area { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; min-height: 2rem; }
.slide-illustration {
  width: min(100%, 1000px);
  margin: 0 auto clamp(0.8rem, 2vh, 1.5rem);
}
.slide-illustration img {
  display: block;
  width: 100%;
  max-height: 38vh;
  object-fit: contain;
}
.lesson-illustration {
  padding: 20px 48px 0;
  background: #fff;
}
.lesson-illustration img {
  display: block;
  width: 100%;
  max-height: 250px;
  object-fit: contain;
}

/* ── 하이라이트 ── */
.highlight-box {
  border: 3px solid var(--accent);
  background: rgba(29,73,255,0.08);
  border-radius: 14px;
  padding: 0.3em 0.45em 0.25em;
  margin: 0 0.2em;
  display: inline-block;
  vertical-align: middle;
  min-width: 1.4em;
  text-align: center;
  line-height: 1.3;
}
.highlight-text { color: var(--accent); font-weight: bold; }
/* Arabic 글리프가 포함된 강조는 weight 변경 금지 — Safari/CoreText의 weight
   경계에서 텍스트 런이 쪼개져 셰이핑(글자 연결)이 끊긴다. 색만 적용. */
.highlight-text.hl-ar { font-weight: inherit; }

/* ── 명사문 구분자 (`css = 'nom'`) — 시작어 ‖ 서술어 ── */
.nom-divider {
  display: inline-block;
  color: var(--sub);
  opacity: 0.4;
  font-size: 0.55em;     /* 부모 폰트의 55% — 세로 길이 작게 */
  font-weight: 200;      /* 얇게 (Extra Light) */
  margin: 0 0.5em;
  vertical-align: 0.2em; /* 살짝 위로 — 글자 중앙 부근에 위치 */
  user-select: none;
}

/* ── 드릴B 빈칸 (*X* 가리기) — 글자 자체는 안 보이게, 박스만 노출 ── */
.drill-blank {
  display: inline;  /* ⚠️ inline 필수 — inline-block은 Arabic shaping 끊김 */
  color: transparent;
  -webkit-text-fill-color: transparent;
  background-color: rgba(18,32,90,0.14);
  border-radius: 6px;
  padding: 0 4px;
}
.note .drill-blank,
.korean .drill-blank {
  background-color: rgba(18,32,90,0.10);  /* 음가는 살짝 더 옅게 */
}

/* ── 나스 슬라이드 ── */
.nass-prompt {
  display: flex; flex-direction: column;
  align-items: center; gap: 0.8rem;
  min-height: 4rem;
}
.nass-sual {
  font-family: 'Noto Kufi Arabic', 'Noto Sans Arabic', serif;
  font-size: clamp(1.1rem, 2.5vw, 2.2rem);
  font-weight: 400;
  color: var(--sub);
  direction: rtl;
  text-align: center;
}
.nass-arabic-wrap {
  max-height: 55vh; overflow-y: auto;
  width: 100%; padding: 0 clamp(1rem,5vw,4rem);
}
.nass-arabic-wrap .arabic {
  font-family: 'Noto Sans Arabic', serif;
  font-size: clamp(1.2rem, 3.2vw, 3.8rem);
  text-align: center;
  direction: rtl;
  line-height: 2;
}
.nass-sual-note {
  font-family: 'Noto Kufi Arabic', 'Noto Sans Arabic', serif;
  font-size: clamp(0.75rem, 1.5vw, 1.3rem);
  color: var(--sub);
  direction: rtl;
  text-align: center;
  margin-top: 0.3em;
  opacity: 0.8;
}
.nass-note {
  font-size: clamp(0.85rem, 1.7vw, 1.4rem);  /* 키움: 일반 .note의 ~50% */
  color: var(--sub);
  text-align: center;
  line-height: 1.6;
  opacity: 0.85;
}

/* ── 사이드바 ── */
#sidebar {
  position: fixed; top: 0; left: 0;
  width: min(440px, 92vw); height: 100%;
  background: rgba(245,247,252,0.98);
  border-right: 2px solid var(--accent);
  transform: translateX(-100%);
  transition: transform 0.3s ease;
  z-index: 200;
  display: flex; flex-direction: column;
  box-shadow: 5px 0 30px rgba(29,73,255,0.12);
}
#sidebar.open { transform: translateX(0); }
.sb-head {
  padding: 1.2rem 1.8rem 1rem;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sb-head h2 {
  color: var(--accent);
  font-size: clamp(0.85rem,1.6vw,1.1rem);
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 0.9rem;
}
/* 단축키 목록 */
.key-list { list-style: none; }
.key-row {
  display: flex; align-items: center; gap: 10px;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
  font-size: clamp(0.62rem,1.1vw,0.8rem);
  color: var(--sub);
}
.key-row:last-child { border-bottom: none; }
.key-row .key-desc { flex: 1; }
.key-row .key-icon { font-size: 1em; opacity: 0.7; width: 1.2em; text-align: center; flex-shrink: 0; }
.key {
  display: inline-flex; align-items: center; justify-content: center;
  background: #fff; border: 1.5px solid var(--border);
  padding: 1px 7px; border-radius: 5px;
  font-weight: 700; color: var(--text);
  font-size: 0.85em; white-space: nowrap;
  box-shadow: 0 1px 3px rgba(29,73,255,0.08);
  min-width: 1.8em;
}

#index-list {
  list-style: none; overflow-y: auto; flex: 1; padding: 0.4rem 0;
}
.idx-item {
  padding: 0.6rem 1.6rem;
  font-size: clamp(0.72rem,1.5vw,1rem);
  color: var(--sub); cursor: pointer;
  border-left: 4px solid transparent;
  transition: all 0.15s;
  display: flex; gap: 0.7rem; align-items: center;
}
.idx-info { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.idx-item:hover { background: rgba(29,73,255,0.06); color: var(--text); }
.idx-item.active { background: rgba(29,73,255,0.1); color: var(--text); border-left-color: var(--accent); }
.idx-tag {
  font-size: 0.7em; color: var(--accent);
  background: rgba(29,73,255,0.1);
  padding: 1px 6px; border-radius: 4px;
  flex-shrink: 0; text-transform: uppercase;
  font-weight: 700;
}

.idx-ko { font-size: 0.78em; color: var(--sub); display: block; margin-top: 1px; direction: ltr; text-align: left; }
.idx-ar { font-family: 'Noto Sans Arabic', serif; direction: rtl; text-align: left; }


/* ── 섹션 탭 (메인 화면 상단) ── */
#section-tabs {
  display: flex; gap: 0.4rem; flex-wrap: nowrap; align-items: center; margin-top: 0;
}
.sec-tab {
  background: #fff; border: 1.5px solid var(--border); border-radius: 6px;
  color: var(--sub); cursor: pointer; font-family: inherit;
  font-size: clamp(0.5rem, 0.85vw, 0.68rem); line-height: 1.3;
  padding: 2px 9px; text-align: center; transition: all 0.15s; white-space: nowrap;
}
.sec-tab small { display: block; font-size: 0.85em; opacity: 0.7; }
.sec-tab:hover { border-color: var(--accent); color: var(--accent); }
.sec-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: bold; }
.sec-tab.disabled { opacity: 0.25; cursor: default; pointer-events: none; }

/* ── 하단 단축키 바 ── */
#toolbar {
  position: fixed;
  bottom: clamp(0.8rem,2vw,1.5rem);
  left: 50%; transform: translateX(-50%);
  display: flex; gap: clamp(0.7rem,1.8vw,1.5rem);
  z-index: 30; align-items: center;
  background: rgba(255,255,255,0.85);
  border: 1px solid var(--border);
  border-radius: 30px;
  padding: 5px 18px;
  backdrop-filter: blur(8px);
  box-shadow: 0 2px 12px rgba(29,73,255,0.08);
}
.tb-btn {
  background: transparent; border: none;
  color: var(--sub); cursor: pointer;
  font-size: clamp(0.55rem,0.82vw,0.72rem);
  font-family: inherit;
  display: flex; align-items: center; gap: 4px;
  opacity: 0.7; transition: opacity 0.15s, color 0.15s;
  padding: 2px 0;
  white-space: nowrap;
}
.tb-btn:hover { opacity: 1; color: var(--accent); }
.tb-btn.active { opacity: 1; color: var(--accent); }
.tb-btn .kb {
  display: inline-flex; align-items: center; justify-content: center;
  background: #fff; border: 1.5px solid var(--border);
  border-radius: 4px; padding: 0px 5px;
  font-size: 0.88em; color: var(--text); font-weight: 700;
  min-width: 1.6em;
  box-shadow: 0 1px 2px rgba(29,73,255,0.07);
}
/* 네비 버튼(좌/우 화살표) — 아이패드·마우스 모두 동작. 라벨 없이 큰 화살표 아이콘. */
.tb-btn.tb-nav {
  font-size: clamp(0.95rem, 1.4vw, 1.25rem);
  font-weight: 700;
  padding: 2px 10px;
  opacity: 0.75;
  line-height: 1;
}
.tb-btn.tb-nav:hover { opacity: 1; }
.tb-btn.tb-nav:disabled { opacity: 0.25; pointer-events: none; }
#btn-nass { display: none; }

/* ── 로딩 ── */
#loading {
  position: fixed; inset: 0;
  background: var(--accent);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 1.4rem;
  z-index: 999;
}
#loading img {
  width: clamp(80px, 12vw, 140px);
  filter: brightness(0) invert(1);
}
#loading .loading-label {
  font-size: clamp(0.7rem, 1.2vw, 0.95rem);
  color: rgba(255,255,255,0.75);
  letter-spacing: 2.5px;
  text-transform: lowercase;
  font-weight: 400;
}

/* ── 시작 오버레이 ── */
#start-overlay {
  position: fixed; inset: 0;
  background: rgba(235,238,248,0.95);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 998; cursor: pointer;
  gap: 1.2rem;
}
#start-overlay .start-logo {
  width: clamp(80px, 10vw, 140px);
  margin-bottom: 0.5rem;
}
#start-overlay .start-text {
  font-size: clamp(0.9rem, 2vw, 1.3rem);
  color: var(--sub);
  letter-spacing: 1px;
}
#start-overlay .start-btn {
  margin-top: 0.5rem;
  padding: 0.6em 2em;
  border: 1.5px solid var(--accent);
  border-radius: 30px;
  background: transparent;
  color: var(--accent);
  font-size: clamp(0.9rem, 1.8vw, 1.2rem);
  font-family: inherit;
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
#start-overlay .start-btn:hover {
  background: var(--accent); color: #fff;
}

/* ── 교재 초안 B5 뷰 ── */
body.book-view {
  overflow: auto;
  min-height: 100%;
  height: auto;
  background:
    linear-gradient(180deg, rgba(29,73,255,0.05), rgba(29,73,255,0) 280px),
    var(--bg);
}
body.book-view #progress,
body.book-view #ui-tl,
body.book-view #ui-bl,
body.book-view #ui-br,
body.book-view #sidebar,
body.book-view #main,
body.book-view #toolbar,
body.book-view #start-overlay {
  display: none !important;
}
#book-root {
  width: 100%;
  min-height: 100vh;
  padding: clamp(18px, 3vw, 42px);
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 28px;
}
body.book-view #book-root { display: flex; }
.book-page {
  width: min(92vw, 860px);
  aspect-ratio: 176 / 250;
  min-height: 1220px;
  background: var(--surface);
  border: 1px solid rgba(18,32,90,0.08);
  box-shadow: 0 22px 70px rgba(18,32,90,0.16);
  padding: clamp(22px, 2.4vw, 34px);
  position: relative;
  overflow: hidden;
}
.book-page::before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 9px;
  background: var(--accent);
}
.book-header {
  display: grid;
  grid-template-columns: 94px 1fr;
  gap: 16px;
  align-items: stretch;
  margin-bottom: 14px;
}
.book-unit-badge {
  background: var(--accent);
  color: #fff;
  min-height: 88px;
  padding: 13px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border-radius: 7px;
  position: relative;
  overflow: hidden;
}
.book-unit-badge::after {
  content: "";
  position: absolute;
  right: -28px;
  bottom: -34px;
  width: 90px;
  height: 90px;
  border: 18px solid rgba(255,255,255,0.18);
  border-radius: 50%;
}
.book-unit-label {
  font-size: 12px;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  opacity: 0.82;
}
.book-unit-no {
  font-size: 36px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: 0;
}
.book-title-band {
  background: var(--accent-wash);
  border-left: 7px solid var(--accent);
  padding: 14px 18px;
  border-radius: 7px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
}
.book-title-ar {
  font-family: 'Noto Sans Arabic', serif;
  direction: rtl;
  text-align: left;
  font-size: clamp(28px, 3.5vw, 42px);
  line-height: 1.25;
  font-weight: 700;
  color: var(--text);
}
.book-title-ko {
  margin-top: 4px;
  font-size: 16px;
  color: var(--sub);
  line-height: 1.45;
}
.book-patterns {

            if (!h) return;
            const cell = row.c?.[i];
            const _val = (cell && cell.v != null)
              ? (cell.f != null && (
                   (typeof cell.v === 'string' && cell.v.startsWith('Date(')) ||
                   typeof cell.v === 'number'
                 ) ? cell.f : cell.v)
              : null;
            obj[h] = _val != null ? String(_val).trim() : '';
          });
          return compat145(obj);
        }).filter(r => Object.values(r).some(v => v !== ''));
        _cache[cacheKey] = rows;
        resolve(rows);
      } catch(e) { reject(e); }
    };
    const script = document.createElement('script');
    const param = gid ? `gid=${gid}` : `sheet=${encodeURIComponent(real)}`;
    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&${param}&headers=1`;
    script.onerror = () => { clearTimeout(timer); delete window[cb]; reject(new Error('Fail: '+cacheKey)); };
    document.head.appendChild(script);
  });
  _inflight[cacheKey] = p;
  p.finally(() => { delete _inflight[cacheKey]; });
  return p;
}

// ── parseText ──────────────────────────────────────────
function parseText(str) {
  if (!str) return '';
  return str
    .replace(/<br\s*\/?>/gi, '<br>')
    .replace(/\n|\r\n|\r/g, '<br>')
    .replace(/_([^_\n]+)_/g, '<span class="highlight-box">$1</span>')
    // *…* 안에 Arabic이 있으면 hl-ar 클래스 추가 → weight 상속 (Safari 셰이핑 보존)
    .replace(/\*([^*\n]+)\*/g, (_, m) => {
      const hasAr = /[؀-ۿݐ-ݿࢠ-ࣿﭐ-﷿ﹰ-﻿]/.test(m);
      return `<span class="highlight-text${hasAr ? ' hl-ar' : ''}">${m}</span>`;
    });
}

// 첫 강한 방향 문자로 LTR/RTL 판정 — 마크업(`*_<tag>`) 제거 후 검사.
// 아랍어 시작 → 'rtl', 라틴/한글 시작 → 'ltr'. (불릿/산문 줄 단위)
function firstStrongDir(raw) {
  const t = String(raw || '').replace(/<[^>]+>/g, '').replace(/[*_]/g, '');
  for (const ch of t) {
    const c = ch.codePointAt(0);
    if ((c >= 0x0600 && c <= 0x06FF) || (c >= 0x0750 && c <= 0x077F) ||
        (c >= 0x08A0 && c <= 0x08FF) || (c >= 0xFB50 && c <= 0xFDFF) ||
        (c >= 0xFE70 && c <= 0xFEFF)) return 'rtl';
    if ((c >= 0x41 && c <= 0x5A) || (c >= 0x61 && c <= 0x7A) ||
        (c >= 0xAC00 && c <= 0xD7A3) || (c >= 0x3130 && c <= 0x318F)) return 'ltr';
  }
  return 'ltr';
}

// ── parseDrillBlank — 드릴B 전용: *X* → 같은 배경색 박스로 가리기 ──
function parseDrillBlank(str) {
  if (!str) return '';
  return str
    .replace(/<br\s*\/?>/gi, '<br>')
    .replace(/\n|\r\n|\r/g, '<br>')
    .replace(/_([^_\n]+)_/g, '<span class="highlight-box">$1</span>')
    .replace(/\*([^*\n]+)\*/g, '<span class="drill-blank">$1</span>');
}

// ── applyNomDivider — `css = 'nom'` 명사문 구분자: `|` → 옅은 회색 분리자
function applyNomDivider(html) {
  return html.replace(/\s*\|\s*/g, '<span class="nom-divider">|</span>');
}

// ── buildSlides ────────────────────────────────────────
async function buildSlides(baseUnit) {
  slides = [];
  nassTextVisible = false;
  currentPg = baseUnit;
  const _usp = new URLSearchParams(location.search);
  _usp.set('unit', baseUnit);
  history.replaceState(null, '', '?' + _usp.toString());

  const [unitRaw, patternRaw, drillRaw, kalimatRaw, nassRaw] = await Promise.all([
    fetchSheetData(TAB_UNIT),
    fetchSheetData(TAB_PATTERN),
    fetchSheetData(TAB_DRILL),
    fetchSheetData(TAB_KALIMAT),
    fetchSheetData(TAB_NASS),
  ]);
  const [repertoryRaw, expressionRaw] = await Promise.all([
    fetchSheetData(TAB_REPERTORY),
    fetchSheetData(TAB_EXPRESSION),
  ]);

  const ok  = okStatus;
  const inU = r => (r.u || '') === baseUnit;
  const push = (type, r) => slides.push({ type, data: r, pg: baseUnit });

  // 1. 유닛 슬라이드
  unitRaw.filter(r => inU(r) && ok(r)).forEach(r => push('unit', r));

  // 2. 패턴별: 패턴 → 레퍼토리(예문) (drillA는 별도 모음으로 분리)
  patternRaw.filter(r => inU(r) && ok(r) && normalizeType(r.type) === 'ptn').forEach(ptn => {
    push('ptn', ptn);
    const ref = ptn.id || ptn['id_ptn(no)'] || ptn.id_ptn || '';
    repertoryRaw
      .filter(r => inU(r) && ok(r) && r.ref_ptn === ref && normalizeType(r.type) === 'repertory')
      .forEach(r => push('repertory', r));
  });

  // 3+4. 드릴(drillA/B/C) — `page` 값이 있으면 page 순서대로,
  //      없으면(1·2과 등) 기존 ref_ptn 매칭 로직 유지 (교재앱과 동일 스코핑)
  const isDrill = r => ['drilla','drillb','drillc'].includes(normalizeType(r.type));
  const drillAll = drillRaw.filter(r => inU(r) && ok(r) && isDrill(r));
  const pageVal = r => (r.page || '').toString().trim();
  if (drillAll.some(r => pageVal(r) !== '')) {
    drillAll
      .map((r, i) => ({ r, i }))
      .sort((a, b) => {
        const na = parseFloat(pageVal(a.r)), nb = parseFloat(pageVal(b.r));
        const ka = pageVal(a.r) === '' || isNaN(na) ? Infinity : na;
        const kb = pageVal(b.r) === '' || isNaN(nb) ? Infinity : nb;
        return ka !== kb ? ka - kb : a.i - b.i;   // page 오름차순, 같은 page는 시트순
      })
      .forEach(({ r }) => push(normalizeType(r.type), r));
  } else {
    // drillA — 패턴별 매칭 먼저, ref_ptn 비어있는 유닛 공통 마지막
    patternRaw.filter(r => inU(r) && ok(r) && normalizeType(r.type) === 'ptn').forEach(ptn => {
      const ref = ptn.id || ptn['id_ptn(no)'] || ptn.id_ptn || '';
      drillRaw
        .filter(r => inU(r) && ok(r) && r.ref_ptn === ref && normalizeType(r.type) === 'drilla')
        .forEach(r => push('drilla', r));
    });
    drillRaw.filter(r => inU(r) && ok(r) && normalizeType(r.type) === 'drilla' && !r.ref_ptn)
      .forEach(r => push('drilla', r));
    // drillB/C (연습)
    drillRaw.filter(r => inU(r) && ok(r) &&
        (normalizeType(r.type) === 'drillb' || normalizeType(r.type) === 'drillc'))
      .forEach(r => push(normalizeType(r.type), r));
  }

  // 4. exp (표현)
  expressionRaw.filter(r => inU(r) && ok(r) && normalizeType(r.type) === 'exp')
    .forEach(r => push('exp', r));

  // 5. nass (지문) — nass + nass+ (데이터시트sheet에서 type으로 분리)
  nassRaw.filter(r => inU(r) && ok(r) && /^nass\+?$/i.test(r.type || '')).forEach(r => push('nass', r));

  // 6. kalimat (단어)
  kalimatRaw.filter(r => inU(r) && ok(r) && normalizeType(r.type) === 'kalimat')
    .forEach(r => push('kalimat', r));

  if (_firstLoad) {
    const savedSlide = parseInt(new URLSearchParams(location.search).get('slide')) || 0;
    current = Math.max(0, Math.min(slides.length - 1, savedSlide));
    _firstLoad = false;
  } else {
    current = 0;
  }

  buildIndex();
  renderSlide();
}

// ── 교재 초안 렌더링 ───────────────────────────────────
function renderScriptBlock(text) {
  if (!text) return '';
  return text
    .split(/\n+/)
    .map(line => line.trim())
    .filter(Boolean)
    .map(line => {
      if (line.startsWith('- ')) {
        const raw = line.slice(2).trim();
        // 스크립트 불릿은 전부 LTR 고정 — 아랍 토큰은 흐름 안에서 RTL로 임베드(대표 지침 2026-07-21)
        return `<div class="book-script-item" dir="ltr">${parseText(raw)}</div>`;
      }
      return `<p>${parseText(line)}</p>`;
    })
    .join('');
}

function chunkPairs(rows) {
  const pairs = [];
  for (let i = 0; i < rows.length; i += 2) pairs.push([rows[i], rows[i + 1]]);
  return pairs;
}

function hasHangul(text) {
  return /[가-힣]/.test(text || '');
}

function renderRepCell(row, chapter) {
  if (!row) return '<td class="book-rep-ko"></td><td class="book-rep-ar"></td>';
  const showTrans = String(chapter || '') === '0' && row.transliteration;
  const korean = hasHangul(row.korean) ? row.korean : '';
  return `
    <td class="book-rep-ko">${parseText(korean)}</td>
    <td class="book-rep-ar" dir="rtl">
      ${parseText(row.arabic || '')}
      ${showTrans ? `<span class="book-rep-trans">${parseText(row.transliteration)}</span>` : ''}
    </td>`;
}

function renderRepertoryTable(rows, chapter) {
  if (!rows.length) return '<div class="book-empty">이 패턴에 연결된 레퍼토리가 아직 없습니다.</div>';
  const body = chunkPairs(rows).map(pair => `
    <tr>
      ${renderRepCell(pair[0], chapter)}
      ${renderRepCell(pair[1], chapter)}
    </tr>
  `).join('');
  return `<table class="book-repertory"><tbody>${body}</tbody></table>`;
}

function firstSentence(text) {
  const clean = (text || '').replace(/\s+/g, ' ').trim();
  if (!clean) return '';
  const parts = clean.split(/(?<=[.!?。]|요\.|다\.)\s+/);
  return (parts[0] || clean).slice(0, 86);
}

function renderLessonScript(text) {
  const lines = (text || '')
    .split(/\n+/)
    .map(line => line.trim())
    .filter(Boolean);
  const prose = lines.find(line => !line.startsWith('- ')) || '';
  return `
    <div class="lesson-script">
      ${prose ? `<p>${parseText(prose)}</p>` : ''}
    </div>
  `;
}

function renderLessonArabicCell(row, chapter, extraClass = '') {
  if (!row) return `<td class="lesson-cell-ar ${extraClass}"></td>`;
  const showTrans = String(chapter || '') === '0' && row.transliteration;
  return `
    <td class="lesson-cell-ar ${extraClass}" dir="rtl">
      ${parseText(row.arabic || '')}
      ${showTrans ? `<span class="lesson-cell-trans">${parseText(row.transliteration)}</span>` : ''}
    </td>
  `;
}

function renderLessonKoreanCell(row) {
  return `<td class="lesson-cell-ko">${row && hasHangul(row.korean) ? parseText(row.korean) : ''}</td>`;
}

function renderLessonExampleTable(rows, chapter) {
  if (!rows.length) {
    return '<div class="book-empty">연결된 예문이 아직 없습니다.</div>';
  }
  const hasKorean = rows.some(row => hasHangul(row.korean));
  let tableRows = '';

  if (hasKorean) {
    for (let i = 0; i < rows.length; i += 2) {
      const left = rows[i];
      const right = rows[i + 1];
      tableRows += `
        <tr>
          ${renderLessonArabicCell(left, chapter)}
          ${renderLessonKoreanCell(left)}
          ${renderLessonArabicCell(right, chapter)}
          ${renderLessonKoreanCell(right)}
        </tr>
      `;
    }
  } else {
    for (let i = 0; i < rows.length; i += 4) {
      const group = rows.slice(i, i + 4);
      tableRows += `
        <tr>
          ${[0, 1, 2, 3].map(idx => renderLessonArabicCell(group[idx], chapter, 'lesson-cell-ar-only')).join('')}
        </tr>
      `;
    }
  }

  return `<table class="lesson-example-table"><tbody>${tableRows}</tbody></table>`;
}

function renderLessonExampleBlock(title, rows, chapter) {
  return `
    <section class="lesson-example-table-wrap">
      <div class="lesson-table-title">
        <span class="lesson-table-icon">☷</span>
        <strong>${title}</strong>
      </div>
      ${renderLessonExampleTable(rows, chapter)}
    </section>
  `;
}

async function renderUnitBook(baseUnit) {
  document.body.classList.add('book-view');
  currentPg = baseUnit;

  const [unitRaw, patternRaw, repertoryRaw] = await Promise.all([
    fetchSheetData(TAB_UNIT),
    fetchSheetData(TAB_PATTERN),
    fetchSheetData(TAB_REPERTORY),
  ]);

  const ok = okStatus;
  const unit = unitRaw.find(r => r.u === baseUnit && ok(r)) || unitRaw.find(r => r.u === baseUnit) || {};
  const chapter = unit.c || '';
  const marks = ['أ', 'ب', 'ج', 'د', 'هـ', 'و', 'ز', 'ح'];
  const patterns = patternRaw
    .filter(r => r.u === baseUnit && ok(r) && normalizeType(r.type) === 'ptn')
    .sort((a, b) => (a.id || a['id_ptn(no)'] || a.id_ptn || '').localeCompare(b.id || b['id_ptn(no)'] || b.id_ptn || '', undefined, { numeric: true }));

  const pages = patterns.map((ptn, idx) => {
    const ref = ptn.id || ptn['id_ptn(no)'] || ptn.id_ptn || '';
    const reps = repertoryRaw
      .filter(r => r.u === baseUnit && ok(r) && normalizeType(r.type) === 'repertory' && r.ref_ptn === ref);
    const unitNo = fmtU(baseUnit);
    const mark = marks[idx] || (idx + 1);
    const noteText = ptn.note || ptn.transliteration || '';
    return `
      <article class="book-page lesson-page">
        <header class="lesson-hero">
          <div class="lesson-unit-card">
            <div class="lesson-unit-label">Unit</div>
            <div class="lesson-unit-no">${parseText(unitNo)}</div>
          </div>
          <div class="lesson-head-main">
            <div class="lesson-pattern-label">Pattern ${idx + 1}</div>
            <div class="lesson-title">${parseText(mark)}. ${parseText(ptn.korean || unit.korean || baseUnit)}</div>
            <div class="lesson-head-ko">${parseText(unit.korean || '')}</div>
          </div>
        </header>
        ${slideIllustrationHtml(ptn, 'lesson-illustration')}
        <main class="lesson-main">
          <div class="lesson-arabic" dir="rtl">${parseText(ptn.arabic || '')}</div>
          <div class="lesson-trans">${parseText(noteText)}</div>
          <div class="lesson-korean">${parseText(ptn.korean || '')}</div>
          ${renderLessonScript(ptn.script || ptn.memo || '')}
        </main>
        <section class="lesson-practice">
          ${renderLessonExampleBlock('예문', reps, chapter)}
        </section>
        <footer class="lesson-footer">
          <span><strong>All That Arabic</strong> 1.4.4 B5 draft</span>
          <span class="lesson-page-number">${parseText(unitNo)} · ${idx + 1}/${patterns.length}</span>
        </footer>
      </article>
    `;
  });

  document.getElementById('book-root').innerHTML = pages.length
    ? pages.join('')
    : '<article class="book-page lesson-page"><div class="book-empty">이 유닛의 confirmed 패턴이 아직 없습니다.</div></article>';
}

// ── renderSlide ────────────────────────────────────────
function renderSlide() {
  if (!slides.length) return;
  const s = slides[current];

  // 진행바
  document.getElementById('progress').style.width = ((current+1)/slides.length*100)+'%';

  // 중앙 타입 레이블 업데이트 (라하 깃발은 메인 콘텐츠 음가 밑으로 이동, ui-tr엔 안 둠)
  const typeLabel = TYPE_EN[s.type] || s.type.toUpperCase();
  const nassNum = s.type === 'nass' ? (() => { const m = getRowId(s.data).match(/(\d+)$/); return m ? ' · nass-' + m[1] : ''; })() : '';
  document.getElementById('ui-tr').innerHTML = typeLabel + nassNum;

  // 라하 깃발 (멀티 라하 지원: 'GLF, LEV' → 두 개 표시)
  const flagSrcs = (s.data?.lahja || '').toUpperCase().split(/[,\s]+/).map(t => t.trim()).filter(Boolean)
    .map(l => LAHJA_FLAG[l]).filter(Boolean);
  const lahjaBlockHtml = flagSrcs.length
    ? `<div class="lahja-block" style="margin-top:0.6rem; display:flex; justify-content:center; gap:0.4rem;">${
        flagSrcs.map(src => `<img src="${src}" style="width:clamp(22px,1.8vw,32px); height:clamp(22px,1.8vw,32px); border-radius:50%; opacity:0.92;">`).join('')
      }</div>`
    : '';

  // 상단 좌측: 현재 유닛 정보(unit탭) + 섹션 탭
  const tl = document.getElementById('ui-tl');
  const curPgU = s.pg || '';
  const unitRow = (_cache[TAB_UNIT] || []).find(r => r.u === curPgU);
  const tlArabic = (unitRow?.arabic || '').substring(0, 30);
  const tlKorean = (unitRow?.korean || '').substring(0, 28);
  tl.innerHTML =
    `<div style="display:flex;align-items:center;gap:1.4rem;">` +
      `<div>` +
        `<div style="font-size:clamp(0.45rem,0.7vw,0.6rem);text-transform:uppercase;letter-spacing:2px;color:var(--sub);opacity:0.6;margin-bottom:0.5rem;">${fmtU(curPgU)}</div>` +
        `<div style="font-family:'Noto Sans Arabic',serif;direction:rtl;font-size:clamp(0.9rem,1.8vw,1.4rem);font-weight:700;line-height:1.4;margin-bottom:0.35rem;">${tlArabic}</div>` +
        `<div style="font-size:clamp(0.6rem,1vw,0.85rem);color:var(--sub);font-weight:400;line-height:1.5;">${tlKorean}</div>` +
      `</div>` +
      `<div id="section-tabs"></div>` +
    `</div>`;
  buildSectionTabs();

  // (btn-nass 제거됨 — 지문은 항상 자동 표시)
  // 오디오 버튼: 패턴 슬라이드에서는 숨김
  document.getElementById('btn-audio').style.display = s.type === 'ptn' ? 'none' : '';

  // ── 나스 슬라이드 ──
  if (s.type === 'nass') {
    renderNass(s); updateIndex(); return;
  }

  // ── 일반 슬라이드 (pattern / repertory / drill / exp / writing) ──
  const d = s.data;
  const cssMode = (d.css||'').trim();

  if (cssMode === 'baseline' || cssMode === 'baseline2') {
    renderBaseline(s, { noLine: cssMode === 'baseline2' });
    updateIndex(); return;
  }

  if (cssMode === 'write') {
    renderWrite(s);
    updateIndex(); return;
  }

  const isWriting = s.type === 'writing';
  const isSentence = /^[AG]/i.test(s.pg || '');
  const isDrillB   = s.type === 'drillb';
  const isNom      = cssMode === 'nom';
  const parseAr = isDrillB ? parseDrillBlank : parseText;  // 드릴B는 *X* 가리기
  const arOp = arabicVisible ? '1' : '0';
  let arHtml = parseAr(d.arabic || '');
  if (isNom) arHtml = applyNomDivider(arHtml);  // 명사문: `|`를 옅은 분리자로
  document.getElementById('arabic-area').innerHTML =
    `${slideIllustrationHtml(d)}<div class="arabic${isWriting ? ' arabic-writing' : ''}${isSentence ? ' arabic-sentence' : ''}" style="opacity:${arOp};transition:opacity 0.3s;">${arHtml}</div>`;

  const op = meaningVisible ? '1' : '0';
  const noteText = d.note || d.transliteration || '';
  let koHtml = parseText(d.korean || '');
  let noteHtml = parseAr(noteText);
  if (isNom) {
    koHtml = applyNomDivider(koHtml);
    noteHtml = applyNomDivider(noteHtml);
  }
  document.getElementById('text-area').innerHTML = `
    <div class="korean" style="opacity:${op}">${koHtml}</div>
    ${noteText ? `<div class="note" style="opacity:${op}">${noteHtml}</div>` : ''}
    ${lahjaBlockHtml}
  `;

  updateIndex();
}

function renderBaseline(s, opts = {}) {
  const noLine = !!opts.noLine;  // css='baseline2'면 가로 기준선 미표시
  const d = s.data;
  // 1줄: 단일 글자 / 2줄: 위치별 연결형 (둘 다 `|` 또는 공백으로 토큰 구분)
  const splitTokens = line => {
    const sep = line.includes('|') ? /\s*\|\s*/ : /\s+/;
    return line.split(sep).map(t => t.trim()).filter(Boolean);
  };
  const lines = (d.arabic || '').split(/\n+/);
  const letters = splitTokens(lines[0] || '');
  const triples = splitTokens(lines[1] || '');
  const labelSrc = (d.note || d.transliteration || d.korean || '').trim();
  const labels = labelSrc ? splitTokens(labelSrc).map(l => l.replace(/_/g, ' ')) : [];
  const hasTriples = triples.length > 0;
  const arOp = arabicVisible ? '1' : '0';

  const arabicArea = document.getElementById('arabic-area');
  arabicArea.innerHTML = slideIllustrationHtml(d);
  arabicArea.style.cssText = `opacity:${arOp};transition:opacity 0.3s;`;

  const wrap = document.createElement('div');
  wrap.className = 'bl-wrap' + (noLine ? ' no-line' : '');

  let line = null;
  if (!noLine) {
    line = document.createElement('div');
    line.className = 'bl-line';
    wrap.appendChild(line);
  }

  const grid = document.createElement('div');
  grid.className = 'bl-grid';
  if (hasTriples) grid.classList.add('has-triple');
  grid.style.setProperty('--items', letters.length || 4);

  // 행 1: 단일 글자
  let firstLetter = null;
  letters.forEach(ch => {
    const letter = document.createElement('span');
    letter.className = 'bl-letter';
    letter.innerHTML = parseText(ch);
    grid.appendChild(letter);
    if (!firstLetter) firstLetter = letter;
  });

  // 행 2: 위치별 연결형 (데이터에 두 번째 줄이 있을 때만)
  if (hasTriples) {
    letters.forEach((_, i) => {
      const tri = document.createElement('span');
      tri.className = 'bl-triple';
      tri.innerHTML = triples[i] ? parseText(triples[i]) : '&nbsp;';
      grid.appendChild(tri);
    });
  }

  // 행 3 (또는 2): 음가 라벨
  letters.forEach((_, i) => {
    const lbl = document.createElement('span');
    lbl.className = 'bl-label';
    lbl.innerHTML = labels[i] ? parseText(labels[i]) : '&nbsp;';
    grid.appendChild(lbl);
  });

  wrap.appendChild(grid);
  arabicArea.appendChild(wrap);

  // 오버플로 축소 + baseline 선 위치 (noLine이면 선 측정 스킵)
  requestAnimationFrame(() => {
    if (!grid.isConnected) return;
    const avail = (arabicArea.clientWidth ?? 0) - 48;
    const actual = grid.scrollWidth;
    if (actual > avail && avail > 0) {
      const sc = Math.max(0.65, avail / actual);
      grid.style.transform = `scale(${sc.toFixed(4)})`;
      grid.style.transformOrigin = 'center top';
    }
    if (line) {
      requestAnimationFrame(() => {
        if (!grid.isConnected || !firstLetter) return;
        const probe = document.createElement('span');
        probe.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline;overflow:hidden;';
        firstLetter.appendChild(probe);
        const wrapRect  = wrap.getBoundingClientRect();
        const probeRect = probe.getBoundingClientRect();
        probe.remove();
        if (wrapRect.height > 0)
          line.style.top = (probeRect.bottom - wrapRect.top) + 'px';
      });
    }
  });

  document.getElementById('text-area').innerHTML = '';
}

function renderWrite(s) {
  const d = s.data;
  const tokens = (d.arabic || '').trim().split(/\s+/).filter(Boolean);
  const noteText = d.note || d.transliteration || '';
  const labels = noteText
    ? noteText.trim().split(/\s+/).map(l => l.replace(/_/g, ' '))
    : [];

  const arabicArea = document.getElementById('arabic-area');
  arabicArea.innerHTML = slideIllustrationHtml(d);

  const pairRow = document.createElement('div');
  pairRow.className = 'write-pair-row';
  pairRow.style.setProperty('--items', tokens.length || 1);

  tokens.forEach((ch, i) => {
    const pair = document.createElement('div');
    pair.className = 'write-pair';

    const letter = document.createElement('span');
    letter.className = 'write-arabic-letter';

    const token = document.createElement('span');
    token.className = 'write-token';
    token.textContent = ch;
    letter.appendChild(token);
    pair.appendChild(letter);

    if (labels[i]) {
      const label = document.createElement('span');
      label.className = 'write-pair-label';
      label.textContent = labels[i];
      pair.appendChild(label);
    }
    pairRow.appendChild(pair);

    // 오른쪽→왼쪽 wipe 애니메이션 (글자 길이에 비례한 속도)
    const charCount = Array.from(ch).length;
    const wipeDuration = 0.5 + charCount * 0.5;
    setTimeout(() => {
      if (!token.isConnected) return;
      token.style.transition = `clip-path ${wipeDuration}s linear`;
      requestAnimationFrame(() => {
        token.style.clipPath = 'inset(-40% 0% -40% 0%)';
      });
    }, 400 + i * (wipeDuration * 1000 + 600));
  });

  arabicArea.appendChild(pairRow);

  // 오버플로 축소 보정
  requestAnimationFrame(() => {
    if (!pairRow.isConnected) return;
    const avail = (arabicArea.clientWidth ?? 0) - 48;
    const actual = pairRow.scrollWidth;
    if (actual > avail && avail > 0) {
      const sc = Math.max(0.6, avail / actual);
      pairRow.style.transform = `scale(${sc.toFixed(4)})`;
      pairRow.style.transformOrigin = 'center top';
    }
  });

  // 한국어 번역 (meaningVisible 토글 적용)
  const op = meaningVisible ? '1' : '0';
  document.getElementById('text-area').innerHTML =
    `<div class="korean" style="opacity:${op}">${parseText(d.korean || '')}</div>`;
}

function renderNass(s) {
  const d = s.data;
  const sual = d.sual || '';
  // sual 없으면 arabic 바로 표시, 있으면 T로 토글
  const showArabic = nassTextVisible || !sual;

  const nassTextHtml = `
    <div class="nass-arabic-wrap">
      <div class="arabic" dir="rtl">${parseText(d.arabic || '')}</div>
    </div>`;

  const promptHtml = `<div class="nass-prompt"></div>`;

  document.getElementById('arabic-area').innerHTML =
    slideIllustrationHtml(d) + (showArabic ? (nassTextHtml + promptHtml) : promptHtml);

  const op = meaningVisible ? '1' : '0';
  document.getElementById('text-area').innerHTML = `
    ${d.korean ? `<div class="nass-korean-hint" style="opacity:${op}">${parseText(d.korean)}</div>` : ''}
    ${d.note ? `<div class="nass-note" style="opacity:${op}">${parseText(d.note)}</div>` : ''}
    ${sual ? `<div class="nass-sual-note">${parseText(sual)}</div>` : ''}
  `;
}

// ── 의미 토글 — 모든 슬라이드 타입에서 동작 (현재 슬라이드 재렌더) ──
function toggleMeaning() {
  if (!slides.length) return;
  meaningVisible = !meaningVisible;
  document.getElementById('btn-meaning').classList.toggle('active', !meaningVisible);
  // 각 렌더 경로(general/nass/baseline/write)가 meaningVisible(=op)을 직접 반영하므로
  // 슬라이드 타입과 무관하게 재렌더만 하면 어디서든 켜고/끌 수 있음.
  renderSlide();
}

// ── 본문(아랍어) 토글 ──────────────────────────────────
function toggleArabic() {
  arabicVisible = !arabicVisible;
  document.getElementById('btn-arabic').classList.toggle('active', !arabicVisible);
  const el = document.querySelector('#arabic-area .arabic');
  if (el) el.style.opacity = arabicVisible ? '1' : '0';
}

// ── 나스 지문 토글 (T 키만 — 버튼 제거됨, 키바인딩만 유지) ─────
function toggleNass() {
  nassTextVisible = !nassTextVisible;
  const s = slides[current];
  if (s?.type === 'nass') renderNass(s);
}

// ── 사이드바 ──────────────────────────────────────────
function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('open', sidebarOpen);
  document.getElementById('btn-menu').classList.toggle('active', sidebarOpen);
}


// ── 섹션 탭 ────────────────────────────────────────────
const SEC_FIXED = [
  { key:'drilla',  ko:'드릴', en:'Drill A'    },
  { key:'drillb',  ko:'연습', en:'Drill B'    },
  { key:'drillc',  ko:'심화', en:'Drill C'    },
  { key:'exp',     ko:'표현', en:'Expression' },
  { key:'nass',    ko:'지문', en:'Nass'       },
  { key:'kalimat', ko:'단어', en:'Kalimat'    },
];
function buildSectionTabs() {
  const container = document.getElementById('section-tabs');
  if (!container) return;
  container.innerHTML = '';
  const curPg = slides[current]?.pg;

  // 패턴별 동적 탭 — 두 줄: "패턴" + 패턴 번호 (예: ptn001)
  slides.forEach((s, idx) => {
    if (s.pg !== curPg || s.type !== 'ptn') return;
    const _pm = (s.data['id_ptn(no)'] || s.data.id || '').match(/p(?:tn)?0*(\d+)/i);
    const ptnNo = _pm ? _pm[1].padStart(2, '0') : '';
    const btn = document.createElement('button');
    btn.className = 'sec-tab';
    btn.dataset.key = 'ptn_' + idx;
    btn.onclick = () => goTo(idx);
    btn.innerHTML = `패턴<small>${ptnNo}</small>`;
    container.appendChild(btn);
  });

  // 고정 탭 (연습/표현/지문/단어)
  SEC_FIXED.forEach(sec => {
    const firstIdx = slides.findIndex(s => s.pg === curPg && s.type === sec.key);
    const btn = document.createElement('button');
    btn.className = 'sec-tab' + (firstIdx === -1 ? ' disabled' : '');
    btn.dataset.key = sec.key;
    if (firstIdx !== -1) btn.onclick = () => goTo(firstIdx);
    btn.innerHTML = `${sec.ko}<small>${sec.en}</small>`;
    container.appendChild(btn);
  });

  updateSectionTabs();
}

function updateSectionTabs() {
  const container = document.getElementById('section-tabs');
  if (!container) return;
  const curType = slides[current]?.type;

  // 패턴 하위 슬라이드(ptn/repertory/writing)이면 가장 가까운 이전 ptn 탭 활성화
  // drilla는 별도 탭(Drill A)으로 분리됨
  let activePtnKey = null;
  if (curType === 'ptn' || curType === 'repertory' || curType === 'writing') {
    for (let i = current; i >= 0; i--) {
      if (slides[i]?.type === 'ptn') { activePtnKey = 'ptn_' + i; break; }
    }
  }

  container.querySelectorAll('.sec-tab').forEach(btn => {
    const k = btn.dataset.key;
    let isActive = false;
    if (activePtnKey && k === activePtnKey) isActive = true;
    else if (!activePtnKey && k === curType) isActive = true;
    btn.classList.toggle('active', isActive);
  });
}
// ── 인덱스 빌드 ───────────────────────────────────────
function buildIndex() {
  const list = document.getElementById('index-list');
  list.innerHTML = '';

  const unitRaw = _cache[TAB_UNIT] || [];
  unitRaw
    .filter(okStatus)
    .forEach(r => {
      const u  = r.u || '';
      const ar = (r.arabic  || '').substring(0, 28);
      const ko = (r.korean  || '').substring(0, 26);
      const li = document.createElement('li');
      li.className = 'idx-item';
      li.dataset.u = u;
      li.innerHTML =
        `<span class="idx-tag">${fmtU(u)}</span>` +
        `<span class="idx-info">` +
          `<span class="idx-ar">${ar}</span>` +
          `<span class="idx-ko">${ko}</span>` +
        `</span>`;
      list.appendChild(li);
    });
}

function updateIndex() {
  const curU = slides[current]?.data?.u || '';
  document.querySelectorAll('.idx-item').forEach(el => {
    el.classList.toggle('active', el.dataset.u === curU);
  });
  const active = document.querySelector('.idx-item.active');
  if (active) active.scrollIntoView({ block:'nearest', behavior:'smooth' });
}

// buildUnitButtons 제거 — 내비게이터로 대체

// ── 오디오 URL (1.4.4 신구조: audio/{유닛}/{id}.{ext}) ─────────
// datasheet url 컬럼 우선, 없으면 GCS 자동 조합 (mp3 → wav 순)
// 나스 포함 모든 행: 오디오는 행당 한 파일 audio/{U}/{id}.{mp3|wav}.
// (나스의 화자순서 seq는 시트→오디오 생성 파이프라인이 목소리를 배치하는 용도이고,
//  앱은 완성된 한 파일을 그대로 재생한다.)
function getAudioUrls(s) {
  if (!s) return [];
  const d = s.data;
  const id = getRowId(d);
  if (d?.url) return [d.url.trim()];
  if (!id) return [];
  const unit = (d?.u || s.pg || '').trim();
  if (!unit) return [];
  const enc = encodeURIComponent(id.normalize('NFD')).replace(/%2C/gi, ',');
  const base = `${AUDIO_BASE}/audio/${unit}/${enc}`;
  return [base + '.mp3', base + '.wav'];
}

function toggleAudio() {
  const audio = document.getElementById('slide-audio');
  const s = slides[current];
  const urls = getAudioUrls(s);
  const btn = document.getElementById('btn-audio');
  if (audioPlaying) {
    audio.pause(); audio.currentTime = 0;
    audioPlaying = false;
    btn.classList.remove('active');
  } else if (urls.length) {
    const onEnd = () => { audioPlaying = false; btn.classList.remove('active'); };
    // onerror와 play().catch가 동시에 발화할 수 있으므로 guard flag 사용
    const tryPlay = (i) => {
      if (i >= urls.length) { onEnd(); return; }
      let fired = false;
      const advance = () => { if (!fired) { fired = true; tryPlay(i + 1); } };
      audio.onended = onEnd;
      audio.onerror = advance;
      audio.src = urls[i];
      audio.load();
      audio.play().catch(advance);
    };
    tryPlay(0);
    audioPlaying = true;
    btn.classList.add('active');
  }
}

// ── 내비게이션 ────────────────────────────────────────
function goTo(n) {
  if (!slides.length) return;
  const audio = document.getElementById('slide-audio');
  if (audioPlaying) {
    audio.pause(); audio.currentTime = 0; audioPlaying = false;
    document.getElementById('btn-audio').classList.remove('active');
  }
  current = Math.max(0, Math.min(slides.length - 1, n));
  const _sp = new URLSearchParams(location.search);
  _sp.set('slide', current);
  history.replaceState(null, '', '?' + _sp.toString());
  nassTextVisible = false;
  renderSlide();
}

// ── 키보드 ────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  switch(e.key) {
    case 'ArrowRight': case 'ArrowDown': e.preventDefault(); goTo(current+1); break;
    case 'ArrowLeft':  case 'ArrowUp':   e.preventDefault(); goTo(current-1); break;
    case ' ':          e.preventDefault(); toggleMeaning(); break;
    case 'a': case 'A': toggleArabic(); break;
    case 'm': case 'M': toggleSidebar(); break;
    case 't': case 'T': if (slides[current]?.type === 'nass') toggleNass(); break;
    case 's': case 'S': toggleAudio(); break;
    case 'Escape': if (sidebarOpen) toggleSidebar(); break;
    case 'End':  e.preventDefault(); goTo(slides.length - 1); break;
    case 'Home': e.preventDefault(); goTo(0); break;
  }
});

// ── 버튼 이벤트 ───────────────────────────────────────
document.getElementById('btn-menu').onclick    = toggleSidebar;
document.getElementById('btn-audio').onclick   = toggleAudio;
document.getElementById('btn-meaning').onclick = toggleMeaning;
document.getElementById('btn-arabic').onclick  = toggleArabic;
document.getElementById('btn-prev').onclick    = () => goTo(current - 1);
document.getElementById('btn-next').onclick    = () => goTo(current + 1);
// 버튼 클릭 후 포커스 해제 — Space가 버튼 재클릭으로 이중 발동되는 것 방지
['btn-menu','btn-audio','btn-meaning','btn-arabic','btn-nass','btn-prev','btn-next'].forEach(id => {
  const b = document.getElementById(id);
  if (b) b.addEventListener('click', () => b.blur());
});

// ── 스와이프 제스처 (아이패드·마우스 모두 동작) ─────────
// pointer events 기반. 좌우 스와이프 → 이전/다음 슬라이드.
// UI 요소(버튼·사이드바·섹션탭) 위에서 시작한 제스처는 무시.
(() => {
  let primaryId = null;
  let startX = 0, startY = 0;
  let direction = null;   // 'h' | 'v' | null
  let dragging = false;
  const SWIPE_THRESHOLD = 60;
  const DIR_LOCK_MIN = 8;

  const isUIElement = el => !!el?.closest?.('button, #sidebar, #toolbar, #section-tabs, #ui-tl, .sec-tab, .idx-item, audio');

  document.addEventListener('pointerdown', e => {
    if (primaryId !== null) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (isUIElement(e.target)) return;
    primaryId = e.pointerId;
    startX = e.clientX;
    startY = e.clientY;
    direction = null;
    dragging = false;
  });

  document.addEventListener('pointermove', e => {
    if (e.pointerId !== primaryId) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (!direction && (Math.abs(dx) > DIR_LOCK_MIN || Math.abs(dy) > DIR_LOCK_MIN)) {
      direction = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
      if (direction === 'h') dragging = true;
    }
  });

  const finish = e => {
    if (e.pointerId !== primaryId) return;
    primaryId = null;
    if (!dragging) { dragging = false; direction = null; return; }
    dragging = false;
    direction = null;
    const dx = e.clientX - startX;
    if (dx <= -SWIPE_THRESHOLD)      goTo(current + 1);  // 왼쪽 스와이프 → 다음
    else if (dx >=  SWIPE_THRESHOLD) goTo(current - 1);  // 오른쪽 스와이프 → 이전
  };

  document.addEventListener('pointerup', finish);
  document.addEventListener('pointercancel', finish);
})();

// ── 초기화 ────────────────────────────────────────────
// 내비게이터 클릭 — 이벤트 위임
document.addEventListener('click', function(e) {
  const item = e.target.closest('#index-list .idx-item');
  if (!item || !item.dataset.u) return;
  buildSlides(item.dataset.u).catch(err => console.error(err));
  if (sidebarOpen) toggleSidebar();
});

async function init() {
  try {
    // 모든 탭 병렬 캐싱
    await Promise.all([
      fetchSheetData(TAB_UNIT),
      fetchSheetData(TAB_PATTERN),
      fetchSheetData(TAB_REPERTORY),
      fetchSheetData(TAB_DRILL),
      fetchSheetData(TAB_EXPRESSION),
      fetchSheetData(TAB_KALIMAT),
      fetchSheetData(TAB_NASS),
    ]);
    // 첫 시작 유닛: unit탭 기준
    const unitRaw = _cache[TAB_UNIT] || [];
    const baseUnits = unitRaw
      .filter(okStatus)
      .map(r => r.u || '')
      .filter(Boolean);

    const params = new URLSearchParams(location.search);
    const savedPg = params.get('unit');
    const startPg = (savedPg && baseUnits.includes(savedPg)) ? savedPg : (baseUnits[0] || 'A001');
    const view = (params.get('view') || params.get('mode') || '').toLowerCase();
    if (view === 'book' || view === 'sheet' || view === 'print') {
      await renderUnitBook(startPg);
    } else {
      await buildSlides(startPg);
    }
  } catch(e) {
    document.getElementById('loading').textContent = '로딩 실패: ' + e.message;
    console.error(e); return;
  }
  document.getElementById('loading').style.display = 'none';
}

init();
</script>
